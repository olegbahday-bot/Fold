<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ScreenParty Sync</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

*{
    box-sizing:border-box;
}

#startScreen{
    position:absolute;
    inset:0;
    z-index:100;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
}

.panel{
    width:92%;
    max-width:430px;
    background:#222;
    border-radius:16px;
    padding:20px;
}

h1{
    text-align:center;
    font-size:24px;
    margin:0 0 18px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
}

input,select,button{
    width:100%;
    min-height:44px;
    border:0;
    border-radius:9px;
    padding:8px 12px;
    font-size:16px;
}

input,select{
    background:#333;
    color:#fff;
}

button{
    margin-top:8px;
    background:#2979ff;
    color:#fff;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.roleRow{
    display:flex;
    gap:8px;
}

.roleRow button{
    flex:1;
    background:#444;
}

.roleRow button.active{
    background:#2979ff;
}

#status{
    text-align:center;
    margin-top:12px;
    color:#aaa;
    font-size:14px;
}

#videoPlayer{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#000;
    object-fit:fill;
    transform-origin:center center;
}

#mainUI{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#controls{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;
    padding:8px;
    background:rgba(0,0,0,.72);
    border-radius:12px;
    pointer-events:auto;
}

#timeline{
    width:100%;
    height:30px;
    margin:0;
    padding:0;
}

#timeText{
    text-align:center;
    font-size:12px;
    margin:2px 0 5px;
}

.buttons{
    display:flex;
    gap:5px;
}

.buttons button{
    width:auto;
    flex:1;
    min-height:38px;
    margin:0;
    padding:5px;
}

#calibration{
    position:absolute;
    left:8px;
    right:8px;
    top:8px;
    z-index:30;
    background:rgba(0,0,0,.82);
    border-radius:12px;
    padding:10px;
    pointer-events:auto;
    display:none;
}

#calibration.show{
    display:block;
}

.calrow{
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:5px;
}

.calrow span{
    width:70px;
    font-size:13px;
}

.calrow button{
    flex:1;
    margin:0;
    min-height:36px;
}

.calvalue{
    width:55px;
    text-align:center;
}

#connectionInfo{
    position:absolute;
    top:5px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    background:rgba(0,0,0,.55);
    border-radius:15px;
    padding:4px 10px;
    font-size:11px;
    pointer-events:none;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div id="startScreen">

    <div class="panel">

        <h1>ScreenParty Sync</h1>

        <div class="roleRow">
            <button id="hostRole" class="active">
                Головний<br>(Host - S25+)
            </button>

            <button id="clientRole">
                Другий<br>(Client - S10)
            </button>
        </div>

        <label>Положення екрана</label>

        <select id="position">
            <option value="left">Ліворуч</option>
            <option value="right">Праворуч</option>
        </select>

        <label>Код кімнати</label>

        <input
            id="roomCode"
            inputmode="numeric"
            maxlength="5"
            placeholder="5 цифр">

        <label>Відео</label>

        <input
            id="videoFile"
            type="file"
            accept="video/*">

        <button id="startBtn">
            Створити кімнату
        </button>

        <button id="connectBtn" class="hidden">
            Підключитися
        </button>

        <div id="status">
            Готово
        </div>

    </div>

</div>


<video
    id="videoPlayer"
    playsinline
    webkit-playsinline
    preload="auto">
</video>


<div id="connectionInfo">
    Не підключено
</div>


<div id="mainUI">

    <div id="controls">

        <input
            id="timeline"
            type="range"
            min="0"
            max="100"
            step="0.01"
            value="0">

        <div id="timeText">
            00:00 / 00:00
        </div>

        <div class="buttons">

            <button id="playBtn">▶</button>
            <button id="pauseBtn">⏸</button>
            <button id="restartBtn">↺</button>
            <button id="fullscreenBtn">⛶</button>
            <button id="calibrationBtn">⚙</button>

        </div>

    </div>


    <div id="calibration">

        <div class="calrow">
            <span>Масштаб</span>
            <button id="scaleDown">−</button>
            <div id="scaleValue" class="calvalue">1.00</div>
            <button id="scaleUp">+</button>
        </div>

        <div class="calrow">
            <span>Вліво/вправо</span>
            <button id="leftBtn">←</button>
            <div id="offsetXValue" class="calvalue">0</div>
            <button id="rightBtn">→</button>
        </div>

        <div class="calrow">
            <span>Вгору/вниз</span>
            <button id="upBtn">↑</button>
            <div id="offsetYValue" class="calvalue">0</div>
            <button id="downBtn">↓</button>
        </div>

        <div class="calrow">
            <button id="resetBtn">Скинути</button>
            <button id="saveBtn">Зберегти</button>
            <button id="closeBtn">✕</button>
        </div>

    </div>

</div>


<script>

const videoPlayer =
    document.getElementById('videoPlayer');

const startScreen =
    document.getElementById('startScreen');

const statusEl =
    document.getElementById('status');

const connectionInfo =
    document.getElementById('connectionInfo');

const roomCodeInput =
    document.getElementById('roomCode');

const videoFile =
    document.getElementById('videoFile');

const positionSelect =
    document.getElementById('position');

const startBtn =
    document.getElementById('startBtn');

const connectBtn =
    document.getElementById('connectBtn');

const hostRole =
    document.getElementById('hostRole');

const clientRole =
    document.getElementById('clientRole');

const timeline =
    document.getElementById('timeline');

const timeText =
    document.getElementById('timeText');

const controls =
    document.getElementById('controls');

const calibration =
    document.getElementById('calibration');


let isHost = true;
let peer = null;
let conn = null;

let videoURL = null;

let wakeLock = null;
let wakeRetryTimer = null;
let wakeMonitorTimer = null;

let audioContext = null;
let audioStarted = false;

let syncTimer = null;

let draggingTimeline = false;
let firstSync = false;

let roomCode = '';


/* =========================
   КАЛІБРУВАННЯ
   ========================= */

let scale =
    parseFloat(
        localStorage.getItem('sp_scale') || '1'
    );

let offsetX =
    parseInt(
        localStorage.getItem('sp_offsetX') || '0'
    );

let offsetY =
    parseInt(
        localStorage.getItem('sp_offsetY') || '0'
    );


function applyCalibration(){

    videoPlayer.style.transform =
        `translate3d(${offsetX}px,${offsetY}px,0) scale(${scale})`;

    document.getElementById('scaleValue')
        .textContent = scale.toFixed(2);

    document.getElementById('offsetXValue')
        .textContent = offsetX;

    document.getElementById('offsetYValue')
        .textContent = offsetY;
}

applyCalibration();


document.getElementById('scaleDown')
.addEventListener('click',()=>{
    scale=Math.max(
        .1,
        +(scale-.05).toFixed(2)
    );
    applyCalibration();
});


document.getElementById('scaleUp')
.addEventListener('click',()=>{
    scale=Math.min(
        5,
        +(scale+.05).toFixed(2)
    );
    applyCalibration();
});


document.getElementById('leftBtn')
.addEventListener('click',()=>{
    offsetX-=4;
    applyCalibration();
});


document.getElementById('rightBtn')
.addEventListener('click',()=>{
    offsetX+=4;
    applyCalibration();
});


document.getElementById('upBtn')
.addEventListener('click',()=>{
    offsetY-=4;
    applyCalibration();
});


document.getElementById('downBtn')
.addEventListener('click',()=>{
    offsetY+=4;
    applyCalibration();
});


document.getElementById('resetBtn')
.addEventListener('click',()=>{
    scale=1;
    offsetX=0;
    offsetY=0;
    applyCalibration();
});


document.getElementById('saveBtn')
.addEventListener('click',()=>{

    localStorage.setItem(
        'sp_scale',
        scale
    );

    localStorage.setItem(
        'sp_offsetX',
        offsetX
    );

    localStorage.setItem(
        'sp_offsetY',
        offsetY
    );

    localStorage.setItem(
        'sp_position',
        positionSelect.value
    );
});


document.getElementById('closeBtn')
.addEventListener('click',()=>{
    calibration.classList.remove('show');
});


document.getElementById('calibrationBtn')
.addEventListener('click',()=>{
    calibration.classList.toggle('show');
});


/* =========================
   РОЛІ
   ========================= */

hostRole.addEventListener('click',()=>{

    isHost=true;

    hostRole.classList.add('active');
    clientRole.classList.remove('active');

    startBtn.classList.remove('hidden');
    connectBtn.classList.add('hidden');

    statusEl.textContent =
        'Режим Host - S25+';
});


clientRole.addEventListener('click',()=>{

    isHost=false;

    clientRole.classList.add('active');
    hostRole.classList.remove('active');

    startBtn.classList.add('hidden');
    connectBtn.classList.remove('hidden');

    statusEl.textContent =
        'Режим Client - S10';
});


/* =========================
   WAKE LOCK
   ========================= */

async function requestWakeLock(){

    if (!('wakeLock' in navigator))
        return;

    if (document.hidden)
        return;

    try{

        if (
            wakeLock &&
            !wakeLock.released
        ){
            return;
        }

        wakeLock =
            await navigator.wakeLock.request(
                'screen'
            );

        connectionInfo.textContent =
            conn && conn.open
                ? 'Підключено • екран активний'
                : 'Екран активний';

        wakeLock.addEventListener(
            'release',
            ()=>{

                wakeLock=null;

                connectionInfo.textContent =
                    'Екран звільнено';

                scheduleWakeLock();
            }
        );

    }catch(e){

        scheduleWakeLock();
    }
}


function scheduleWakeLock(){

    if(wakeRetryTimer)
        clearTimeout(wakeRetryTimer);

    wakeRetryTimer =
        setTimeout(()=>{
            requestWakeLock();
        },1000);
}


function startWakeMonitor(){

    if(wakeMonitorTimer)
        clearInterval(wakeMonitorTimer);

    wakeMonitorTimer =
        setInterval(()=>{

            if(
                !document.hidden &&
                (
                    !wakeLock ||
                    wakeLock.released
                )
            ){
                requestWakeLock();
            }

        },3000);

    requestWakeLock();
}


document.addEventListener(
    'visibilitychange',
    ()=>{
        if(!document.hidden)
            requestWakeLock();
    }
);


window.addEventListener(
    'focus',
    requestWakeLock
);


window.addEventListener(
    'pageshow',
    requestWakeLock
);


/* =========================
   ДОДАТКОВИЙ AUDIO CONTEXT
   ========================= */

function startAntiSleep(){

    if(audioStarted)
        return;

    audioStarted=true;

    try{

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AC)
            return;

        audioContext=new AC();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value=20;

        gain.gain.value=.00001;

        oscillator.connect(gain);
        gain.connect(
            audioContext.destination
        );

        oscillator.start();

    }catch(e){}
}


/* =========================
   ВІДЕО
   ========================= */

function loadVideo(){

    const file=videoFile.files[0];

    if(!file)
        return false;

    if(videoURL)
        URL.revokeObjectURL(videoURL);

    videoURL =
        URL.createObjectURL(file);

    videoPlayer.src=videoURL;
    videoPlayer.load();

    return true;
}


/* =========================
   TIMELINE
   ========================= */

function formatTime(t){

    if(!Number.isFinite(t))
        return '00:00';

    t=Math.max(
        0,
        Math.floor(t)
    );

    const m =
        Math.floor(t/60);

    const s =
        t%60;

    return String(m).padStart(2,'0')
        + ':' +
        String(s).padStart(2,'0');
}


function updateTimeline(){

    if(
        !Number.isFinite(
            videoPlayer.duration
        )
    )
        return;

    if(!draggingTimeline){

        timeline.max =
            videoPlayer.duration;

        timeline.value =
            videoPlayer.currentTime;
    }

    timeText.textContent =
        formatTime(
            videoPlayer.currentTime
        )
        +
        ' / ' +
        formatTime(
            videoPlayer.duration
        );
}


videoPlayer.addEventListener(
    'timeupdate',
    updateTimeline
);

videoPlayer.addEventListener(
    'durationchange',
    updateTimeline
);

videoPlayer.addEventListener(
    'loadedmetadata',
    updateTimeline
);


timeline.addEventListener(
    'pointerdown',
    ()=>{
        draggingTimeline=true;
    }
);


timeline.addEventListener(
    'pointerup',
    ()=>{
        draggingTimeline=false;
    }
);


timeline.addEventListener(
    'input',
    ()=>{
        const t =
            parseFloat(
                timeline.value
            );

        timeText.textContent =
            formatTime(t)
            +
            ' / ' +
            formatTime(
                videoPlayer.duration
            );
    }
);


timeline.addEventListener(
    'change',
    ()=>{

        const t =
            parseFloat(
                timeline.value
            );

        if(!Number.isFinite(t))
            return;

        videoPlayer.currentTime=t;

        if(isHost){

            send({
                type:'seek',
                time:t
            });

            sendSync();

        }else{

            send({
                type:'seek_request',
                time:t
            });
        }

        draggingTimeline=false;
    }
);


/* =========================
   PEER
   ========================= */

function send(data){

    if(
        conn &&
        conn.open
    ){

        try{
            conn.send(data);
        }catch(e){}
    }
}


function hostState(){

    return {
        type:'sync',
        time:
            Number.isFinite(
                videoPlayer.currentTime
            )
                ? videoPlayer.currentTime
                : 0,

        playing:
            !videoPlayer.paused &&
            !videoPlayer.ended,

        sentAt:Date.now()
    };
}


function sendSync(){

    if(!isHost)
        return;

    send(
        hostState()
    );
}


/* =========================
   ПІДКЛЮЧЕННЯ
   ========================= */

function setupConnection(){

    conn.on('open',()=>{

        connectionInfo.textContent =
            'Підключено';

        statusEl.textContent =
            isHost
                ? 'S10 підключено'
                : 'Підключено до S25+';

        startScreen.classList.add(
            'hidden'
        );

        startWakeMonitor();
        startAntiSleep();

        if(isHost){

            setTimeout(
                sendSync,
                100
            );

        }else{

            firstSync=false;
        }
    });


    conn.on('data',(data)=>{

        if(!data || !data.type)
            return;


        /* CLIENT */

        if(!isHost){

            if(data.type==='sync'){

                const hostTime=data.time;

                if(!Number.isFinite(hostTime))
                    return;

                if(!firstSync){

                    firstSync=true;

                    videoPlayer.currentTime =
                        hostTime;

                    videoPlayer.playbackRate=1;

                    if(data.playing){

                        videoPlayer.play()
                            .catch(()=>{});

                    }else{

                        videoPlayer.pause();
                    }

                    return;
                }


                const diff =
                    videoPlayer.currentTime -
                    hostTime;


                if(
                    Math.abs(diff) >
                    .25
                ){

                    videoPlayer.currentTime =
                        hostTime;

                    videoPlayer.playbackRate=1;

                }else if(
                    !draggingTimeline
                ){

                    let rate =
                        1 -
                        diff*.08;

                    rate=Math.max(
                        .97,
                        Math.min(
                            1.03,
                            rate
                        )
                    );

                    videoPlayer.playbackRate=
                        rate;
                }


                if(data.playing){

                    if(videoPlayer.paused){

                        videoPlayer.play()
                            .catch(()=>{});
                    }

                }else{

                    if(!videoPlayer.paused)
                        videoPlayer.pause();

                    videoPlayer.playbackRate=1;
                }

                requestWakeLock();

                return;
            }


            if(data.type==='seek'){

                videoPlayer.currentTime =
                    data.time;

                videoPlayer.playbackRate=1;

                return;
            }


            if(data.type==='play'){

                videoPlayer.play()
                    .catch(()=>{});

                requestWakeLock();

                return;
            }


            if(data.type==='pause'){

                videoPlayer.pause();

                videoPlayer.playbackRate=1;

                return;
            }


            if(data.type==='restart'){

                videoPlayer.currentTime=0;

                videoPlayer.play()
                    .catch(()=>{});

                return;
            }
        }


        /* HOST */

        if(isHost){

            if(
                data.type==='seek_request'
            ){

                if(
                    Number.isFinite(
                        data.time
                    )
                ){

                    videoPlayer.currentTime =
                        data.time;

                    send({
                        type:'seek',
                        time:
                            videoPlayer.currentTime
                    });

                    sendSync();
                }

                return;
            }


            if(
                data.type==='play_request'
            ){

                videoPlayer.play()
                    .then(()=>{
                        send({
                            type:'play'
                        });

                        sendSync();
                    })
                    .catch(()=>{});

                requestWakeLock();

                return;
            }


            if(
                data.type==='pause_request'
            ){

                videoPlayer.pause();

                send({
                    type:'pause'
                });

                sendSync();

                return;
            }


            if(
                data.type==='restart_request'
            ){

                videoPlayer.currentTime=0;

                videoPlayer.play()
                    .then(()=>{

                        send({
                            type:'restart'
                        });

                        sendSync();
                    })
                    .catch(()=>{});

                return;
            }
        }
    });


    conn.on('close',()=>{

        connectionInfo.textContent =
            'Зʼєднання втрачено';

        statusEl.textContent =
            'Зʼєднання втрачено';
    });
}


/* =========================
   HOST
   ========================= */

function createHost(){

    roomCode =
        roomCodeInput.value
            .replace(/\D/g,'')
            .slice(0,5);

    if(roomCode.length!==5){

        statusEl.textContent =
            'Введіть 5 цифр';

        return;
    }

    if(!loadVideo()){

        statusEl.textContent =
            'Виберіть відео';

        return;
    }

    startAntiSleep();
    requestWakeLock();

    peer =
        new Peer(
            'sp-'+roomCode,
            {
                host:'0.peerjs.com',
                port:443,
                secure:true,
                path:'/'
            }
        );


    peer.on('open',()=>{

        statusEl.textContent =
            'Кімната створена. Очікування S10...';

        startScreen.classList.add(
            'hidden'
        );

        startWakeMonitor();

        if(syncTimer)
            clearInterval(syncTimer);

        syncTimer =
            setInterval(
                sendSync,
                250
            );
    });


    peer.on(
        'connection',
        newConn=>{

            conn=newConn;

            setupConnection();
        }
    );


    peer.on(
        'error',
        err=>{

            statusEl.textContent =
                'Помилка: ' +
                (err.message || err.type);
        }
    );
}


/* =========================
   CLIENT
   ========================= */

function connectClient(){

    roomCode =
        roomCodeInput.value
            .replace(/\D/g,'')
            .slice(0,5);

    if(roomCode.length!==5){

        statusEl.textContent =
            'Введіть 5 цифр';

        return;
    }

    if(!loadVideo()){

        statusEl.textContent =
            'Виберіть відео';

        return;
    }

    startAntiSleep();
    requestWakeLock();

    peer =
        new Peer(
            {
                host:'0.peerjs.com',
                port:443,
                secure:true,
                path:'/'
            }
        );


    peer.on('open',()=>{

        conn =
            peer.connect(
                'sp-'+roomCode,
                {
                    reliable:true
                }
            );

        setupConnection();
    });


    peer.on(
        'error',
        err=>{

            statusEl.textContent =
                'Помилка: ' +
                (err.message || err.type);
        }
    );
}


/* =========================
   КНОПКИ
   ========================= */

startBtn.addEventListener(
    'click',
    ()=>{
        createHost();
    }
);


connectBtn.addEventListener(
    'click',
    ()=>{
        connectClient();
    }
);


document.getElementById('playBtn')
.addEventListener('click',()=>{

    requestWakeLock();

    if(isHost){

        videoPlayer.play()
            .then(()=>{
                send({
                    type:'play'
                });

                sendSync();
            })
            .catch(()=>{});

    }else{

        send({
            type:'play_request'
        });
    }
});


document.getElementById('pauseBtn')
.addEventListener('click',()=>{

    if(isHost){

        videoPlayer.pause();

        send({
            type:'pause'
        });

        sendSync();

    }else{

        send({
            type:'pause_request'
        });
    }
});


document.getElementById('restartBtn')
.addEventListener('click',()=>{

    requestWakeLock();

    if(isHost){

        videoPlayer.currentTime=0;

        videoPlayer.play()
            .then(()=>{

                send({
                    type:'restart'
                });

                sendSync();

            })
            .catch(()=>{});

    }else{

        send({
            type:'restart_request'
        });
    }
});


document.getElementById('fullscreenBtn')
.addEventListener('click',async()=>{

    requestWakeLock();

    try{

        if(!document.fullscreenElement){

            await document.documentElement
                .requestFullscreen();

        }else{

            await document.exitFullscreen();
        }

    }catch(e){}

    requestWakeLock();
});


/* =========================
   VIDEO EVENTS
   ========================= */

videoPlayer.addEventListener(
    'play',
    ()=>{
        requestWakeLock();

        if(isHost && conn && conn.open)
            sendSync();
    }
);


videoPlayer.addEventListener(
    'pause',
    ()=>{
        if(isHost && conn && conn.open)
            sendSync();
    }
);


videoPlayer.addEventListener(
    'seeked',
    ()=>{
        updateTimeline();

        if(isHost && conn && conn.open)
            sendSync();
    }
);


/* =========================
   ПОКАЗ/ПРИХОВУВАННЯ
   ========================= */

let controlsTimer=null;

function showControls(){

    controls.classList.remove(
        'hidden'
    );

    if(controlsTimer)
        clearTimeout(
            controlsTimer
        );

    controlsTimer =
        setTimeout(
            ()=>{
                if(
                    !calibration.classList.contains(
                        'show'
                    )
                ){
                    controls.classList.add(
                        'hidden'
                    );
                }
            },
            4000
        );
}


document.body.addEventListener(
    'click',
    e=>{

        if(
            e.target.closest(
                '#controls'
            ) ||
            e.target.closest(
                '#calibration'
            ) ||
            !startScreen.classList.contains(
                'hidden'
            )
        ){
            return;
        }

        showControls();
    }
);


/* =========================
   ІНІЦІАЛІЗАЦІЯ
   ========================= */

roomCodeInput.addEventListener(
    'input',
    ()=>{
        roomCodeInput.value =
            roomCodeInput.value
                .replace(/\D/g,'')
                .slice(0,5);
    }
);


positionSelect.value =
    localStorage.getItem(
        'sp_position'
    ) || 'left';


window.addEventListener(
    'resize',
    applyCalibration
);


startAntiSleep();

applyCalibration();

</script>

</body>
</html>
