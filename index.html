<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenParty Sync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
body {
margin: 0;
padding: 0;
background-color: #121212;
color: #e0e0e0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
overflow: hidden;
}
.container {
width: 90%;
max-width: 400px;
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
box-sizing: border-box;
}
h1 {
color: #4CAF50;
text-align: center;
font-size: 24px;
margin-bottom: 20px;
}
label {
display: block;
margin-top: 15px;
margin-bottom: 5px;
font-size: 14px;
color: #b0b0b0;
}
select, input, button {
width: 100%;
padding: 12px;
background: #2d2d2d;
border: 1px solid #444;
color: #fff;
border-radius: 8px;
font-size: 16px;
box-sizing: border-box;
}
input[type="text"] {
letter-spacing: 4px;
text-align: center;
font-weight: bold;
font-size: 18px;
}
button {
background: #4CAF50;
border: none;
font-weight: bold;
cursor: pointer;
margin-top: 20px;
transition: background 0.2s;
}
button:hover {
background: #45a049;
}
.hidden {
display: none !important;
}
#playerContainer {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: #000;
display: none;
justify-content: center;
align-items: center;
z-index: 9999;
}
video {
width: 100%;
height: 100%;
object-fit: contain;
}
.fs-btn {
position: absolute;
top: 20px;
right: 20px;
background: rgba(0, 0, 0, 0.7);
color: white;
border: 1px solid rgba(255, 255, 255, 0.3);
padding: 10px 16px;
border-radius: 8px;
cursor: pointer;
z-index: 10000;
font-size: 14px;
width: auto;
}
.status {
margin-top: 15px;
text-align: center;
font-size: 14px;
color: #ff9800;
word-break: break-all;
}
</style>
</head>
<body>

<div class="container" id="setupContainer">
<h1>ScreenParty Sync</h1>

<label for="roleSelect">Роль пристрою:</label>
<select id="roleSelect">
<option value="host">Головний (Host - S25+)</option>
<option value="client">Другий (Client - S10)</option>
</select>

<div id="hostSection">
<label for="videoFile">Виберіть відеофайл:</label>
<input type="file" id="videoFile" accept="video/*">
</div>

<div id="clientSection" class="hidden">
<label for="roomCodeInput">Код кімнати:</label>
<input type="text" id="roomCodeInput" placeholder="Введіть код" maxlength="5">

<label for="clientVideoFile">Виберіть той самий відеофайл:</label>
<input type="file" id="clientVideoFile" accept="video/*">
</div>

<button id="startBtn">Створити кімнату та запустити</button>
<div id="statusText" class="status"></div>
</div>

<!-- Контейнер відеоплеєра на весь екран із власною надійною кнопкою -->
<div id="playerContainer">
<button class="fs-btn" id="fsBtn">⛶ На весь екран</button>
<video id="videoPlayer" playsinline controls></video>
</div>

<script>
let peer = null;
let conn = null;
const roleSelect = document.getElementById('roleSelect');
const hostSection = document.getElementById('hostSection');
const clientSection = document.getElementById('clientSection');
const videoFile = document.getElementById('videoFile');
const clientVideoFile = document.getElementById('clientVideoFile');
const roomCodeInput = document.getElementById('roomCodeInput');
const startBtn = document.getElementById('startBtn');
const setupContainer = document.getElementById('setupContainer');
const playerContainer = document.getElementById('playerContainer');
const videoPlayer = document.getElementById('videoPlayer');
const fsBtn = document.getElementById('fsBtn');
const statusText = document.getElementById('statusText');

roleSelect.addEventListener('change', () => {
if (roleSelect.value === 'host') {
hostSection.classList.remove('hidden');
clientSection.classList.add('hidden');
startBtn.innerText = 'Створити кімнату та запустити';
} else {
hostSection.classList.add('hidden');
clientSection.classList.remove('hidden');
startBtn.innerText = 'Підключитися та запустити';
}
});

function generateRoomCode() {
return Math.floor(10000 + Math.random() * 90000).toString();
}

// Потужна логіка повного екрана для мобільних браузерів
fsBtn.addEventListener('click', () => {
const elem = playerContainer;
const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

if (!isFullscreen) {
if (elem.requestFullscreen) {
elem.requestFullscreen().catch(err => console.log(err));
} else if (elem.webkitRequestFullscreen) {
elem.webkitRequestFullscreen();
}
} else {
if (document.exitFullscreen) {
document.exitFullscreen();
} else if (document.webkitExitFullscreen) {
document.webkitExitFullscreen();
}
}
});

startBtn.addEventListener('click', () => {
if (typeof Peer === 'undefined') {
statusText.innerText = 'Помилка: Бібліотека PeerJS не завантажилася!';
return;
}

const role = roleSelect.value;

if (role === 'host') {
const file = videoFile.files[0];
if (!file) {
alert('Виберіть відеофайл для головного пристрою!');
return;
}
videoPlayer.src = URL.createObjectURL(file);

const roomCode = generateRoomCode();
statusText.innerText = 'Ініціалізація зв’язку...';

try {
peer = new Peer('sp-' + roomCode);

peer.on('open', () => {
statusText.innerText = Кімната створена! Код: ${roomCode};
setTimeout(() => {
setupContainer.classList.add('hidden');
playerContainer.style.display = 'flex';
}, 800);
});

peer.on('error', (err) => {
statusText.innerText = 'Помилка PeerJS: ' + (err.type || err);
});

peer.on('connection', (connection) => {
conn = connection;
statusText.innerText = 'Клієнт підключився!';
setupHostSync();
});
} catch (e) {
statusText.innerText = 'Помилка: ' + e.message;
}

} else {
const code = roomCodeInput.value.trim();
const file = clientVideoFile.files[0];
if (code.length !== 5) {
alert('Введіть 5-значний код кімнати!');
return;
}
if (!file) {
alert('Виберіть той самий відеофайл для клієнта!');
return;
}
videoPlayer.src = URL.createObjectURL(file);

statusText.innerText = 'Підключення до кімнати...';

try {
peer = new Peer();

peer.on('open', () => {
conn = peer.connect('sp-' + code);

conn.on('open', () => {
statusText.innerText = 'Підключено до хоста!';
setTimeout(() => {
setupContainer.classList.add('hidden');
playerContainer.style.display = 'flex';
setupClientSync();
}, 800);
});

conn.on('error', (err) => {
statusText.innerText = 'Помилка з’єднання: ' + err;
});
});

peer.on('error', (err) => {
statusText.innerText = 'Помилка PeerJS: ' + (err.type || err);
});
} catch (e) {
statusText.innerText = 'Помилка: ' + e.message;
}
}
});

function setupHostSync() {
videoPlayer.addEventListener('play', () => {
if (conn && conn.open) conn.send({type: 'play', time: videoPlayer.currentTime});
});
videoPlayer.addEventListener('pause', () => {
if (conn && conn.open) conn.send({type: 'pause', time: videoPlayer.currentTime});
});
videoPlayer.addEventListener('seeked', () => {
if (conn && conn.open) conn.send({type: 'seek', time: videoPlayer.currentTime});
});

setInterval(() => {
if (conn && conn.open && !videoPlayer.paused) {
conn.send({type: 'sync', time: videoPlayer.currentTime});
}
}, 2000);
}

function setupClientSync() {
conn.on('data', (data) => {
if (data.type === 'play') {
if (Math.abs(videoPlayer.currentTime - data.time) > 0.3) {
videoPlayer.currentTime = data.time;
}
videoPlayer.play().catch(e => console.log(e));
} else if (data.type === 'pause') {
videoPlayer.pause();
videoPlayer.currentTime = data.time;
} else if (data.type === 'seek' || data.type === 'sync') {
if (Math.abs(videoPlayer.currentTime - data.time) > 0.4) {
videoPlayer.currentTime = data.time;
}
}
});
}
</script>
</body>
</html>
