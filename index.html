<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScreenParty Sync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<style>
body {
margin: 0;
background: #121212;
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 10px;
box-sizing: border-box;
overflow: hidden;
}
.card {
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
width: 100%;
max-width: 400px;
box-shadow: 0 8px 24px rgba(0,0,0,0.6);
text-align: center;
z-index: 10;
}
h2 { margin-top: 0; font-size: 20px; color: #4CAF50; }
label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; text-align: left; }
select, input, button {
width: 100%;
padding: 10px;
margin-top: 5px;
background: #2a2a2a;
color: #fff;
border: 1px solid #444;
border-radius: 8px;
font-size: 14px;
box-sizing: border-box;
}
input[type="text"] {
letter-spacing: 4px;
text-align: center;
font-weight: bold;
font-size: 16px;
}
button {
background: #4CAF50;
border: none;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
transition: background 0.2s;
}
button:hover { background: #45a049; }
.hidden { display: none !important; }

.code-display {
background: #fff;
color: #000;
font-size: 28px;
font-weight: bold;
letter-spacing: 6px;
padding: 10px;
border-radius: 8px;
margin-top: 8px;
display: inline-block;
}

/* Екран плеєра */
#playerScreen {
position: fixed;
top: 0; left: 0;
width: 100vw; height: 100vh;
background: #000;
overflow: hidden;
display: none;
z-index: 100;
}
video.vid-el {
position: absolute;
top: 0;
left: 0;
object-fit: fill;
}

/* Індикатор гучності */
#volumeIndicator {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: rgba(0, 0, 0, 0.85);
color: #fff;
padding: 14px 24px;
border-radius: 10px;
font-size: 18px;
font-weight: bold;
z-index: 300;
display: none;
pointer-events: none;
opacity: 0;
transition: opacity 0.3s ease;
box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

/* Панель керування з внутрішньою прокруткою */
.controls {
position: absolute;
bottom: 8px;
left: 50%;
transform: translateX(-50%);
background: rgba(0, 0, 0, 0.94);
padding: 8px;
border-radius: 12px;
display: flex;
flex-direction: column;
gap: 4px;
z-index: 200;
width: 96%;
max-width: 360px;
max-height: 60vh;
overflow-y: auto;
box-sizing: border-box;
box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

/* Стилі для таймлайна */
.timeline-container {
display: flex;
align-items: center;
gap: 8px;
width: 100%;
margin-bottom: 4px;
padding: 0 2px;
box-sizing: border-box;
}
.timeline-slider {
flex: 1;
-webkit-appearance: none;
background: #444;
height: 6px;
border-radius: 3px;
outline: none;
margin: 0;
padding: 0;
border: none;
}
.timeline-slider::-webkit-slider-thumb {
-webkit-appearance: none;
width: 14px;
height: 14px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}
.time-display {
font-size: 11px;
color: #bbb;
white-space: nowrap;
min-width: 75px;
text-align: right;
font-family: monospace;
}

.controls-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 4px;
}
.controls button {
margin: 0;
padding: 7px 2px;
border-radius: 6px;
font-size: 11px;
background-color: #4CAF50;
color: white;
border: none;
font-weight: bold;
cursor: pointer;
width: 100%;
}
.controls button:hover { background: #45a049; }
.btn-full { grid-column: span 3; }
.reset-btn { background-color: #444; }
.action-btn { background-color: #2196F3; }
.scale-btn { background-color: #E91E63; }
.fullscreen-btn { background-color: #FF9800; }
.save-btn { background-color: #FF5722; }
.file-btn { background-color: #607D8B; }

.status {
font-size: 12px;
margin-top: 10px;
color: #888;
}
</style>
</head>
<body>

<!-- Налаштування та підключення -->
<div class="card" id="setupCard">
<h2>ScreenParty Sync</h2>

<label>Роль пристрою:</label>
<select id="roleSelect">
<option value="host">Головний (Host - S25+)</option>
<option value="client">Другий (Client - S10)</option>
</select>

<label>Позиція екрана:</label>
<select id="positionSelect">
<option value="left">Ліва частина (поруч зліва)</option>
<option value="right">Права частина (поруч справа)</option>
</select>

<label>Режим відео:</label>
<select id="videoModeSelect">
<option value="local">Локальні файли на обох телефонах (з синхронізацією)</option>
<option value="stream">Трансляція відео з Головного на другий (P2P)</option>
</select>

<div id="fileInputContainer">
<label>Виберіть відеофайл:</label>
<input type="file" id="videoInput" accept="video/*">
</div>

<div id="hostSection">
<button id="startHostBtn">Створити кімнату та запустити</button>
<div id="codeContainer" class="hidden">
<div style="font-size: 12px; color: #aaa; margin-top: 6px;">Ваш 5-значний код:</div>
<div id="hostCodeDisplay" class="code-display">-----</div>
</div>
</div>

<div id="clientSection" class="hidden">
<label for="clientCodeInput">Введіть 5-значний код з головного телефону:</label>
<input type="text" id="clientCodeInput" maxlength="5" placeholder="12345">
<button id="connectClientBtn">Підключитися та запустити</button>
</div>

<div class="status" id="connectionStatus">Статус: Очікування налаштування</div>
</div>

<!-- Екран відеоплеєра -->
<div id="playerScreen">
<video id="videoPlayer" class="vid-el" playsinline></video>
<!-- Індикатор гучності при свайпі -->
<div id="volumeIndicator">🔊 100%</div>
<!-- Прихований інпут для вибору нового відео прямо з плеєра -->
<input type="file" id="newVideoInput" accept="video/*" style="display: none;">

<div class="controls" id="playerControls">
<!-- Таймлайн -->
<div class="timeline-container">
<input type="range" id="timelineRange" class="timeline-slider" min="0" max="100" value="0" step="0.1">
<div class="time-display" id="timeDisplay">00:00 / 00:00</div>
</div>

<div style="font-size: 10px; text-align: center; color: #ddd; font-weight: bold; margin-bottom: 2px;">Керування та калібрування</div>
<div class="controls-grid">
<button id="playPauseBtn" class="action-btn">▶ Грати</button>
<button id="restartBtn" class="action-btn">↺ З початку</button>
<button id="fullscreenBtn" class="fullscreen-btn">⛶ Екран</button>

<button id="changeVideoBtn" class="file-btn btn-full">📁 Вибрати інше відео</button>
<button id="playerSaveBtn" class="save-btn btn-full">💾 Зберегти калібрування</button>

<button id="scalePlusBtn" class="scale-btn">🔍 Збільшити (+)</button>
<button id="resetShiftBtn" class="reset-btn">Скидання</button>
<button id="scaleMinusBtn" class="scale-btn">🔍 Зменшити (-)</button>

<!-- Блок стрілок -->
<button id="shiftLeftBtn">◄ Ліворуч</button>
<button id="shiftUpBtn">▲ Вгору</button>
<button id="shiftRightBtn">Праворуч ►</button>

<button class="reset-btn" style="visibility: hidden;"></button>
<button id="shiftDownBtn">▼ Вниз</button>
<button class="reset-btn" style="visibility: hidden;"></button>
</div>
</div>
</div>

<script>
const setupCard = document.getElementById('setupCard');
const playerScreen = document.getElementById('playerScreen');
const videoPlayer = document.getElementById('videoPlayer');
const playerControls = document.getElementById('playerControls');
const newVideoInput = document.getElementById('newVideoInput');

const roleSelect = document.getElementById('roleSelect');
const positionSelect = document.getElementById('positionSelect');
const videoModeSelect = document.getElementById('videoModeSelect');
const fileInputContainer = document.getElementById('fileInputContainer');
const videoInput = document.getElementById('videoInput');
const hostSection = document.getElementById('hostSection');
const clientSection = document.getElementById('clientSection');
const connectionStatus = document.getElementById('connectionStatus');

const startHostBtn = document.getElementById('startHostBtn');
const codeContainer = document.getElementById('codeContainer');
const hostCodeDisplay = document.getElementById('hostCodeDisplay');
const clientCodeInput = document.getElementById('clientCodeInput');
const connectClientBtn = document.getElementById('connectClientBtn');

const playPauseBtn = document.getElementById('playPauseBtn');
const restartBtn = document.getElementById('restartBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');

const timelineRange = document.getElementById('timelineRange');
const timeDisplay = document.getElementById('timeDisplay');
const volumeIndicator = document.getElementById('volumeIndicator');
const changeVideoBtn = document.getElementById('changeVideoBtn');

let peer = null;
let conn = null;
let isHost = false;
let localVideoBlobUrl = null;

let videoOffsetX = 0;
let videoOffsetY = 0;
let videoScaleMultiplier = 1.0;
let syncInterval = null;

let partnerWidth = 0;
let partnerHeight = 0;

let isDraggingTimeline = false;
let isSwipingVolume = false;
let touchStartY = 0;
let touchStartX = 0;
let touchStartVolume = 1.0;
let hasSwiped = false;
let volumeTimeout = null;

function loadSavedSettings() {
const savedScale = localStorage.getItem('sp_scale');
const savedX = localStorage.getItem('sp_offsetX');
const savedY = localStorage.getItem('sp_offsetY');
const savedPos = localStorage.getItem('sp_position');

if (savedScale !== null) videoScaleMultiplier = parseFloat(savedScale);
if (savedX !== null) videoOffsetX = parseFloat(savedX);
if (savedY !== null) videoOffsetY = parseFloat(savedY);
if (savedPos === 'left' || savedPos === 'right') {
positionSelect.value = savedPos;
}
}

function saveSettings() {
localStorage.setItem('sp_scale', videoScaleMultiplier);
localStorage.setItem('sp_offsetX', videoOffsetX);
localStorage.setItem('sp_offsetY', videoOffsetY);
localStorage.setItem('sp_position', positionSelect.value);

const saveBtn = document.getElementById('playerSaveBtn');
if (saveBtn) {
const originalText = saveBtn.textContent;
saveBtn.textContent = '✔ Збережено!';
saveBtn.style.backgroundColor = '#4CAF50';
setTimeout(() => {
saveBtn.textContent = originalText;
saveBtn.style.backgroundColor = '#FF5722';
}, 1200);
}
}

loadSavedSettings();

function updateInputsVisibility() {
const role = roleSelect.value;
const mode = videoModeSelect.value;

if (role === 'host') {
hostSection.classList.remove('hidden');
clientSection.classList.add('hidden');
fileInputContainer.style.display = 'block';
changeVideoBtn.style.display = 'block';
} else {
hostSection.classList.add('hidden');
clientSection.classList.remove('hidden');
if (mode === 'stream') {
fileInputContainer.style.display = 'none';
} else {
fileInputContainer.style.display = 'block';
}
changeVideoBtn.style.display = 'none';
}
}

roleSelect.addEventListener('change', updateInputsVisibility);
videoModeSelect.addEventListener('change', updateInputsVisibility);
updateInputsVisibility();

function requestFullscreenNow() {
const elem = document.documentElement;
if (!document.fullscreenElement && !document.webkitFullscreenElement) {
if (elem.requestFullscreen) elem.requestFullscreen().catch(e => {});
else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
}
}

videoInput.addEventListener('change', (e) => {
const file = e.target.files[0];
if (file) {
localVideoBlobUrl = URL.createObjectURL(file);
videoPlayer.src = localVideoBlobUrl;
}
});

changeVideoBtn.addEventListener('click', () => {
if (isHost) newVideoInput.click();
});

newVideoInput.addEventListener('change', (e) => {
const file = e.target.files[0];
if (file && isHost) {
localVideoBlobUrl = URL.createObjectURL(file);
videoPlayer.src = localVideoBlobUrl;
videoPlayer.load();
updateVideoStyle();
videoPlayer.currentTime = 0;
videoPlayer.pause();
playPauseBtn.textContent = '▶ Грати';

if (videoModeSelect.value === 'stream' && conn && conn.open) {
sendVideoStream();
}
}
});

function generateRandomCode() {
return Math.floor(10000 + Math.random() * 90000).toString();
}

startHostBtn.addEventListener('click', () => {
if (!localVideoBlobUrl) { alert('Виберіть відеофайл!'); return; }
requestFullscreenNow();
isHost = true;
startHostPeer();
});

function startHostPeer() {
const code = generateRandomCode();
connectionStatus.textContent = 'Статус: Створення кімнати...';

peer = new Peer('sp-' + code);

peer.on('open', () => {
hostCodeDisplay.textContent = code;
codeContainer.classList.remove('hidden');
connectionStatus.textContent = 'Статус: Очікування підключення другого телефону...';
});

peer.on('connection', (connection) => {
conn = connection;
setupConnection();
});

peer.on('call', (call) => {
call.answer();
if (videoModeSelect.value === 'stream') {
sendVideoStream(call);
}
});

peer.on('error', (err) => {
if (err.type === 'unavailable-id') {
peer.destroy();
startHostPeer();
} else {
connectionStatus.textContent = 'Помилка: ' + err.type;
}
});
}

connectClientBtn.addEventListener('click', () => {
const mode = videoModeSelect.value;
if (mode === 'local' && !localVideoBlobUrl) { alert('Виберіть відеофайл!'); return; }
const code = clientCodeInput.value.trim();
if (code.length !== 5) { alert('Введіть 5-значний код!'); return; }

requestFullscreenNow();
isHost = false;
connectionStatus.textContent = 'Статус: Підключення до кімнати...';

peer = new Peer();

peer.on('open', () => {
conn = peer.connect('sp-' + code);
setupConnection();
});

peer.on('call', (call) => {
call.answer();
call.on('stream', (remoteStream) => {
videoPlayer.srcObject = remoteStream;
setupCard.style.display = 'none';
playerScreen.style.display = 'block';
updateVideoStyle();
videoPlayer.play().catch(e => {});
playPauseBtn.textContent = '❚❚ Пауза';
});
});

peer.on('error', () => {
connectionStatus.textContent = 'Помилка підключення. Перевірте код.';
});
});

function sendScreenInfo() {
if (conn && conn.open) {
conn.send(JSON.stringify({
type: 'screen_info',
width: window.innerWidth,
height: window.innerHeight,
position: positionSelect.value,
videoMode: videoModeSelect.value
}));
}
}

function sendVideoStream(specificCall = null) {
if (!isHost || videoModeSelect.value !== 'stream') return;
try {
let stream = null;
if (videoPlayer.captureStream) {
stream = videoPlayer.captureStream();
} else if (videoPlayer.mozCaptureStream) {
stream = videoPlayer.mozCaptureStream();
}

if (stream && conn && conn.open) {
if (specificCall) {
specificCall.answer(stream);
} else {
peer.call(conn.peer, stream);
}
}
} catch (e) {}
}

function setupConnection() {
conn.on('open', () => {
connectionStatus.textContent = 'Статус: Успішно підключено!';
sendScreenInfo();

if (isHost && videoModeSelect.value === 'stream') {
setTimeout(() => {
sendVideoStream();
}, 500);
}

setTimeout(() => {
setupCard.style.display = 'none';
playerScreen.style.display = 'block';
updateVideoStyle();

if (videoModeSelect.value === 'local' || isHost) {
videoPlayer.currentTime = 0;
videoPlayer.play().catch(err => {});
playPauseBtn.textContent = '❚❚ Пауза';
}

if (isHost) {
if (syncInterval) clearInterval(syncInterval);
syncInterval = setInterval(() => {
if (conn && conn.open && !videoPlayer.paused) {
conn.send(JSON.stringify({
type: 'sync_time',
time: videoPlayer.currentTime
}));
}
}, 2000);
}
}, 300);
});

conn.on('data', (data) => {
try {
const msg = JSON.parse(data);
if (msg.type === 'screen_info') {
partnerWidth = msg.width;
partnerHeight = msg.height;
if (msg.videoMode && msg.videoMode !== videoModeSelect.value) {
videoModeSelect.value = msg.videoMode;
updateInputsVisibility();
}
updateVideoStyle();
sendScreenInfo();
} else if (msg.type === 'play') {
videoPlayer.playbackRate = 1.0;
videoPlayer.play().catch(e => {});
playPauseBtn.textContent = '❚❚ Пауза';
} else if (msg.type === 'pause') {
videoPlayer.playbackRate = 1.0;
videoPlayer.pause();
playPauseBtn.textContent = '▶ Грати';
} else if (msg.type === 'restart') {
videoPlayer.playbackRate = 1.0;
videoPlayer.currentTime = 0;
videoPlayer.play().catch(e => {});
playPauseBtn.textContent = '❚❚ Пауза';
} else if (msg.type === 'seek') {
videoPlayer.currentTime = msg.time;
videoPlayer.playbackRate = 1.0;
} else if (msg.type === 'sync_time' && !isHost) {
if (!videoPlayer.paused && !isDraggingTimeline) {
const diff = videoPlayer.currentTime - msg.time;
if (Math.abs(diff) > 1.0) {
videoPlayer.currentTime = msg.time;
videoPlayer.playbackRate = 1.0;
} else if (diff > 0.1) {
videoPlayer.playbackRate = 0.93;
} else if (diff < -0.1) {
videoPlayer.playbackRate = 1.07;
} else {
videoPlayer.playbackRate = 1.0;
}
}
}
} catch(e) {}
});

conn.on('close', () => {
if (syncInterval) clearInterval(syncInterval);
alert("З'єднання закрито");
location.reload();
});
}

// Автоматичне відновлення та синхронізація при розблокуванні або повертанні в додаток
document.addEventListener('visibilitychange', () => {
if (!document.hidden) {
console.log("Додаток активовано знову, перевірка з'єднання...");
if (conn && conn.open) {
if (isHost) {
// Якщо хост повернувся, одразу відправляємо актуальний час
conn.send(JSON.stringify({
type: 'sync_time',
time: videoPlayer.currentTime
}));
if (videoModeSelect.value === 'stream') {
sendVideoStream();
}
} else {
// Якщо клієнт повернувся, робимо так, щоб відео не було на паузі якщо грає
if (videoPlayer.paused && !videoPlayer.ended) {
videoPlayer.play().catch(e => {});
}
}
} else {
// Якщо з'єднання відпало в фоні — намагаємося перепідключитися або оновити статус
connectionStatus.textContent = "Статус: З'єднання втрачено у фоні. Перезавантажте сторінку.";
}
}
});

positionSelect.addEventListener('change', () => {
sendScreenInfo();
updateVideoStyle();
saveSettings();
});

videoPlayer.addEventListener('loadedmetadata', () => {
updateVideoStyle();
});

function updateVideoStyle() {
const myWidth = window.innerWidth;
const myHeight = window.innerHeight;
const pWidth = partnerWidth > 0 ? partnerWidth : myWidth;

const position = positionSelect.value;
const videoAspect = (videoPlayer.videoWidth && videoPlayer.videoHeight)
? (videoPlayer.videoWidth / videoPlayer.videoHeight)
: (16 / 9);

let finalWidth, finalHeight, leftPos, topPos;

const combinedWidth = myWidth + pWidth;
finalWidth = combinedWidth * videoScaleMultiplier;
finalHeight = finalWidth / videoAspect;

if (position === 'left') {
leftPos = videoOffsetX;
} else {
leftPos = videoOffsetX - pWidth;
}
topPos = videoOffsetY;

videoPlayer.style.width = finalWidth + 'px';
videoPlayer.style.height = finalHeight + 'px';
videoPlayer.style.left = leftPos + 'px';
videoPlayer.style.top = topPos + 'px';
}

window.addEventListener('resize', updateVideoStyle);
if (window.visualViewport) {
window.visualViewport.addEventListener('resize', updateVideoStyle);
}

playPauseBtn.addEventListener('click', () => {
if (videoPlayer.paused) {
videoPlayer.playbackRate = 1.0;
videoPlayer.play().catch(e => {});
playPauseBtn.textContent = '❚❚ Пауза';
if (conn) conn.send(JSON.stringify({ type: 'play' }));
} else {
videoPlayer.pause();
playPauseBtn.textContent = '▶ Грати';
if (conn) conn.send(JSON.stringify({ type: 'pause' }));
}
});

restartBtn.addEventListener('click', () => {
videoPlayer.playbackRate = 1.0;
videoPlayer.currentTime = 0;
videoPlayer.play().catch(e => {});
playPauseBtn.textContent = '❚❚ Пауза';
if (conn) conn.send(JSON.stringify({ type: 'restart' }));
});

fullscreenBtn.addEventListener('click', () => {
const elem = document.documentElement;
if (!document.fullscreenElement && !document.webkitFullscreenElement) {
if (elem.requestFullscreen) elem.requestFullscreen().catch(e => {});
else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
} else {
if (document.exitFullscreen) document.exitFullscreen().catch(e => {});
else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
});

document.addEventListener('fullscreenchange', updateFullscreenText);
document.addEventListener('webkitfullscreenchange', updateFullscreenText);

function updateFullscreenText() {
if (document.fullscreenElement || document.webkitFullscreenElement) {
fullscreenBtn.textContent = '✕ Звичайний';
} else {
fullscreenBtn.textContent = '⛶ Екран';
}
}

playerScreen.addEventListener('click', (e) => {
if (hasSwiped) {
hasSwiped = false;
return;
}
if (!playerControls.contains(e.target)) {
playerControls.style.display = playerControls.style.display === 'none' ? 'flex' : 'none';
}
});

function formatTime(seconds) {
if (isNaN(seconds)) return "00:00";
const mins = Math.floor(seconds / 60);
const secs = Math.floor(seconds % 60);
return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

videoPlayer.addEventListener('timeupdate', () => {
if (!isDraggingTimeline && videoPlayer.duration) {
const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
timelineRange.value = progress;
timeDisplay.textContent = `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
}
});

timelineRange.addEventListener('mousedown', () => { isDraggingTimeline = true; });
timelineRange.addEventListener('touchstart', () => { isDraggingTimeline = true; }, { passive: true });

timelineRange.addEventListener('input', () => {
if (!isNaN(videoPlayer.duration)) {
const newTime = (timelineRange.value / 100) * videoPlayer.duration;
timeDisplay.textContent = `${formatTime(newTime)} / ${formatTime(videoPlayer.duration)}`;
}
});

timelineRange.addEventListener('change', () => {
isDraggingTimeline = false;
if (!isNaN(videoPlayer.duration)) {
const newTime = (timelineRange.value / 100) * videoPlayer.duration;
videoPlayer.currentTime = newTime;
videoPlayer.playbackRate = 1.0;
if (conn && conn.open) {
conn.send(JSON.stringify({ type: 'seek', time: newTime }));
}
}
});

timelineRange.addEventListener('mouseup', () => { isDraggingTimeline = false; });
timelineRange.addEventListener('touchend', () => { isDraggingTimeline = false; });

playerScreen.addEventListener('touchstart', (e) => {
if (playerControls.contains(e.target)) return;
if (e.touches.length === 1) {
isSwipingVolume = true;
touchStartY = e.touches[0].clientY;
touchStartX = e.touches[0].clientX;
touchStartVolume = videoPlayer.volume;
hasSwiped = false;
}
}, { passive: true });

playerScreen.addEventListener('touchmove', (e) => {
if (!isSwipingVolume || e.touches.length !== 1) return;
const currentY = e.touches[0].clientY;
const currentX = e.touches.clientX || e.touches[0].clientX;
const diffY = touchStartY - currentY;
const diffX = touchStartX - currentX;

if (Math.abs(diffY) > 10 || Math.abs(diffX) > 10) {
hasSwiped = true;
}

if (hasSwiped) {
const screenHeight = window.innerHeight;
const volumeChange = (diffY / screenHeight) * 1.5;
let newVolume = Math.max(0, Math.min(1, touchStartVolume + volumeChange));
videoPlayer.volume = newVolume;
showVolumeIndicator(Math.round(newVolume * 100));
}
}, { passive: true });

playerScreen.addEventListener('touchend', () => {
isSwipingVolume = false;
});

function showVolumeIndicator(volPercent) {
volumeIndicator.textContent = `🔊 Гучність: ${volPercent}%`;
volumeIndicator.style.display = 'block';
volumeIndicator.style.opacity = '1';

if (volumeTimeout) clearTimeout(volumeTimeout);
volumeTimeout = setTimeout(() => {
volumeIndicator.style.opacity = '0';
setTimeout(() => {
if (volumeIndicator.style.opacity === '0') {
volumeIndicator.style.display = 'none';
}
}, 300);
}, 1000);
}

function applyShift(dx, dy) {
videoOffsetX += dx;
videoOffsetY += dy;
updateVideoStyle();
saveSettings();
}

function applyScale(ds) {
videoScaleMultiplier = Math.max(0.1, Math.min(5.0, videoScaleMultiplier + ds));
updateVideoStyle();
saveSettings();
}

document.getElementById('playerSaveBtn').addEventListener('click', saveSettings);

document.getElementById('shiftUpBtn').addEventListener('click', () => applyShift(0, -4));
document.getElementById('shiftDownBtn').addEventListener('click', () => applyShift(0, 4));
document.getElementById('shiftLeftBtn').addEventListener('click', () => applyShift(-4, 0));
document.getElementById('shiftRightBtn').addEventListener('click', () => applyShift(4, 0));
document.getElementById('scalePlusBtn').addEventListener('click', () => applyScale(0.02));
document.getElementById('scaleMinusBtn').addEventListener('click', () => applyScale(-0.02));
document.getElementById('resetShiftBtn').addEventListener('click', () => {
videoOffsetX = 0;
videoOffsetY = 0;
videoScaleMultiplier = 1.0;
updateVideoStyle();
saveSettings();
});
</script>
</body>
</html>
