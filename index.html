<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScreenParty Sync Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    overflow: hidden;
}

video {
    position: absolute;
    background: #000;
    object-fit: fill;
    transform-origin: center center;
}

#videoPlayer {
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

#startScreen {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
}

.panel {
    width: min(520px, 100%);
    background: #1c1c1c;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

h1 {
    margin: 0 0 18px;
    text-align: center;
    font-size: 25px;
}

h2 {
    margin: 15px 0 8px;
    font-size: 18px;
}

label {
    display: block;
    margin: 9px 0 5px;
    font-size: 14px;
    color: #ccc;
}

input,
select,
button {
    width: 100%;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 16px;
}

input,
select {
    background: #303030;
    color: #fff;
}

button {
    background: #2979ff;
    color: white;
    font-weight: bold;
    margin-top: 8px;
}

button:active {
    transform: scale(.98);
}

button.secondary {
    background: #444;
}

button.danger {
    background: #b3261e;
}

.row {
    display: flex;
    gap: 8px;
}

.row > * {
    flex: 1;
}

.roleButtons {
    display: flex;
    gap: 8px;
}

.roleButtons button {
    background: #333;
}

.roleButtons button.active {
    background: #2979ff;
}

#status {
    text-align: center;
    margin-top: 12px;
    min-height: 22px;
    color: #9ad0ff;
    font-size: 14px;
}

#mainUI {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

#controls {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    padding: 10px;
    border-radius: 14px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px);
    pointer-events: auto;
    transition: opacity .25s;
}

#controls.hidden {
    opacity: 0;
    pointer-events: none;
}

.controlRow {
    display: flex;
    gap: 6px;
    align-items: center;
}

.controlRow button {
    width: auto;
    min-width: 42px;
    margin: 0;
    padding: 7px 10px;
    min-height: 38px;
}

#timeline {
    width: 100%;
    height: 30px;
    margin: 0;
    padding: 0;
    accent-color: #2979ff;
}

#timeText {
    text-align: center;
    font-size: 12px;
    color: #ddd;
    margin-top: 2px;
}

#calibration {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    max-height: calc(100% - 100px);
    overflow-y: auto;
    padding: 12px;
    background: rgba(0,0,0,.78);
    border-radius: 14px;
    pointer-events: auto;
    display: none;
    backdrop-filter: blur(8px);
}

#calibration.show {
    display: block;
}

.calRow {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 7px;
}

.calRow span {
    width: 90px;
    font-size: 13px;
}

.calRow button {
    width: auto;
    flex: 1;
    margin: 0;
    min-height: 38px;
}

.calValue {
    width: 60px;
    text-align: center;
}

#connectionInfo {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(0,0,0,.65);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: #ddd;
    pointer-events: none;
}

#hiddenAudio {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: .01;
    pointer-events: none;
}

.small {
    color: #aaa;
    font-size: 12px;
    line-height: 1.4;
    margin-top: 8px;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="app">

    <div id="startScreen">
        <div class="panel">

            <h1>ScreenParty Sync Pro</h1>

            <h2>Режим</h2>

            <div class="roleButtons">
                <button id="hostRoleBtn" class="active">
                    Головний<br>(Host - S25+)
                </button>

                <button id="clientRoleBtn">
                    Другий<br>(Client - S10)
                </button>
            </div>

            <label>Позиція телефону</label>

            <select id="positionSelect">
                <option value="left">Ліворуч</option>
                <option value="right">Праворуч</option>
            </select>

            <label>Код кімнати (5 цифр)</label>

            <input
                id="roomCode"
                inputmode="numeric"
                maxlength="5"
                placeholder="Наприклад 12345">

            <label>Відео</label>

            <input
                id="videoFile"
                type="file"
                accept="video/*">

            <button id="startBtn">
                Створити кімнату
            </button>

            <button id="connectBtn" class="hidden">
                Підключитися
            </button>

            <div id="status">
                Виберіть роль і відео
            </div>

            <div class="small">
                S25+ є головним джерелом часу. S10 синхронізується з ним.
            </div>

        </div>
    </div>

    <video id="videoPlayer"
           playsinline
           webkit-playsinline
           preload="auto"></video>

    <audio id="hiddenAudio" muted></audio>

    <div id="connectionInfo">
        Очікування...
    </div>

    <div id="mainUI">

        <div id="controls">

            <input id="timeline"
                   type="range"
                   min="0"
                   max="100"
                   value="0"
                   step="0.01">

            <div id="timeText">
                00:00 / 00:00
            </div>

            <div class="controlRow">

                <button id="playBtn">▶</button>
                <button id="pauseBtn">⏸</button>
                <button id="restartBtn">↺</button>
                <button id="fullscreenBtn">⛶</button>
                <button id="calibrationBtn">⚙</button>

            </div>

        </div>

        <div id="calibration">

            <h3>Калібрування</h3>

            <div class="calRow">
                <span>Масштаб</span>
                <button id="scaleDownBtn">−</button>
                <div id="scaleValue" class="calValue">1.00</div>
                <button id="scaleUpBtn">+</button>
            </div>

            <div class="calRow">
                <span>Вліво / вправо</span>
                <button id="shiftLeftBtn">←</button>
                <div id="offsetXValue" class="calValue">0</div>
                <button id="shiftRightBtn">→</button>
            </div>

            <div class="calRow">
                <span>Вгору / вниз</span>
                <button id="shiftUpBtn">↑</button>
                <div id="offsetYValue" class="calValue">0</div>
                <button id="shiftDownBtn">↓</button>
            </div>

            <div class="calRow">
                <button id="resetCalibrationBtn">
                    Скинути
                </button>
            </div>

            <div class="calRow">
                <button id="saveCalibrationBtn">
                    Зберегти
                </button>
            </div>

            <button id="closeCalibrationBtn" class="secondary">
                Закрити
            </button>

        </div>

    </div>

</div>

<script>
'use strict';

/* =========================================================
   SCREENPARTY SYNC PRO
   ========================================================= */

const videoPlayer = document.getElementById('videoPlayer');
const startScreen = document.getElementById('startScreen');
const statusEl = document.getElementById('status');
const connectionInfo = document.getElementById('connectionInfo');

const hostRoleBtn = document.getElementById('hostRoleBtn');
const clientRoleBtn = document.getElementById('clientRoleBtn');

const roomCodeInput = document.getElementById('roomCode');
const positionSelect = document.getElementById('positionSelect');
const videoFileInput = document.getElementById('videoFile');

const startBtn = document.getElementById('startBtn');
const connectBtn = document.getElementById('connectBtn');

const timeline = document.getElementById('timeline');
const timeText = document.getElementById('timeText');

const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const restartBtn = document.getElementById('restartBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const calibrationBtn = document.getElementById('calibrationBtn');

const controls = document.getElementById('controls');
const calibration = document.getElementById('calibration');

const scaleDownBtn = document.getElementById('scaleDownBtn');
const scaleUpBtn = document.getElementById('scaleUpBtn');

const shiftLeftBtn = document.getElementById('shiftLeftBtn');
const shiftRightBtn = document.getElementById('shiftRightBtn');
const shiftUpBtn = document.getElementById('shiftUpBtn');
const shiftDownBtn = document.getElementById('shiftDownBtn');

const resetCalibrationBtn =
    document.getElementById('resetCalibrationBtn');

const saveCalibrationBtn =
    document.getElementById('saveCalibrationBtn');

const closeCalibrationBtn =
    document.getElementById('closeCalibrationBtn');

const scaleValue = document.getElementById('scaleValue');
const offsetXValue = document.getElementById('offsetXValue');
const offsetYValue = document.getElementById('offsetYValue');


let isHost = true;
let peer = null;
let conn = null;

let roomCode = '';

let videoURL = null;

let isConnected = false;
let isDraggingTimeline = false;
let receivedFirstSync = false;

let syncTimer = null;
let wakeLock = null;
let wakeLockRetryTimer = null;
let wakeLockMonitorTimer = null;

let audioContext = null;
let antiSleepStarted = false;

let lastHostState = {
    playing: false,
    time: 0
};

let lastSyncReceived = 0;


/* =========================================================
   CALIBRATION
   ========================================================= */

let scale = parseFloat(
    localStorage.getItem('sp_scale') || '1'
);

let offsetX = parseInt(
    localStorage.getItem('sp_offsetX') || '0',
    10
);

let offsetY = parseInt(
    localStorage.getItem('sp_offsetY') || '0',
    10
);

let position =
    localStorage.getItem('sp_position') || 'left';

positionSelect.value = position;


function updateCalibrationUI() {

    scaleValue.textContent = scale.toFixed(2);
    offsetXValue.textContent = offsetX;
    offsetYValue.textContent = offsetY;

    applyCalibration();
}


function applyCalibration() {

    const appWidth = window.innerWidth;
    const appHeight = window.innerHeight;

    const x = offsetX;
    const y = offsetY;

    videoPlayer.style.transform =
        `translate3d(${x}px, ${y}px, 0) scale(${scale})`;

    videoPlayer.style.transformOrigin =
        'center center';

    videoPlayer.style.width =
        `${appWidth}px`;

    videoPlayer.style.height =
        `${appHeight}px`;
}


updateCalibrationUI();


scaleDownBtn.addEventListener('click', () => {

    scale = Math.max(
        0.1,
        +(scale - 0.05).toFixed(2)
    );

    updateCalibrationUI();
});


scaleUpBtn.addEventListener('click', () => {

    scale = Math.min(
        5,
        +(scale + 0.05).toFixed(2)
    );

    updateCalibrationUI();
});


shiftLeftBtn.addEventListener('click', () => {

    offsetX -= 4;
    updateCalibrationUI();
});


shiftRightBtn.addEventListener('click', () => {

    offsetX += 4;
    updateCalibrationUI();
});


shiftUpBtn.addEventListener('click', () => {

    offsetY -= 4;
    updateCalibrationUI();
});


shiftDownBtn.addEventListener('click', () => {

    offsetY += 4;
    updateCalibrationUI();
});


resetCalibrationBtn.addEventListener('click', () => {

    scale = 1;
    offsetX = 0;
    offsetY = 0;

    updateCalibrationUI();
});


saveCalibrationBtn.addEventListener('click', () => {

    localStorage.setItem('sp_scale', scale);
    localStorage.setItem('sp_offsetX', offsetX);
    localStorage.setItem('sp_offsetY', offsetY);
    localStorage.setItem('sp_position', position);

    statusEl.textContent = 'Калібрування збережено';
});


closeCalibrationBtn.addEventListener('click', () => {

    calibration.classList.remove('show');
});


calibrationBtn.addEventListener('click', () => {

    calibration.classList.toggle('show');
});


window.addEventListener('resize', applyCalibration);


/* =========================================================
   ROLE
   ========================================================= */

hostRoleBtn.addEventListener('click', () => {

    isHost = true;

    hostRoleBtn.classList.add('active');
    clientRoleBtn.classList.remove('active');

    startBtn.classList.remove('hidden');
    connectBtn.classList.add('hidden');

    statusEl.textContent =
        'Режим Host — S25+';
});


clientRoleBtn.addEventListener('click', () => {

    isHost = false;

    clientRoleBtn.classList.add('active');
    hostRoleBtn.classList.remove('active');

    startBtn.classList.add('hidden');
    connectBtn.classList.remove('hidden');

    statusEl.textContent =
        'Режим Client — S10';
});


positionSelect.addEventListener('change', () => {

    position = positionSelect.value;

    localStorage.setItem(
        'sp_position',
        position
    );
});


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return '00:00';
    }

    seconds = Math.max(0, Math.floor(seconds));

    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;

    if (h > 0) {

        return String(h).padStart(2, '0') +
            ':' +
            String(m).padStart(2, '0') +
            ':' +
            String(s).padStart(2, '0');
    }

    return String(m).padStart(2, '0') +
        ':' +
        String(s).padStart(2, '0');
}


/* =========================================================
   TIMELINE
   ========================================================= */

function updateTimeline() {

    if (!Number.isFinite(videoPlayer.duration)) {
        return;
    }

    const duration = videoPlayer.duration;

    if (!isDraggingTimeline) {

        timeline.max = duration;
        timeline.value =
            Math.min(
                videoPlayer.currentTime,
                duration
            );
    }

    timeText.textContent =
        `${formatTime(videoPlayer.currentTime)} / ` +
        `${formatTime(duration)}`;
}


videoPlayer.addEventListener(
    'timeupdate',
    updateTimeline
);

videoPlayer.addEventListener(
    'durationchange',
    updateTimeline
);

videoPlayer.addEventListener(
    'loadedmetadata',
    updateTimeline
);


timeline.addEventListener(
    'pointerdown',
    () => {
        isDraggingTimeline = true;
    }
);


timeline.addEventListener(
    'pointerup',
    () => {
        isDraggingTimeline = false;
    }
);


timeline.addEventListener(
    'input',
    () => {

        if (!Number.isFinite(videoPlayer.duration)) {
            return;
        }

        const t = parseFloat(timeline.value);

        timeText.textContent =
            `${formatTime(t)} / ` +
            `${formatTime(videoPlayer.duration)}`;
    }
);


timeline.addEventListener(
    'change',
    () => {

        const t = parseFloat(timeline.value);

        if (!Number.isFinite(t)) {
            return;
        }

        videoPlayer.currentTime = t;

        if (isHost) {

            sendToClient({
                type: 'seek',
                time: t
            });

            sendHostSync();
        } else {

            sendToHost({
                type: 'seek_request',
                time: t
            });
        }

        isDraggingTimeline = false;
    }
);


/* =========================================================
   VIDEO FILE
   ========================================================= */

function loadVideoFile() {

    const file = videoFileInput.files[0];

    if (!file) {
        return false;
    }

    if (videoURL) {
        URL.revokeObjectURL(videoURL);
    }

    videoURL = URL.createObjectURL(file);

    videoPlayer.src = videoURL;
    videoPlayer.load();

    return true;
}


/* =========================================================
   WAKE LOCK
   ========================================================= */

async function requestWakeLock() {

    if (!('wakeLock' in navigator)) {
        return false;
    }

    try {

        if (wakeLock &&
            !wakeLock.released) {

            return true;
        }

        wakeLock =
            await navigator.wakeLock.request('screen');

        connectionInfo.textContent =
            isConnected
                ? 'Підключено • екран активний'
                : 'Екран активний';

        wakeLock.addEventListener(
            'release',
            () => {

                wakeLock = null;

                connectionInfo.textContent =
                    isConnected
                        ? 'Підключено • екран звільнено'
                        : 'Екран звільнено';

                scheduleWakeLockRetry();
            }
        );

        return true;

    } catch (err) {

        wakeLock = null;

        scheduleWakeLockRetry();

        return false;
    }
}


function scheduleWakeLockRetry() {

    if (wakeLockRetryTimer) {
        clearTimeout(wakeLockRetryTimer);
    }

    wakeLockRetryTimer =
        setTimeout(
            () => {
                requestWakeLock();
            },
            1200
        );
}


async function checkWakeLock() {

    if (!document.hidden) {

        if (!wakeLock ||
            wakeLock.released) {

            await requestWakeLock();
        }
    }
}


function startWakeLockMonitor() {

    if (wakeLockMonitorTimer) {
        clearInterval(wakeLockMonitorTimer);
    }

    wakeLockMonitorTimer =
        setInterval(
            checkWakeLock,
            5000
        );

    requestWakeLock();
}


document.addEventListener(
    'visibilitychange',
    () => {

        if (!document.hidden) {
            requestWakeLock();
        }
    }
);


window.addEventListener(
    'focus',
    () => {
        requestWakeLock();
    }
);


window.addEventListener(
    'pageshow',
    () => {
        requestWakeLock();
    }
);


/* =========================================================
   ANTI-SLEEP AUDIO
   ========================================================= */

function startAntiSleepAudio() {

    if (antiSleepStarted) {
        return;
    }

    antiSleepStarted = true;

    try {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) {
            return;
        }

        audioContext =
            new AudioCtx();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value = 20;

        gain.gain.value = 0.00001;

        oscillator.connect(gain);
        gain.connect(
            audioContext.destination
        );

        oscillator.start();

    } catch (e) {
        console.log(
            'Anti sleep audio:',
            e
        );
    }
}


/* =========================================================
   PEER HELPERS
   ========================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


function sendToHost(data) {

    if (!conn ||
        !conn.open) {
        return;
    }

    try {
        conn.send(data);
    } catch (e) {
        console.log(e);
    }
}


function sendToClient(data) {

    if (!conn ||
        !conn.open) {
        return;
    }

    try {
        conn.send(data);
    } catch (e) {
        console.log(e);
    }
}


/* =========================================================
   HOST SYNC
   ========================================================= */

function getHostState() {

    return {
        type: 'sync_state',

        time:
            Number.isFinite(
                videoPlayer.currentTime
            )
                ? videoPlayer.currentTime
                : 0,

        playing:
            !videoPlayer.paused &&
            !videoPlayer.ended,

        duration:
            Number.isFinite(
                videoPlayer.duration
            )
                ? videoPlayer.duration
                : 0,

        sentAt:
            Date.now()
    };
}


function sendHostSync() {

    if (!isHost ||
        !conn ||
        !conn.open) {
        return;
    }

    sendToClient(
        getHostState()
    );
}


/* =========================================================
   SYNC TIMER
   ========================================================= */

function startSyncTimer() {

    if (syncTimer) {
        clearInterval(syncTimer);
    }

    syncTimer =
        setInterval(
            () => {

                if (isHost) {
                    sendHostSync();
                }

            },
            300
        );
}


/* =========================================================
   CLIENT SYNC
   ========================================================= */

function applyClientSync(data) {

    if (isHost) {
        return;
    }

    if (!videoPlayer.src) {
        return;
    }

    if (!Number.isFinite(data.time)) {
        return;
    }

    const hostTime = data.time;

    const localTime =
        Number.isFinite(
            videoPlayer.currentTime
        )
            ? videoPlayer.currentTime
            : 0;

    const diff =
        localTime - hostTime;

    lastSyncReceived =
        performance.now();

    /*
     * Перший sync:
     * одразу ставимо S10 у точну позицію S25+.
     */
    if (!receivedFirstSync) {

        receivedFirstSync = true;

        try {
            videoPlayer.currentTime =
                hostTime;
        } catch (e) {}

        if (data.playing) {

            videoPlayer.play()
                .catch(() => {});

        } else {

            videoPlayer.pause();
        }

        videoPlayer.playbackRate = 1;

        return;
    }


    /*
     * Якщо розсинхрон став більшим
     * приблизно за 250 мс —
     * робимо точний стрибок.
     */
    if (Math.abs(diff) > 0.25) {

        try {
            videoPlayer.currentTime =
                hostTime;
        } catch (e) {}

        videoPlayer.playbackRate = 1;
    }

    /*
     * Невеликий розсинхрон виправляємо
     * швидкістю, без помітного стрибка.
     */
    else if (!isDraggingTimeline) {

        let rate =
            1 - (diff * 0.08);

        rate =
            Math.max(
                0.97,
                Math.min(
                    1.03,
                    rate
                )
            );

        videoPlayer.playbackRate =
            rate;
    }


    /*
     * Стан Play / Pause завжди
     * визначає Host.
     */
    if (data.playing) {

        if (videoPlayer.paused) {

            videoPlayer.play()
                .catch(() => {});
        }

    } else {

        if (!videoPlayer.paused) {
            videoPlayer.pause();
        }

        videoPlayer.playbackRate = 1;
    }
}


/* =========================================================
   PEER CONNECTION
   ========================================================= */

function createHost() {

    roomCode =
        roomCodeInput.value
            .replace(/\D/g, '')
            .slice(0, 5);

    if (roomCode.length !== 5) {

        setStatus(
            'Введіть код із 5 цифр'
        );

        return;
    }

    if (!loadVideoFile()) {

        setStatus(
            'Виберіть відеофайл'
        );

        return;
    }

    const peerId =
        'sp-' + roomCode;

    setStatus(
        'Створення кімнати...'
    );

    peer =
        new Peer(
            peerId,
            {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                path: '/'
            }
        );


    peer.on(
        'open',
        id => {

            setStatus(
                'Кімната створена. Очікування S10...'
            );

            connectionInfo.textContent =
                'Очікування S10';

            startScreen.classList.add(
                'hidden'
            );

            startWakeLockMonitor();
            startAntiSleepAudio();
            startSyncTimer();

            requestWakeLock();
        }
    );


    peer.on(
        'connection',
        incomingConn => {

            if (conn) {

                try {
                    conn.close();
                } catch (e) {}
            }

            conn = incomingConn;

            setupConnection();

        }
    );


    peer.on(
        'error',
        err => {

            console.log(
                'Peer error:',
                err
            );

            setStatus(
                'Помилка: ' +
                (err.message || err.type)
            );
        }
    );
}


function connectClient() {

    roomCode =
        roomCodeInput.value
            .replace(/\D/g, '')
            .slice(0, 5);

    if (roomCode.length !== 5) {

        setStatus(
            'Введіть код із 5 цифр'
        );

        return;
    }

    if (!loadVideoFile()) {

        setStatus(
            'Виберіть те саме відео'
        );

        return;
    }

    setStatus(
        'Підключення до S25+...'
    );

    peer =
        new Peer(
            {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                path: '/'
            }
        );


    peer.on(
        'open',
        () => {

            const hostId =
                'sp-' + roomCode;

            conn =
                peer.connect(
                    hostId,
                    {
                        reliable: true
                    }
                );

            setupConnection();
        }
    );


    peer.on(
        'error',
        err => {

            console.log(
                'Peer error:',
                err
            );

            setStatus(
                'Помилка підключення: ' +
                (err.message || err.type)
            );
        }
    );
}


/* =========================================================
   CONNECTION HANDLER
   ========================================================= */

function setupConnection() {

    if (!conn) {
        return;
    }

    conn.on(
        'open',
        () => {

            isConnected = true;

            connectionInfo.textContent =
                'Підключено';

            setStatus(
                isHost
                    ? 'S10 підключено'
                    : 'Підключено до S25+'
            );

            startScreen.classList.add(
                'hidden'
            );

            startWakeLockMonitor();
            startAntiSleepAudio();
            requestWakeLock();

            if (isHost) {

                setTimeout(
                    sendHostSync,
                    100
                );
            }
        }
    );


    conn.on(
        'data',
        data => {

            if (!data ||
                !data.type) {
                return;
            }


            /* -------------------------
               CLIENT RECEIVES
               ------------------------- */

            if (!isHost) {

                if (data.type === 'sync_state') {

                    applyClientSync(data);
                    return;
                }


                if (data.type === 'seek') {

                    try {

                        videoPlayer.currentTime =
                            data.time;

                    } catch (e) {}

                    videoPlayer.playbackRate = 1;

                    return;
                }


                if (data.type === 'play') {

                    videoPlayer.play()
                        .catch(() => {});

                    requestWakeLock();

                    return;
                }


                if (data.type === 'pause') {

                    videoPlayer.pause();
                    videoPlayer.playbackRate = 1;

                    return;
                }


                if (data.type === 'restart') {

                    try {
                        videoPlayer.currentTime = 0;
                    } catch (e) {}

                    videoPlayer.play()
                        .catch(() => {});

                    return;
                }
            }


            /* -------------------------
               HOST RECEIVES
               ------------------------- */

            if (isHost) {

                if (data.type === 'seek_request') {

                    const t =
                        parseFloat(data.time);

                    if (
                        Number.isFinite(t) &&
                        Number.isFinite(
                            videoPlayer.duration
                        )
                    ) {

                        videoPlayer.currentTime =
                            Math.max(
                                0,
                                Math.min(
                                    t,
                                    videoPlayer.duration
                                )
                            );

                        sendToClient({
                            type: 'seek',
                            time:
                                videoPlayer.currentTime
                        });

                        sendHostSync();
                    }

                    return;
                }


                if (data.type === 'play_request') {

                    videoPlayer.play()
                        .then(() => {

                            sendToClient({
                                type: 'play'
                            });

                            sendHostSync();

                        })
                        .catch(() => {});

                    requestWakeLock();

                    return;
                }


                if (data.type === 'pause_request') {

                    videoPlayer.pause();

                    sendToClient({
                        type: 'pause'
                    });

                    sendHostSync();

                    return;
                }


                if (data.type === 'restart_request') {

                    try {
                        videoPlayer.currentTime = 0;
                    } catch (e) {}

                    videoPlayer.play()
                        .then(() => {

                            sendToClient({
                                type: 'restart'
                            });

                            sendHostSync();

                        })
                        .catch(() => {});

                    return;
                }
            }
        }
    );


    conn.on(
        'close',
        () => {

            isConnected = false;

            connectionInfo.textContent =
                'Зʼєднання втрачено';

            setStatus(
                'Зʼєднання втрачено'
            );
        }
    );


    conn.on(
        'error',
        err => {

            console.log(
                'Connection error:',
                err
            );
        }
    );
}


/* =========================================================
   START BUTTONS
   ========================================================= */

startBtn.addEventListener(
    'click',
    async () => {

        startAntiSleepAudio();

        await requestWakeLock();

        createHost();
    }
);


connectBtn.addEventListener(
    'click',
    async () => {

        startAntiSleepAudio();

        await requestWakeLock();

        connectClient();
    }
);


/* =========================================================
   PLAY / PAUSE / RESTART
   ========================================================= */

playBtn.addEventListener(
    'click',
    async () => {

        await requestWakeLock();

        if (isHost) {

            try {

                await videoPlayer.play();

                sendToClient({
                    type: 'play'
                });

                sendHostSync();

            } catch (e) {}

        } else {

            sendToHost({
                type: 'play_request'
            });
        }
    }
);


pauseBtn.addEventListener(
    'click',
    () => {

        if (isHost) {

            videoPlayer.pause();

            sendToClient({
                type: 'pause'
            });

            sendHostSync();

        } else {

            sendToHost({
                type: 'pause_request'
            });
        }
    }
);


restartBtn.addEventListener(
    'click',
    async () => {

        await requestWakeLock();

        if (isHost) {

            videoPlayer.currentTime = 0;

            try {

                await videoPlayer.play();

                sendToClient({
                    type: 'restart'
                });

                sendHostSync();

            } catch (e) {}

        } else {

            sendToHost({
                type: 'restart_request'
            });
        }
    }
);


/* =========================================================
   VIDEO EVENTS
   ========================================================= */

videoPlayer.addEventListener(
    'play',
    () => {

        requestWakeLock();

        if (isHost &&
            isConnected) {

            sendToClient({
                type: 'play'
            });

            sendHostSync();
        }
    }
);


videoPlayer.addEventListener(
    'pause',
    () => {

        if (isHost &&
            isConnected) {

            sendToClient({
                type: 'pause'
            });

            sendHostSync();
        }
    }
);


videoPlayer.addEventListener(
    'seeked',
    () => {

        updateTimeline();

        if (isHost &&
            isConnected) {

            sendToClient({
                type: 'seek',
                time:
                    videoPlayer.currentTime
            });

            sendHostSync();
        }
    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
    'click',
    async () => {

        await requestWakeLock();

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();
            }

        } catch (e) {}

        requestWakeLock();
    }
);


/* =========================================================
   HIDE / SHOW CONTROLS
   ========================================================= */

let controlsTimer = null;


function showControls() {

    controls.classList.remove(
        'hidden'
    );

    if (controlsTimer) {
        clearTimeout(controlsTimer);
    }

    controlsTimer =
        setTimeout(
            () => {

                if (!calibration.classList.contains('show')) {

                    controls.classList.add(
                        'hidden'
                    );
                }

            },
            4000
        );
}


document.getElementById('app')
    .addEventListener(
        'click',
        event => {

            if (
                event.target.closest(
                    '#controls'
                ) ||
                event.target.closest(
                    '#calibration'
                )
            ) {
                return;
            }

            if (
                startScreen.classList.contains(
                    'hidden'
                )
            ) {

                if (
                    controls.classList.contains(
                        'hidden'
                    )
                ) {

                    showControls();

                } else {

                    controls.classList.add(
                        'hidden'
                    );
                }
            }
        }
    );


showControls();


/* =========================================================
   INITIALIZATION
   ========================================================= */

roomCodeInput.addEventListener(
    'input',
    () => {

        roomCodeInput.value =
            roomCodeInput.value
                .replace(/\D/g, '')
                .slice(0, 5);
    }
);


document.addEventListener(
    'click',
    () => {

        /*
         * Це важливо:
         * Wake Lock найнадійніше отримується
         * після реальної дії користувача.
         */
        requestWakeLock();

    },
    {
        passive: true
    }
);


window.addEventListener(
    'beforeunload',
    () => {

        if (syncTimer) {
            clearInterval(syncTimer);
        }

        if (wakeLock) {

            try {
                wakeLock.release();
            } catch (e) {}
        }

        if (peer) {

            try {
                peer.destroy();
            } catch (e) {}
        }
    }
);


updateCalibrationUI();
updateTimeline();

</script>
