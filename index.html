<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Комбайн: Стрім, Синхронізація та Передача файлу</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); box-sizing: border-box; }
        h2 { font-size: 1.25rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .section { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #334155; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 6px; }
        select, input[type="text"], input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 8px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 4px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        video { width: 100%; max-height: 230px; background: #000; border-radius: 6px; margin-top: 8px; object-fit: cover; }
        .status { font-size: 0.875rem; color: #cbd5e1; margin-top: 8px; }
        .progress-bar { width: 100%; background: #334155; border-radius: 4px; overflow: hidden; height: 8px; margin-top: 8px; }
        .progress-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.1s linear; }
        .id-display { background: #0f172a; padding: 8px; border-radius: 6px; font-family: monospace; color: #38bdf8; word-break: break-all; margin-bottom: 8px; font-size: 0.9rem; }
        .mode-pane { display: none; }
        .mode-pane.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>P2P Мультикомбайн</h2>
        
        <div class="section">
            <label for="modeSelect">Виберіть режим роботи:</label>
            <select id="modeSelect">
                <option value="stream">Режим 1: Живий стрімінг з камери</option>
                <option value="sync">Режим 2: Синхронізація локальних файлів (у кожного свій файл)</option>
                <option value="chunk">Режим 3: P2P передача файлу частинами (робоча)</option>
            </select>
        </div>

        <div class="section">
            <label>Ваш ID підключення:</label>
            <div id="myId" class="id-display">Ініціалізація...</div>
            <label for="peerIdInput">ID іншого пристрою:</label>
            <input type="text" id="peerIdInput" placeholder="Введіть ID партнера">
            <button id="connectBtn">Підключитися</button>
            <div id="connectionStatus" class="status">Статус: Очікування...</div>
        </div>

        <!-- РЕЖИМ 1: Живий стрімінг -->
        <div id="pane-stream" class="mode-pane section">
            <label>Локальна камера:</label>
            <video id="localVideo" autoplay muted playsinline></video>
            <label style="margin-top: 12px;">Отриманий стрімінг:</label>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- РЕЖИМ 2: Синхронізація локальних файлів -->
        <div id="pane-sync" class="mode-pane section">
            <label style="color: #38bdf8; font-weight: bold;">Спільний перегляд (кожен завантажує свій файл)</label>
            <label for="syncFileInput">Виберіть відео на цьому пристрої:</label>
            <input type="file" id="syncFileInput" accept="video/*">
            <div id="syncTransferStatus" class="status">Статус файлу: Не вибрано</div>
            <video id="syncVideoPlayer" controls playsinline style="margin-top: 8px;"></video>
        </div>

        <!-- РЕЖИМ 3: P2P Передача файлу частинами -->
        <div id="pane-chunk" class="mode-pane section">
            <label style="color: #38bdf8; font-weight: bold;">P2P Передача файлу (з контролем буфера)</label>
            <label for="chunkFileInput">Виберіть файл для надсилання:</label>
            <input type="file" id="chunkFileInput" accept="video/*">
            <button id="sendChunkBtn" disabled>Надіслати файл по P2P</button>
            <div id="chunkTransferStatus" class="status">Статус: Очікування файлу</div>
            <div class="progress-bar"><div id="chunkProgressFill" class="progress-fill"></div></div>
            <video id="chunkVideoPlayer" controls playsinline style="margin-top: 8px;"></video>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        let peer = null;
        let activeConn = null;
        let activeCall = null;
        let localStream = null;
        let isRemoteAction = false;

        const modeSelect = document.getElementById('modeSelect');
        const myIdEl = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const connectionStatus = document.getElementById('connectionStatus');

        modeSelect.addEventListener('change', (e) => {
            document.querySelectorAll('.mode-pane').forEach(el => el.classList.remove('active'));
            document.getElementById(`pane-${e.target.value}`).classList.add('active');
            initPeer(e.target.value);
        });

        function initPeer(mode) {
            if (peer) peer.destroy();
            myIdEl.textContent = 'Оновлення ID...';
            connectionStatus.textContent = 'Статус: Перепідключення Peer...';

            peer = new Peer();

            peer.on('open', (id) => {
                myIdEl.textContent = id;
                connectionStatus.textContent = 'Статус: Готовий до підключення';
            });

            peer.on('connection', (conn) => {
                activeConn = conn;
                setupDataConnection(mode);
                connectionStatus.textContent = 'Статус: Підключено (вхідне)';
            });

            peer.on('call', async (call) => {
                activeCall = call;
                if (!localStream) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('localVideo').srcObject = localStream;
                    } catch (err) { console.log("Камера недоступна", err); }
                }
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
                connectionStatus.textContent = 'Статус: Відеопотік прийнято!';
            });

            peer.on('error', (err) => {
                connectionStatus.textContent = `Помилка: ${err.type}`;
                connectionStatus.style.color = '#ef4444';
            });
        }

        connectBtn.addEventListener('click', () => {
            const remoteId = peerIdInput.value.trim();
            if (!remoteId) return;
            const currentMode = modeSelect.value;
            connectionStatus.textContent = 'Статус: Підключення...';

            if (currentMode === 'stream') {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    document.getElementById('localVideo').srcObject = stream;
                    activeCall = peer.call(remoteId, stream);
                    activeCall.on('stream', (remoteStream) => {
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                    });
                    connectionStatus.textContent = 'Статус: Стрім надіслано!';
                }).catch(err => alert('Помилка доступу до камери: ' + err));
            } else {
                activeConn = peer.connect(remoteId, { reliable: true });
                setupDataConnection(currentMode);
            }
        });

        // Глобальні змінні для збирання файлу в Режимі 3
        let incomingMeta = null, incomingChunks = [], receivedBytes = 0;

        function setupDataConnection(mode) {
            if (!activeConn) return;

            activeConn.on('open', () => {
                connectionStatus.textContent = 'Статус: Дата-зʼєднання активне!';
                connectionStatus.style.color = '#22c55e';
                if (mode === 'chunk') {
                    document.getElementById('sendChunkBtn').disabled = false;
                }
            });

            activeConn.on('data', (data) => {
                if (mode === 'sync' && data.type === 'sync') {
                    const playerEl = document.getElementById('syncVideoPlayer');
                    isRemoteAction = true;
                    if (data.action === 'play') {
                        playerEl.currentTime = data.time;
                        playerEl.play().catch(e => {});
                    } else if (data.action === 'pause') {
                        playerEl.pause();
                        playerEl.currentTime = data.time;
                    } else if (data.action === 'seek') {
                        if (Math.abs(playerEl.currentTime - data.time) > 0.4) {
                            playerEl.currentTime = data.time;
                        }
                    }
                    setTimeout(() => { isRemoteAction = false; }, 300);
                } 
                else if (mode === 'chunk') {
                    const statusEl = document.getElementById('chunkTransferStatus');
                    const progressEl = document.getElementById('chunkProgressFill');
                    const playerEl = document.getElementById('chunkVideoPlayer');

                    if (data.type === 'file-meta') {
                        incomingMeta = data;
                        incomingChunks = [];
                        receivedBytes = 0;
                        statusEl.textContent = `Отримання: ${data.name} (0%)`;
                        progressEl.style.width = '0%';
                    } else if (data.type === 'file-chunk') {
                        incomingChunks.push(data.chunk);
                        receivedBytes += data.chunk.byteLength;
                        const pct = Math.round((receivedBytes / incomingMeta.size) * 100);
                        progressEl.style.width = pct + '%';
                        statusEl.textContent = `Отримано: ${pct}% (${Math.round(receivedBytes/1024/1024)} / ${Math.round(incomingMeta.size/1024/1024)} МБ)`;

                        if (receivedBytes >= incomingMeta.size) {
                            statusEl.textContent = 'Файл успішно отримано та готовий до відтворення!';
                            const blob = new Blob(incomingChunks, { type: incomingMeta.type });
                            playerEl.src = URL.createObjectURL(blob);
                        }
                    }
                }
            });
        }

        // Режим 2: Локальні файли
        document.getElementById('syncFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('syncVideoPlayer').src = URL.createObjectURL(file);
                document.getElementById('syncTransferStatus').textContent = `Завантажено: ${file.name}`;
            }
        });

        function bindSyncEvents(playerEl) {
            playerEl.addEventListener('play', () => {
                if (isRemoteAction || modeSelect.value !== 'sync') return;
                if (activeConn && activeConn.open) activeConn.send({ type: 'sync', action: 'play', time: playerEl.currentTime });
            });
            playerEl.addEventListener('pause', () => {
                if (isRemoteAction || modeSelect.value !== 'sync') return;
                if (activeConn && activeConn.open) activeConn.send({ type: 'sync', action: 'pause', time: playerEl.currentTime });
            });
            playerEl.addEventListener('seeked', () => {
                if (isRemoteAction || modeSelect.value !== 'sync') return;
                if (activeConn && activeConn.open) activeConn.send({ type: 'sync', action: 'seek', time: playerEl.currentTime });
            });
        }
        bindSyncEvents(document.getElementById('syncVideoPlayer'));

        // Режим 3: Надійне надсилання файлу частинами з контролем буфера
        document.getElementById('sendChunkBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('chunkFileInput');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('chunkTransferStatus');
            const progressEl = document.getElementById('chunkProgressFill');
            const playerEl = document.getElementById('chunkVideoPlayer');

            if (!file || !activeConn || !activeConn.open) return;

            statusEl.textContent = 'Підготовка до надсилання...';
            activeConn.send({ type: 'file-meta', name: file.name, size: file.size, type: file.type });

            const chunkSize = 16 * 1024; // 16 КБ шматки
            let offset = 0;
            const maxBufferSize = 64 * 1024; // Контроль заповнення буфера (64 КБ)

            while (offset < file.size) {
                // Якщо буфер WebRTC забитий, чекаємо, поки він розвантажиться
                while (activeConn.dataChannel && activeConn.dataChannel.bufferedAmount > maxBufferSize) {
                    await new Promise(resolve => setTimeout(resolve, 20));
                    if (!activeConn.open) {
                        statusEl.textContent = 'Помилка: зʼєднання перервано під час передачі.';
                        return;
                    }
                }

                const slice = file.slice(offset, offset + chunkSize);
                const arrayBuffer = await slice.arrayBuffer();

                activeConn.send({ type: 'file-chunk', chunk: arrayBuffer });
                offset += chunkSize;

                const pct = Math.min(100, Math.round((offset / file.size) * 100));
                progressEl.style.width = pct + '%';
                statusEl.textContent = `Надіслано: ${pct}% (${Math.round(offset/1024/1024)} / ${Math.round(file.size/1024/1024)} МБ)`;
            }

            statusEl.textContent = 'Файл успішно передано!';
            playerEl.src = URL.createObjectURL(file);
        });

        // Ініціалізація стартового режиму
        initPeer('stream');
    </script>
</body>
</html>
