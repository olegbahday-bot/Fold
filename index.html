<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScreenParty P2P Ultimate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<style>
body {
    margin: 0;
    background: #121212;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    box-sizing: border-box;
    overflow: hidden;
}
.card {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    text-align: center;
    z-index: 10;
    max-height: 95vh;
    overflow-y: auto;
}
h2 { margin-top: 0; font-size: 20px; color: #4CAF50; }
label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; text-align: left; }
select, input, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}
input[type="text"] {
    letter-spacing: 4px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
}
button {
    background: #4CAF50;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
}
button:hover { background: #45a049; }
.hidden { display: none !important; }

.mode-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
}
.mode-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #bbb;
    text-align: left;
    padding: 10px 12px;
    font-size: 13px;
    border-radius: 8px;
    margin: 0;
    font-weight: normal;
}
.mode-btn.active {
    background: #1b5e20;
    border-color: #4CAF50;
    color: #fff;
    font-weight: bold;
}
.mode-btn.locked { opacity: 0.7; cursor: default; }

.code-display {
    background: #fff;
    color: #000;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 6px;
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
    display: inline-block;
}

#playerScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #000;
    overflow: hidden;
    display: none;
    z-index: 100;
    touch-action: none;
}
video.vid-el {
    position: absolute;
    top: 0; left: 0;
    object-fit: fill;
    pointer-events: none;
}

.controls {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.94);
    padding: 8px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 200;
    width: 96%;
    max-width: 360px;
    box-sizing: border-box;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.controls-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}
.controls button {
    margin: 0;
    padding: 7px 2px;
    border-radius: 6px;
    font-size: 11px;
    background-color: #4CAF50;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}
.btn-full { grid-column: span 3; }
.reset-btn { background-color: #444; }
.action-btn { background-color: #2196F3; }
.scale-btn { background-color: #E91E63; }
.fullscreen-btn { background-color: #FF9800; }
.save-btn { background-color: #FF5722; }
.file-btn { background-color: #607D8B; }
.sync-btn { background-color: #9C27B0; }

.timeline-container { width: 100%; margin-bottom: 4px; box-sizing: border-box; }
.time-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #bbb;
    margin-bottom: 2px;
    font-weight: bold;
}
input[type="range"].video-seek {
    width: 100%; margin: 0; padding: 0; accent-color: #4CAF50; cursor: pointer; background: transparent;
}
.status {
    font-size: 12px;
    margin-top: 10px;
    color: #ff9800;
    word-break: break-all;
}
</style>
</head>
<body>

<div class="card" id="setupCard">
    <h2>ScreenParty P2P</h2>

    <label style="color: #4CAF50; font-weight: bold;">Режим роботи:</label>
    <div class="mode-group" id="modeGroup">
        <button type="button" class="mode-btn" data-mode="stream">1. Стрімінг (Трансляція)</button>
        <button type="button" class="mode-btn" data-mode="local">2. Два локальних файли</button>
        <button type="button" class="mode-btn active" data-mode="p2p">3. P2P передача файлу частинами</button>
    </div>

    <label style="margin-top: 12px;">Роль пристрою:</label>
    <select id="roleSelect">
        <option value="host">Головний (Host)</option>
        <option value="client">Другий (Client)</option>
    </select>

    <label>Позиція екрана:</label>
    <select id="positionSelect">
        <option value="left">Ліва частина</option>
        <option value="right">Права частина</option>
    </select>

    <div id="videoPickerContainer">
        <label id="videoLabel" style="color: #ffeb3b;">Виберіть відеофайл (.mp4):</label>
        <input type="file" id="videoInput" accept="video/mp4,video/webm">
    </div>

    <div id="hostSection">
        <button id="startHostBtn">Створити кімнату</button>
        <div id="codeContainer" class="hidden">
            <div style="font-size: 12px; color: #aaa; margin-top: 6px;">Код для підключення:</div>
            <div id="hostCodeDisplay" class="code-display">-----</div>
        </div>
    </div>

    <div id="clientSection" class="hidden">
        <label for="clientCodeInput">Введіть код з головного телефону:</label>
        <input type="text" id="clientCodeInput" maxlength="5" placeholder="12345" autocomplete="off">
        <button id="connectClientBtn">Підключитися</button>
    </div>

    <div class="status" id="connectionStatus">Статус: Готово. Виберіть файл на головному телефоні.</div>
</div>

<div id="playerScreen">
    <video id="videoPlayer" class="vid-el" playsinline webkit-playsinline></video>

    <div class="controls" id="playerControls">
        <div class="timeline-container">
            <div class="time-labels">
                <span id="currentTimeText">0:00</span>
                <span id="durationText">0:00</span>
            </div>
            <input type="range" id="videoSeek" class="video-seek" value="0" min="0" max="100" step="0.1">
        </div>

        <div class="controls-grid">
            <button id="playPauseBtn" class="action-btn">▶ Грати</button>
            <button id="restartBtn" class="action-btn">↺ Спочатку</button>
            <button id="fullscreenBtn" class="fullscreen-btn">⛶ Екран</button>

            <button id="playerSaveBtn" class="save-btn btn-full">💾 Зберегти калібрування</button>

            <button id="scalePlusBtn" class="scale-btn">🔍 Збільшити</button>
            <button id="resetShiftBtn" class="reset-btn">Скидання</button>
            <button id="scaleMinusBtn" class="scale-btn">🔍 Зменшити</button>

            <button id="shiftLeftBtn">◄ Ліворуч</button>
            <button id="shiftUpBtn">▲ Вгору</button>
            <button id="shiftRightBtn">Праворуч ►</button>

            <button class="reset-btn" style="visibility: hidden;"></button>
            <button id="shiftDownBtn">▼ Вниз</button>
            <button id="syncTimeBtn" class="sync-btn">⚡ Синхроніз.</button>
        </div>
    </div>
</div>

<script>
const setupCard = document.getElementById('setupCard');
const playerScreen = document.getElementById('playerScreen');
const videoPlayer = document.getElementById('videoPlayer');

const modeButtons = document.querySelectorAll('.mode-btn');
const roleSelect = document.getElementById('roleSelect');
const positionSelect = document.getElementById('positionSelect');
const videoInput = document.getElementById('videoInput');
const videoPickerContainer = document.getElementById('videoPickerContainer');
const videoLabel = document.getElementById('videoLabel');
const hostSection = document.getElementById('hostSection');
const clientSection = document.getElementById('clientSection');
const connectionStatus = document.getElementById('connectionStatus');

const startHostBtn = document.getElementById('startHostBtn');
const codeContainer = document.getElementById('codeContainer');
const hostCodeDisplay = document.getElementById('hostCodeDisplay');
const clientCodeInput = document.getElementById('clientCodeInput');
const connectClientBtn = document.getElementById('connectClientBtn');

const playPauseBtn = document.getElementById('playPauseBtn');
const restartBtn = document.getElementById('restartBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const syncTimeBtn = document.getElementById('syncTimeBtn');

const currentTimeText = document.getElementById('currentTimeText');
const durationText = document.getElementById('durationText');
const videoSeek = document.getElementById('videoSeek');

let currentMode = 'p2p';
let peer = null;
let conn = null;
let isHost = false;
let localVideoBlobUrl = null;
let selectedFileObject = null;

// Змінні для збирання файлу на клієнті
let incomingFileMeta = null;
let incomingChunks = [];
let receivedBytes = 0;

let videoOffsetX = 0;
let videoOffsetY = 0;
let videoScaleMultiplier = 1.0;
let syncInterval = null;
let partnerWidth = 0;
let isSeeking = false;

function loadSavedSettings() {
    if (localStorage.getItem('sp_scale')) videoScaleMultiplier = parseFloat(localStorage.getItem('sp_scale'));
    if (localStorage.getItem('sp_offsetX')) videoOffsetX = parseFloat(localStorage.getItem('sp_offsetX'));
    if (localStorage.getItem('sp_offsetY')) videoOffsetY = parseFloat(localStorage.getItem('sp_offsetY'));
    if (localStorage.getItem('sp_position')) positionSelect.value = localStorage.getItem('sp_position');
}
loadSavedSettings();

function saveSettings() {
    localStorage.setItem('sp_scale', videoScaleMultiplier);
    localStorage.setItem('sp_offsetX', videoOffsetX);
    localStorage.setItem('sp_offsetY', videoOffsetY);
    localStorage.setItem('sp_position', positionSelect.value);
    alert('Калібрування збережено!');
}

function formatTime(s) {
    if (isNaN(s)) return "0:00";
    return Math.floor(s / 60) + ":" + Math.floor(s % 60).toString().padStart(2, '0');
}

const peerConfig = {
    host: '0.peerjs.com',
    port: 443,
    secure: true
};

roleSelect.addEventListener('change', () => {
    isHost = (roleSelect.value === 'host');
    positionSelect.value = isHost ? 'left' : 'right';
    hostSection.classList.toggle('hidden', !isHost);
    clientSection.classList.toggle('hidden', isHost);
    videoPickerContainer.classList.toggle('hidden', !isHost && currentMode === 'p2p');
});

modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
        updateUIState();
    });
});

function updateUIState() {
    if (currentMode === 'p2p') {
        videoPickerContainer.classList.toggle('hidden', !isHost);
        videoLabel.textContent = 'Виберіть відеофайл (.mp4) для відправки:';
    } else if (currentMode === 'local') {
        videoPickerContainer.classList.remove('hidden');
        videoLabel.textContent = 'Виберіть локальний файл (.mp4):';
    } else {
        videoPickerContainer.classList.toggle('hidden', !isHost);
    }
}
updateUIState();

videoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        selectedFileObject = file;
        localVideoBlobUrl = URL.createObjectURL(file);
        videoPlayer.src = localVideoBlobUrl;
        connectionStatus.textContent = 'Статус: Файл завантажено на головному телефоні';
    }
});

startHostBtn.addEventListener('click', () => {
    if (currentMode === 'p2p' && !selectedFileObject) { alert('Виберіть відеофайл спочатку!'); return; }
    isHost = true;
    startPeer('sp-' + Math.floor(10000 + Math.random() * 90000));
});

connectClientBtn.addEventListener('click', () => {
    const code = clientCodeInput.value.trim();
    if (code.length !== 5) { alert('Введіть 5-значний код!'); return; }
    isHost = false;
    startPeer(null, 'sp-' + code);
});

function startPeer(myId, connectId) {
    connectionStatus.textContent = 'Статус: Підключення до сервера сигналізації...';
    try {
        peer = new Peer(myId, peerConfig);

        peer.on('open', (id) => {
            if (isHost) {
                hostCodeDisplay.textContent = id.replace('sp-', '');
                codeContainer.classList.remove('hidden');
                connectionStatus.textContent = 'Статус: Очікування підключення другого телефону...';
            } else {
                connectionStatus.textContent = 'Статус: З\'єднання з кімнатою...';
                conn = peer.connect(connectId);
                setupConnection();
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });

        peer.on('error', (err) => {
            connectionStatus.textContent = 'Помилка PeerJS: ' + err.type;
        });
    } catch(e) {
        connectionStatus.textContent = 'Помилка: ' + e.message;
    }
}

function setupConnection() {
    conn.on('open', () => {
        connectionStatus.textContent = 'Статус: З\'єднано! Передача даних активна.';
        
        if (isHost) {
            conn.send(JSON.stringify({ type: 'sync_mode', mode: currentMode }));
            if (currentMode === 'p2p' && selectedFileObject) {
                sendFileToClient(selectedFileObject);
            }
        }
    });

    conn.on('data', (data) => {
        try {
            // Обробка бінарних чанків файлу в режимі P2P
            if (data instanceof ArrayBuffer) {
                if (incomingFileMeta) {
                    incomingChunks.push(data);
                    receivedBytes += data.byteLength;
                    const percent = Math.round((receivedBytes / incomingFileMeta.size) * 100);
                    connectionStatus.textContent = `Отримання файлу: ${percent}%`;
                    currentTimeText.textContent = `${percent}%`;

                    if (receivedBytes >= incomingFileMeta.size) {
                        const blob = new Blob(incomingChunks, { type: incomingFileMeta.mime });
                        localVideoBlobUrl = URL.createObjectURL(blob);
                        videoPlayer.src = localVideoBlobUrl;
                        videoPlayer.load();
                        connectionStatus.textContent = 'Статус: Файл успішно отримано і зібрано!';
                        
                        setTimeout(() => {
                            enterPlayerMode();
                        }, 800);
                    }
                }
                return;
            }

            const msg = JSON.parse(data);
            if (msg.type === 'file_meta') {
                incomingFileMeta = msg;
                incomingChunks = [];
                receivedBytes = 0;
            } else if (msg.type === 'screen_info') {
                partnerWidth = msg.width;
                updateVideoStyle();
            } else if (msg.type === 'play') { 
                videoPlayer.play().catch(e=>{}); 
                playPauseBtn.textContent = '❚❚ Пауза';
            } else if (msg.type === 'pause') { 
                videoPlayer.pause(); 
                playPauseBtn.textContent = '▶ Грати';
            } else if (msg.type === 'seek') { 
                videoPlayer.currentTime = msg.time; 
            } else if (msg.type === 'sync_time') {
                if (!isHost && !isSeeking && Math.abs(videoPlayer.currentTime - msg.time) > 1.0) {
                    videoPlayer.currentTime = msg.time;
                }
            }
        } catch(e){}
    });
}

// Функція передачі файлу частинами (робить P2P можливим для браузера)
function sendFileToClient(file) {
    const CHUNK_SIZE = 16384; // 16KB пакет
    const reader = new FileReader();
    let offset = 0;

    conn.send(JSON.stringify({
        type: 'file_meta',
        name: file.name,
        size: file.size,
        mime: file.type
    }));

    reader.onload = function(e) {
        if (conn && conn.open) {
            conn.send(e.target.result);
            offset += e.target.result.byteLength;
            
            const percent = Math.round((offset / file.size) * 100);
            connectionStatus.textContent = `Відправка файлу на клієнт: ${percent}%`;

            if (offset < file.size) {
                readNextChunk();
            } else {
                connectionStatus.textContent = 'Статус: Файл передано! Запуск плеєра...';
                setTimeout(() => {
                    enterPlayerMode();
                }, 1000);
            }
        }
    };

    function readNextChunk() {
        const slice = file.slice(offset, offset + CHUNK_SIZE);
        reader.readAsArrayBuffer(slice);
    }

    readNextChunk();
}

function enterPlayerMode() {
    setupCard.style.display = 'none';
    playerScreen.style.display = 'block';
    
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(e=>{});
    }

    updateVideoStyle();
    videoPlayer.play().then(() => {
        playPauseBtn.textContent = '❚❚ Пауза';
    }).catch(e => {
        playPauseBtn.textContent = '▶ Торкніться екрана';
    });

    if (conn && conn.open) {
        conn.send(JSON.stringify({ type: 'screen_info', width: window.innerWidth }));
    }

    if (isHost) {
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(() => {
            if (conn && conn.open && !videoPlayer.paused) {
                conn.send(JSON.stringify({ type: 'sync_time', time: videoPlayer.currentTime }));
            }
        }, 1000);
    }
}

videoPlayer.addEventListener('loadedmetadata', () => {
    updateVideoStyle();
    durationText.textContent = formatTime(videoPlayer.duration);
    videoSeek.max = videoPlayer.duration;
});

videoPlayer.addEventListener('timeupdate', () => {
    if (!isSeeking) {
        videoSeek.value = videoPlayer.currentTime;
        currentTimeText.textContent = formatTime(videoPlayer.currentTime);
    }
});

function updateVideoStyle() {
    const myW = window.innerWidth;
    const pW = partnerWidth > 0 ? partnerWidth : myW;
    const pos = positionSelect.value;
    const aspect = (videoPlayer.videoWidth && videoPlayer.videoHeight) ? (videoPlayer.videoWidth / videoPlayer.videoHeight) : (16/9);

    const finalW = (myW + pW) * videoScaleMultiplier;
    const finalH = finalW / aspect;
    const leftPos = (pos === 'left') ? videoOffsetX : (videoOffsetX - pW * videoScaleMultiplier);

    videoPlayer.style.width = finalW + 'px';
    videoPlayer.style.height = finalH + 'px';
    videoPlayer.style.left = leftPos + 'px';
    videoPlayer.style.top = videoOffsetY + 'px';
}

playPauseBtn.addEventListener('click', () => {
    if (videoPlayer.paused) {
        videoPlayer.play().catch(e=>{});
        playPauseBtn.textContent = '❚❚ Пауза';
        if (conn && conn.open) conn.send(JSON.stringify({ type: 'play' }));
    } else {
        videoPlayer.pause();
        playPauseBtn.textContent = '▶ Грати';
        if (conn && conn.open) conn.send(JSON.stringify({ type: 'pause' }));
    }
});

playerScreen.addEventListener('click', () => {
    if (videoPlayer.paused) {
        videoPlayer.play().catch(e=>{});
        playPauseBtn.textContent = '❚❚ Пауза';
    }
});

restartBtn.addEventListener('click', () => {
    videoPlayer.currentTime = 0;
    videoPlayer.play().catch(e=>{});
    if (conn && conn.open) conn.send(JSON.stringify({ type: 'seek', time: 0 }));
});

syncTimeBtn.addEventListener('click', () => {
    if (conn && conn.open) conn.send(JSON.stringify({ type: 'seek', time: videoPlayer.currentTime }));
});

fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{});
    else document.exitFullscreen().catch(e=>{});
});

videoSeek.addEventListener('input', () => {
    isSeeking = true;
    videoPlayer.currentTime = videoSeek.value;
    currentTimeText.textContent = formatTime(videoSeek.value);
});

videoSeek.addEventListener('change', () => {
    isSeeking = false;
    if (conn && conn.open) conn.send(JSON.stringify({ type: 'seek', time: videoPlayer.currentTime }));
});

document.getElementById('shiftUpBtn').addEventListener('click', () => { videoOffsetY -= 5; updateVideoStyle(); });
document.getElementById('shiftDownBtn').addEventListener('click', () => { videoOffsetY += 5; updateVideoStyle(); });
document.getElementById('shiftLeftBtn').addEventListener('click', () => { videoOffsetX -= 5; updateVideoStyle(); });
document.getElementById('shiftRightBtn').addEventListener('click', () => { videoOffsetX += 5; updateVideoStyle(); });
document.getElementById('scalePlusBtn').addEventListener('click', () => { videoScaleMultiplier += 0.02; updateVideoStyle(); });
document.getElementById('scaleMinusBtn').addEventListener('click', () => { videoScaleMultiplier = Math.max(0.1, videoScaleMultiplier - 0.02); updateVideoStyle(); });
document.getElementById('resetShiftBtn').addEventListener('click', () => { videoOffsetX = 0; videoOffsetY = 0; videoScaleMultiplier = 1.0; updateVideoStyle(); });
document.getElementById('playerSaveBtn').addEventListener('click', saveSettings);
</script>
</body>
</html>
