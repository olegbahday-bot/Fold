/* =========================
   REMOTE STREAM SYNC ENGINE
========================= */

function getPredictedHostTime(){

    if(hostSyncPaused)
        return hostSyncTime;

    if(!hostSyncReceivedAt)
        return hostSyncTime;

    const elapsed=
        (performance.now()-
         hostSyncReceivedAt)/1000;

    return hostSyncTime+elapsed;
}

function updateRemoteTimeline(){

    if(isHost)
        return;

    if(!videoPlayer.srcObject)
        return;

    if(remoteVideoDuration<=0)
        return;

    if(isDraggingTimeline)
        return;

    let displayTime=
        getPredictedHostTime();

    if(!Number.isFinite(displayTime))
        displayTime=remoteVideoTime;

    displayTime=
        Math.max(
            0,
            Math.min(
                remoteVideoDuration,
                displayTime
            )
        );

    remoteVideoTime=
        displayTime;

    const progress=
        displayTime/
        remoteVideoDuration*
        100;

    timelineRange.value=
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );

    timeDisplay.textContent=
        `${formatTime(displayTime)} / ${formatTime(remoteVideoDuration)}`;
}

function correctRemoteStream(){

    if(isHost)
        return;

    if(!videoPlayer.srcObject)
        return;

    if(hostSyncPaused){

        if(!videoPlayer.paused)
            videoPlayer.pause();

        videoPlayer.playbackRate=1;

        return;
    }

    if(videoPlayer.paused){

        videoPlayer.play().catch(()=>{});

        return;
    }

    const target=
        getPredictedHostTime();

    const actual=
        Number(videoPlayer.currentTime);

    if(!Number.isFinite(target)||
       !Number.isFinite(actual))
        return;

    const error=
        target-actual;

    if(Math.abs(error)<0.06){

        videoPlayer.playbackRate=1;

        return;
    }

    if(Math.abs(error)<0.8){

        let correction=
            1+(error*0.18);

        correction=
            Math.max(
                0.92,
                Math.min(
                    1.08,
                    correction
                )
            );

        videoPlayer.playbackRate=
            correction;

        return;
    }

    if(Math.abs(error)>=0.8){

        try{

            videoPlayer.currentTime=
                Math.max(
                    0,
                    target
                );

        }catch(e){}

        videoPlayer.playbackRate=1;
    }
}

/* =========================================================
   НОВА СИНХРОНІЗАЦІЯ ЛОКАЛЬНОГО КЕШУ
========================================================= */

function getCachePredictedTime(){

    if(cacheSyncPaused)
        return cacheSyncTime;

    if(!cacheSyncReceivedAt)
        return cacheSyncTime;

    const elapsed=
        (performance.now()-
         cacheSyncReceivedAt)/1000;

    return cacheSyncTime+elapsed;
}

function updateCacheTimeline(){

    if(isHost)
        return;

    if(videoModeSelect.value!==CACHE_MODE)
        return;

    if(!cacheRemoteReady)
        return;

    if(!Number.isFinite(videoPlayer.duration)||
       videoPlayer.duration<=0)
        return;

    if(isDraggingTimeline)
        return;

    let t=
        getCachePredictedTime();

    t=
        Math.max(
            0,
            Math.min(
                videoPlayer.duration,
                t
            )
        );

    timelineRange.value=
        Math.max(
            0,
            Math.min(
                100,
                t/videoPlayer.duration*100
            )
        );

    timeDisplay.textContent=
        `${formatTime(t)} / ${formatTime(videoPlayer.duration)}`;
}

function correctCachePlayback(){

    if(isHost)
        return;

    if(videoModeSelect.value!==CACHE_MODE)
        return;

    if(!cacheRemoteReady)
        return;

    if(cacheSyncPaused){

        if(!videoPlayer.paused)
            videoPlayer.pause();

        videoPlayer.playbackRate=1;

        return;
    }

    if(videoPlayer.paused){

        videoPlayer.play().catch(()=>{});

        return;
    }

    const target=
        getCachePredictedTime();

    const actual=
        Number(videoPlayer.currentTime);

    if(!Number.isFinite(target)||
       !Number.isFinite(actual))
        return;

    const error=
        target-actual;

    /*
      У локального файлу нам уже не треба
      боротися з мережевою затримкою відео.
      Тому допускаємо дуже малу похибку.
    */

    if(Math.abs(error)<0.025){

        videoPlayer.playbackRate=1;

        return;
    }

    /*
      Якщо розбіжність невелика,
      плавно підганяємо.
    */
    if(Math.abs(error)<0.25){

        let rate=
            1+(error*0.35);

        rate=
            Math.max(
                0.95,
                Math.min(
                    1.05,
                    rate
                )
            );

        videoPlayer.playbackRate=
            rate;

        return;
    }

    /*
      Якщо різниця вже помітна —
      робимо жорстке вирівнювання.
    */

    const now=
        performance.now();

    if(now-cacheLastHardSync>500){

        cacheLastHardSync=now;

        try{

            videoPlayer.currentTime=
                Math.max(
                    0,
                    Math.min(
                        videoPlayer.duration,
                        target
                    )
                );

        }catch(e){}

        videoPlayer.playbackRate=1;
    }
}

if(remoteSyncCorrectionTimer)
    clearInterval(remoteSyncCorrectionTimer);

remoteSyncCorrectionTimer=
    setInterval(()=>{

        if(!isHost){

            if(videoModeSelect.value==='cache'){

                correctCachePlayback();
                updateCacheTimeline();

            }else if(videoPlayer.srcObject){

                correctRemoteStream();
                updateRemoteTimeline();

            }
        }

    },80);

/* =========================
   CONNECTION
========================= */

function setupConnection(){

    const handleReady=()=>{

        connectionStatus.textContent=
            'Статус: Підключено!';

        sendScreenInfo();

        setTimeout(async()=>{

            setupCard.style.display='none';

            playerScreen.style.display='block';

            timelineContainer.style.display='flex';

            updateVideoStyle();

            startAntiSleepAudio();

            if(isHost){

                videoPlayer.muted=false;
                videoPlayer.volume=1;

                playPauseBtn.textContent=
                    '▶ Грати';

                setTimeout(()=>{

                    if(
                        videoModeSelect.value==='stream'&&
                        localVideoBlobUrl
                    ){

                        startStreaming();

                    }

                    if(
                        videoModeSelect.value===CACHE_MODE&&
                        localVideoBlobUrl
                    ){

                        /*
                          Передача відбувається після
                          завантаження метаданих.
                        */
                        if(
                            videoPlayer.readyState>=1&&
                            videoInput.files&&
                            videoInput.files[0]
                        ){

                            startCacheTransfer(
                                videoInput.files[0]
                            );
                        }
                    }

                    sendStreamState();
                    sendSyncState();
                    sendCacheSyncState();

                },700);

                if(syncInterval)
                    clearInterval(syncInterval);

                syncInterval=
                    setInterval(()=>{

                        if(conn&&conn.open){

                            if(
                                videoModeSelect.value==='stream'
                            ){

                                sendStreamState();

                            }else if(
                                videoModeSelect.value==='local'
                            ){

                                sendSyncState();

                            }else if(
                                videoModeSelect.value===CACHE_MODE
                            ){

                                sendCacheSyncState();
                            }
                        }

                    },100);

            }else{

                playPauseBtn.textContent=
                    '▶ Грати';

                if(videoModeSelect.value===CACHE_MODE){

                    await tryLoadExistingCache();

                    sendMessage({

                        type:'cache_client_ready'
                    });
                }
            }

        },300);
    };

    if(conn.open){

        handleReady();

    }else{

        conn.on('open',handleReady);
    }

    conn.on('data',async data=>{

        try{

            /*
              Усі повідомлення керування
              залишаються JSON.

              У cache режимі chunks приходять
              як об'єкти {type:'cache_chunk'}.
            */

            let msg=data;

            if(typeof data==='string'){

                msg=JSON.parse(data);

            }else if(
                data instanceof ArrayBuffer||
                data instanceof Uint8Array||
                data instanceof Blob
            ){

                /*
                  Старий режим не використовує
                  сирі binary повідомлення напряму.
                */

                return;
            }

            if(!msg||typeof msg!=='object')
                return;

            if(msg.type==='screen_info'){

                partnerWidth=
                    Number(msg.width)||0;

                partnerHeight=
                    Number(msg.height)||0;

                updateVideoStyle();

                if(isHost)
                    sendScreenInfo();
            }

            else if(msg.type==='cache_transfer_start'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                await cacheReceiveStart(msg);
            }

            else if(msg.type==='cache_chunk'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                await cacheReceiveChunk(msg);
            }

            else if(msg.type==='cache_transfer_end'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                await cacheReceiveEnd(msg);
            }

            else if(msg.type==='cache_ready'&&isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                cacheRemoteReady=true;

                cacheRemoteDuration=
                    Number(msg.duration)||0;

                connectionStatus.textContent=
                    'Статус: Відео успішно передано на S10. Готово до синхронного відтворення.';

                /*
                  Тепер обидва мають локальний файл.
                  Можемо стартувати тільки після
                  підтвердження S10.
                */

                sendCacheSyncState();
            }

            else if(msg.type==='cache_client_ready'&&isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                if(
                    videoInput.files&&
                    videoInput.files[0]
                ){

                    startCacheTransfer(
                        videoInput.files[0]
                    );

                }else{

                    connectionStatus.textContent=
                        'Статус: Виберіть відеофайл для кешу.';
                }
            }

            else if(msg.type==='cache_host_ready'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                cacheRemoteDuration=
                    Number(msg.duration)||0;
            }

            else if(msg.type==='video_change_start'&&!isHost){

                clearRemoteVideo();

                connectionStatus.textContent=
                    'Статус: Головний телефон змінює відео...';
            }

            else if(msg.type==='video_change_ready'&&!isHost){

                remoteVideoDuration=
                    Number(msg.duration)||0;

                remoteVideoTime=0;

                remoteVideoPaused=true;

                hostSyncTime=0;
                hostSyncReceivedAt=0;
                hostSyncPaused=true;

                timelineRange.value=0;

                timeDisplay.textContent=
                    `00:00 / ${formatTime(remoteVideoDuration)}`;

                connectionStatus.textContent=
                    'Статус: Очікування нового відеопотоку...';
            }

            /* =========================
               STREAM STATE CLIENT
            ========================= */

            else if(msg.type==='stream_state'&&!isHost){

                if(videoModeSelect.value==='cache')
                    return;

                const generation=
                    Number.isFinite(Number(msg.generation))
                    ?Number(msg.generation)
                    :remoteSyncGeneration;

                if(generation<remoteSyncGeneration)
                    return;

                remoteSyncGeneration=
                    generation;

                const newTime=
                    Number(msg.time);

                if(!Number.isFinite(newTime))
                    return;

                remoteVideoDuration=
                    Number(msg.duration)||0;

                remoteVideoPaused=
                    !!msg.paused;

                hostSyncTime=
                    Math.max(
                        0,
                        newTime
                    );

                hostSyncReceivedAt=
                    performance.now();

                hostSyncPaused=
                    remoteVideoPaused;

                if(remoteVideoDuration>0&&
                   !isDraggingTimeline){

                    remoteVideoTime=
                        hostSyncTime;

                    const percent=
                        remoteVideoTime/
                        remoteVideoDuration*
                        100;

                    timelineRange.value=
                        Math.max(
                            0,
                            Math.min(
                                100,
                                percent
                            )
                        );

                    timeDisplay.textContent=
                        `${formatTime(remoteVideoTime)} / ${formatTime(remoteVideoDuration)}`;
                }

                if(videoPlayer.srcObject){

                    if(remoteVideoPaused){

                        videoPlayer.pause();

                        videoPlayer.playbackRate=1;

                        playPauseBtn.textContent=
                            '▶ Грати';

                    }else{

                        if(videoPlayer.paused){

                            const actual=
                                Number(videoPlayer.currentTime);

                            if(Number.isFinite(actual)&&
                               Math.abs(actual-hostSyncTime)>0.5){

                                try{
                                    videoPlayer.currentTime=
                                        hostSyncTime;
                                }catch(e){}
                            }

                            videoPlayer.play().catch(()=>{});
                        }

                        playPauseBtn.textContent=
                            '❚❚ Пауза';

                        startAntiSleepAudio();
                        requestWakeLock();
                    }
                }
            }

            /* =========================
               CACHE SYNC STATE
            ========================= */

            else if(msg.type==='cache_sync_state'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                if(!cacheRemoteReady)
                    return;

                const generation=
                    Number.isFinite(Number(msg.generation))
                    ?Number(msg.generation)
                    :cacheSyncGeneration;

                if(generation<cacheSyncGeneration)
                    return;

                cacheSyncGeneration=
                    generation;

                const newTime=
                    Number(msg.time);

                const duration=
                    Number(msg.duration)||0;

                if(!Number.isFinite(newTime))
                    return;

                cacheSyncTime=
                    Math.max(
                        0,
                        newTime
                    );

                cacheSyncReceivedAt=
                    performance.now();

                cacheSyncPaused=
                    !!msg.paused;

                if(duration>0)
                    remoteVideoDuration=duration;

                if(!isDraggingTimeline){

                    const d=
                        Number.isFinite(videoPlayer.duration)&&
                        videoPlayer.duration>0
                        ?videoPlayer.duration
                        :duration;

                    if(d>0){

                        timelineRange.value=
                            Math.max(
                                0,
                                Math.min(
                                    100,
                                    cacheSyncTime/d*100
                                )
                            );

                        timeDisplay.textContent=
                            `${formatTime(cacheSyncTime)} / ${formatTime(d)}`;
                    }
                }

                if(cacheSyncPaused){

                    videoPlayer.pause();
                    videoPlayer.playbackRate=1;

                    playPauseBtn.textContent=
                        '▶ Грати';

                }else{

                    const actual=
                        Number(videoPlayer.currentTime);

                    if(
                        Number.isFinite(actual)&&
                        Math.abs(actual-cacheSyncTime)>0.25
                    ){

                        try{

                            videoPlayer.currentTime=
                                cacheSyncTime;

                        }catch(e){}
                    }

                    videoPlayer.play().catch(()=>{});

                    videoPlayer.playbackRate=1;

                    playPauseBtn.textContent=
                        '❚❚ Пауза';

                    startAntiSleepAudio();
                    requestWakeLock();
                }
            }

            /* =========================
               CACHE PLAY
            ========================= */

            else if(msg.type==='cache_play'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                const generation=
                    Number(msg.generation);

                if(
                    Number.isFinite(generation)&&
                    generation<cacheSyncGeneration
                )
                    return;

                if(Number.isFinite(generation))
                    cacheSyncGeneration=
                        generation;

                const t=
                    Number(msg.time);

                if(Number.isFinite(t)){

                    cacheSyncTime=t;

                    cacheSyncReceivedAt=
                        performance.now();
                }

                cacheSyncPaused=false;

                const actual=
                    Number(videoPlayer.currentTime);

                if(
                    Number.isFinite(t)&&
                    Number.isFinite(actual)&&
                    Math.abs(actual-t)>0.25
                ){

                    try{
                        videoPlayer.currentTime=t;
                    }catch(e){}
                }

                videoPlayer.playbackRate=1;

                videoPlayer.play().catch(()=>{});

                playPauseBtn.textContent=
                    '❚❚ Пауза';

                startAntiSleepAudio();
                requestWakeLock();
            }

            /* =========================
               CACHE PAUSE
            ========================= */

            else if(msg.type==='cache_pause'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                const generation=
                    Number(msg.generation);

                if(
                    Number.isFinite(generation)&&
                    generation<cacheSyncGeneration
                )
                    return;

                if(Number.isFinite(generation))
                    cacheSyncGeneration=
                        generation;

                const t=
                    Number(msg.time);

                if(Number.isFinite(t)){

                    cacheSyncTime=t;

                    cacheSyncReceivedAt=
                        performance.now();
                }

                cacheSyncPaused=true;

                if(
                    Number.isFinite(t)&&
                    Number.isFinite(videoPlayer.currentTime)&&
                    Math.abs(videoPlayer.currentTime-t)>0.05
                ){

                    try{
                        videoPlayer.currentTime=t;
                    }catch(e){}
                }

                videoPlayer.pause();
                videoPlayer.playbackRate=1;

                playPauseBtn.textContent=
                    '▶ Грати';
            }

            /* =========================
               CACHE RESTART
            ========================= */

            else if(msg.type==='cache_restart'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                const generation=
                    Number(msg.generation);

                if(
                    Number.isFinite(generation)&&
                    generation<cacheSyncGeneration
                )
                    return;

                if(Number.isFinite(generation))
                    cacheSyncGeneration=
                        generation;

                cacheSyncTime=0;

                cacheSyncReceivedAt=
                    performance.now();

                cacheSyncPaused=false;

                cacheLastHardSync=
                    performance.now();

                try{
                    videoPlayer.pause();
                }catch(e){}

                try{
                    videoPlayer.currentTime=0;
                }catch(e){}

                videoPlayer.playbackRate=1;

                timelineRange.value=0;

                if(videoPlayer.duration>0){

                    timeDisplay.textContent=
                        `00:00 / ${formatTime(videoPlayer.duration)}`;
                }

                videoPlayer.play().catch(()=>{});

                playPauseBtn.textContent=
                    '❚❚ Пауза';

                /*
                  Два повторних вирівнювання
                  для максимально однакового старту.
                */
                setTimeout(()=>{

                    if(videoModeSelect.value!==CACHE_MODE)
                        return;

                    try{
                        videoPlayer.currentTime=0;
                    }catch(e){}

                    videoPlayer.playbackRate=1;

                    videoPlayer.play().catch(()=>{});

                },120);

                setTimeout(()=>{

                    if(videoModeSelect.value!==CACHE_MODE)
                        return;

                    cacheSyncTime=0;

                    cacheSyncReceivedAt=
                        performance.now();

                    try{
                        videoPlayer.currentTime=0;
                    }catch(e){}

                    videoPlayer.playbackRate=1;

                },350);

                startAntiSleepAudio();
                requestWakeLock();
            }

            /* =========================
               CACHE SEEK
            ========================= */

            else if(msg.type==='cache_seek'&&!isHost){

                if(videoModeSelect.value!==CACHE_MODE)
                    return;

                if(isDraggingTimeline)
                    return;

                const generation=
                    Number(msg.generation);

                if(
                    Number.isFinite(generation)&&
                    generation<cacheSyncGeneration
                )
                    return;

                if(Number.isFinite(generation))
                    cacheSyncGeneration=
                        generation;

                const t=
                    Math.max(
                        0,
                        Number(msg.time)||0
                    );

                cacheSyncTime=t;

                cacheSyncReceivedAt=
                    performance.now();

                cacheSyncPaused=
                    !!msg.paused;

                cacheLastHardSync=
                    performance.now();

                try{
                    videoPlayer.currentTime=t;
                }catch(e){}

                videoPlayer.playbackRate=1;

                if(videoPlayer.duration>0){

                    timelineRange.value=
                        Math.max(
                            0,
                            Math.min(
                                100,
                                t/videoPlayer.duration*100
                            )
                        );

                    timeDisplay.textContent=
                        `${formatTime(t)} / ${formatTime(videoPlayer.duration)}`;
                }

                if(msg.paused){

                    videoPlayer.pause();

                    playPauseBtn.textContent=
                        '▶ Грати';

                }else{

                    /*
                      Повторна установка після
                      короткої затримки підвищує
                      точність після seek.
                    */
                    setTimeout(()=>{

                        try{
                            videoPlayer.currentTime=t;
                        }catch(e){}

                        videoPlayer.playbackRate=1;

                        videoPlayer.play().catch(()=>{});

                    },80);

                    setTimeout(()=>{

                        try{
                            videoPlayer.currentTime=t;
                        }catch(e){}

                        videoPlayer.playbackRate=1;

                        videoPlayer.play().catch(()=>{});

                    },220);

                    playPauseBtn.textContent=
                        '❚❚ Пауза';
                }
            }

            /* =========================
               LOCAL SYNC
            ========================= */

            else if(msg.type==='sync_state'&&!isHost){

                if(videoPlayer.srcObject)
                    return;

                if(videoModeSelect.value!=='local')
                    return;

                if(isDraggingTimeline)
                    return;

                const hostTime=
                    Number(msg.time);

                if(!Number.isFinite(hostTime))
                    return;

                const current=
                    videoPlayer.currentTime;

                const diff=
                    current-hostTime;

                if(Math.abs(diff)>.25){

                    try{

                        videoPlayer.currentTime=
                            Math.max(
                                0,
                                hostTime
                            );

                    }catch(e){}

                    videoPlayer.playbackRate=1;

                }else if(Math.abs(diff)>.035){

                    let rate=
                        1-diff*.08;

                    rate=
                        Math.max(
                            .97,
                            Math.min(
                                1.03,
                                rate
                            )
                        );

                    videoPlayer.playbackRate=
                        rate;

                }else{

                    videoPlayer.playbackRate=1;
                }

                if(msg.paused){

                    videoPlayer.pause();

                    playPauseBtn.textContent=
                        '▶ Грати';

                }else{

                    videoPlayer.play().catch(()=>{});

                    playPauseBtn.textContent=
                        '❚❚ Пауза';

                    startAntiSleepAudio();
                    requestWakeLock();
                }
            }

            /* =========================
               RESTART STREAM
            ========================= */

            else if(msg.type==='restart'&&!isHost){

                if(videoModeSelect.value==='cache')
                    return;

                const generation=
                    Number(msg.generation);

                if(Number.isFinite(generation)&&
                   generation<remoteSyncGeneration){

                    return;
                }

                if(Number.isFinite(generation))
                    remoteSyncGeneration=
                        generation;

                hostSyncTime=0;

                hostSyncReceivedAt=
                    performance.now();

                hostSyncPaused=false;

                remoteVideoTime=0;

                if(remoteVideoDuration>0){

                    timelineRange.value=0;

                    timeDisplay.textContent=
                        `00:00 / ${formatTime(remoteVideoDuration)}`;
                }

                try{

                    videoPlayer.currentTime=0;

                }catch(e){}

                videoPlayer.playbackRate=1;

                videoPlayer.play().catch(()=>{});

                playPauseBtn.textContent=
                    '❚❚ Пауза';

                setTimeout(()=>{

                    if(!videoPlayer.srcObject)
                        return;

                    try{
                        videoPlayer.currentTime=0;
                    }catch(e){}

                    videoPlayer.playbackRate=1;

                    videoPlayer.play().catch(()=>{});

                },180);

                setTimeout(()=>{

                    if(!videoPlayer.srcObject)
                        return;

                    hostSyncTime=0;

                    hostSyncReceivedAt=
                        performance.now();

                },500);
            }

            /* =========================
               SEEK STREAM
            ========================= */

            else if(msg.type==='seek'){

                if(isDraggingTimeline)
                    return;

                if(isHost)
                    return;

                if(videoModeSelect.value==='cache')
                    return;

                const generation=
                    Number(msg.generation);

                if(Number.isFinite(generation)&&
                   generation<remoteSyncGeneration){

                    return;
                }

                if(Number.isFinite(generation))
                    remoteSyncGeneration=
                        generation;

                const newTime=
                    Math.max(
                        0,
                        Number(msg.time)||0
                    );

                remoteVideoTime=
                    newTime;

                hostSyncTime=
                    newTime;

                hostSyncReceivedAt=
                    performance.now();

                hostSyncPaused=
                    !!msg.paused;

                if(remoteVideoDuration>0){

                    timelineRange.value=
                        Math.max(
                            0,
                            Math.min(
                                100,
                                newTime/
                                remoteVideoDuration*
                                100
                            )
                        );

                    timeDisplay.textContent=
                        `${formatTime(newTime)} / ${formatTime(remoteVideoDuration)}`;
                }

                if(videoPlayer.srcObject){

                    try{

                        videoPlayer.currentTime=
                            newTime;

                    }catch(e){}

                    videoPlayer.playbackRate=1;

                    if(msg.paused){

                        videoPlayer.pause();

                        playPauseBtn.textContent=
                            '▶ Грати';

                    }else{

                        videoPlayer.play().catch(()=>{});

                        playPauseBtn.textContent=
                            '❚❚ Пауза';
                    }
                }
            }

            /* =========================
               SEEK REQUEST
            ========================= */

            else if(msg.type==='seek_request'&&isHost){

                const requestedTime=
                    Number(msg.time);

                const duration=
                    Number(videoPlayer.duration);

                if(Number.isFinite(requestedTime)&&
                   Number.isFinite(duration)&&
                   duration>0){

                    if(videoModeSelect.value===CACHE_MODE){

                        cacheSyncGeneration++;

                        videoPlayer.currentTime=
                            Math.max(
                                0,
                                Math.min(
                                    duration,
                                    requestedTime
                                )
                            );

                        videoPlayer.playbackRate=1;

                        broadcastSeek(
                            videoPlayer.currentTime
                        );

                        sendCacheSyncState();

                    }else{

                        remoteSyncGeneration++;

                        videoPlayer.currentTime=
                            Math.max(
                                0,
                                Math.min(
                                    duration,
                                    requestedTime
                                )
                            );

                        videoPlayer.playbackRate=1;

                        broadcastSeek(
                            videoPlayer.currentTime
                        );

                        sendStreamState();
                        sendSyncState();
                    }
                }
            }

            else if(msg.type==='play_request'&&isHost){

                hostPlay();
            }

            else if(msg.type==='pause_request'&&isHost){

                hostPause();
            }

            else if(msg.type==='restart_request'&&isHost){

                hostRestart();
            }

        }catch(e){

            console.error(
                'Message error:',
                e
            );
        }
    });

    conn.on('close',()=>{

        if(syncInterval){

            clearInterval(syncInterval);

            syncInterval=null;
        }

        cacheHostSending=false;

        alert(
            "З'єднання закрито"
        );

        location.reload();
    });

    conn.on('error',err=>{

        console.error(
            'Connection error:',
            err
        );

        connectionStatus.textContent=
            'Статус: Помилка зʼєднання.';
    });
}

/* =========================
   POSITION
========================= */

positionSelect.addEventListener('change',()=>{

    sendScreenInfo();

    updateVideoStyle();

    saveSettings();
});

/* =========================
   VIDEO METADATA
========================= */

videoPlayer.addEventListener('loadedmetadata',()=>{

    updateVideoStyle();

    if(isHost&&
       Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        timelineRange.value=0;

        timeDisplay.textContent=
            `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;

        if(conn&&conn.open){

            sendStreamState();
            sendSyncState();
            sendCacheSyncState();
        }
    }
});

/* =========================
   VIDEO STYLE
========================= */

function updateVideoStyle(){

    const myWidth=
        window.innerWidth;

    const pWidth=
        partnerWidth>0
        ?partnerWidth
        :myWidth;

    const videoAspect=
        videoPlayer.videoWidth&&
        videoPlayer.videoHeight
        ?videoPlayer.videoWidth/
         videoPlayer.videoHeight
        :16/9;

    const combinedWidth=
        myWidth+pWidth;

    const finalWidth=
        combinedWidth*
        videoScaleMultiplier;

    const finalHeight=
        finalWidth/
        videoAspect;

    const leftPos=
        positionSelect.value==='left'
        ?videoOffsetX
        :videoOffsetX-pWidth;

    videoPlayer.style.width=
        finalWidth+'px';

    videoPlayer.style.height=
        finalHeight+'px';

    videoPlayer.style.transform=
        `translate3d(${leftPos}px,${videoOffsetY}px,0)`;
}

window.addEventListener('resize',()=>{

    updateVideoStyle();

    if(conn&&conn.open)
        sendScreenInfo();
});

if(window.visualViewport){

    window.visualViewport.addEventListener(
        'resize',
        ()=>{
            updateVideoStyle();
        }
    );
}

/* =========================
   PLAY / PAUSE
========================= */

playPauseBtn.addEventListener('click',()=>{

    startAntiSleepAudio();

    if(isHost){

        if(videoPlayer.paused)
            hostPlay();
        else
            hostPause();

    }else{

        if(conn&&conn.open){

            if(videoModeSelect.value===CACHE_MODE){

                sendMessage({

                    type:
                        videoPlayer.paused
                        ?'play_request'
                        :'pause_request'
                });

            }else{

                sendMessage({

                    type:
                        videoPlayer.paused
                        ?'play_request'
                        :'pause_request'
                });
            }
        }
    }
});

/* =========================
   RESTART
========================= */

restartBtn.addEventListener('click',()=>{

    startAntiSleepAudio();

    if(isHost){

        hostRestart();

    }else if(conn&&conn.open){

        sendMessage({
            type:'restart_request'
        });
    }
});

/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener('click',()=>{

    if(!document.fullscreenElement){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});

    }else{

        document.exitFullscreen();
    }
});

/* =========================
   CONTROLS
========================= */

playerScreen.addEventListener('click',e=>{

    startAntiSleepAudio();

    if(hasSwiped){

        hasSwiped=false;

        return;
    }

    if(!playerControls.contains(e.target)){

        playerControls.style.display=
            playerControls.style.display==='none'
            ?'flex'
            :'none';
    }
});

/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)||seconds<0)
        return '00:00';

    const hours=
        Math.floor(seconds/3600);

    const mins=
        Math.floor(
            (seconds%3600)/60
        );

    const secs=
        Math.floor(
            seconds%60
        );

    if(hours>0){

        return String(hours).padStart(2,'0')+
               ':'+
               String(mins).padStart(2,'0')+
               ':'+
               String(secs).padStart(2,'0');
    }

    return String(mins).padStart(2,'0')+
           ':'+
           String(secs).padStart(2,'0');
}

/* =========================
   TIME UPDATE
========================= */

videoPlayer.addEventListener('timeupdate',()=>{

    if(isHost&&
       Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        if(!isDraggingTimeline){

            const progress=
                videoPlayer.currentTime/
                videoPlayer.duration*
                100;

            timelineRange.value=
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );

            timeDisplay.textContent=
                `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
        }
    }

    /*
      У stream режимі S10 таймлайн
      не бере час з MediaStream.

      У cache режимі також не перезаписуємо
      час S10 його локальним currentTime,
      тому що головним годинником залишається S25+.
    */

    if(!isHost&&
       !videoPlayer.srcObject&&
       videoModeSelect.value==='local'&&
       Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        if(!isDraggingTimeline){

            const progress=
                videoPlayer.currentTime/
                videoPlayer.duration*
                100;

            timelineRange.value=
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );

            timeDisplay.textContent=
                `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
        }
    }
});

/* =========================
   TIMELINE
========================= */

function startTimelineDrag(){

    isDraggingTimeline=true;
}

timelineRange.addEventListener(
    'pointerdown',
    startTimelineDrag
);

timelineRange.addEventListener(
    'mousedown',
    startTimelineDrag
);

timelineRange.addEventListener(
    'touchstart',
    startTimelineDrag,
    {passive:true}
);

timelineRange.addEventListener('input',()=>{

    let duration=0;

    if(Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        duration=
            videoPlayer.duration;

    }else if(remoteVideoDuration>0){

        duration=
            remoteVideoDuration;
    }

    if(duration<=0)
        return;

    const newTime=
        Number(timelineRange.value)/
        100*
        duration;

    timeDisplay.textContent=
        `${formatTime(newTime)} / ${formatTime(duration)}`;
});

function finishTimelineDrag(){

    let duration=0;

    if(Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        duration=
            videoPlayer.duration;

    }else if(remoteVideoDuration>0){

        duration=
            remoteVideoDuration;
    }

    if(duration<=0){

        isDraggingTimeline=false;

        return;
    }

    const newTime=
        Number(timelineRange.value)/
        100*
        duration;

    if(isHost){

        if(videoModeSelect.value===CACHE_MODE){

            cacheSyncGeneration++;

            try{
                videoPlayer.currentTime=newTime;
            }catch(e){}

            videoPlayer.playbackRate=1;

            broadcastSeek(newTime);

            sendCacheSyncState();

        }else{

            remoteSyncGeneration++;

            try{
                videoPlayer.currentTime=newTime;
            }catch(e){}

            videoPlayer.playbackRate=1;

            broadcastSeek(newTime);

            sendStreamState();
            sendSyncState();
        }

    }else{

        if(conn&&conn.open){

            sendMessage({

                type:'seek_request',

                time:newTime
            });
        }
    }

    isDraggingTimeline=false;
}

timelineRange.addEventListener(
    'pointerup',
    finishTimelineDrag
);

timelineRange.addEventListener(
    'mouseup',
    finishTimelineDrag
);

timelineRange.addEventListener(
    'touchend',
    finishTimelineDrag,
    {passive:true}
);

/* =========================
   VOLUME
========================= */

playerScreen.addEventListener('touchstart',e=>{

    startAntiSleepAudio();

    if(playerControls.contains(e.target))
        return;

    if(e.touches.length===1){

        isSwipingVolume=true;

        touchStartY=
            e.touches[0].clientY;

        touchStartX=
            e.touches[0].clientX;

        touchStartVolume=
            videoPlayer.volume;

        hasSwiped=false;
    }

},{passive:true});

playerScreen.addEventListener('touchmove',e=>{

    if(!isSwipingVolume||
       e.touches.length!==1)
        return;

    const diffY=
        touchStartY-
        e.touches[0].clientY;

    const diffX=
        touchStartX-
        e.touches[0].clientX;

    if(Math.abs(diffY)>10||
       Math.abs(diffX)>10)
        hasSwiped=true;

    if(hasSwiped){

        const newVolume=
            Math.max(
                0,
                Math.min(
                    1,
                    touchStartVolume+
                    diffY/
                    window.innerHeight*
                    1.5
                )
            );

        videoPlayer.volume=
            newVolume;

        showVolumeIndicator(
            Math.round(
                newVolume*100
            )
        );
    }

},{passive:true});

playerScreen.addEventListener(
    'touchend',
    ()=>{
        isSwipingVolume=false;
    }
);

function showVolumeIndicator(volPercent){

    volumeIndicator.textContent=
        `🔊 Гучність: ${volPercent}%`;

    volumeIndicator.style.display=
        'block';

    if(volumeTimeout)
        clearTimeout(volumeTimeout);

    volumeTimeout=
        setTimeout(()=>{

            volumeIndicator.style.display=
                'none';

        },1000);
}

/* =========================
   CALIBRATION CONTROLS
========================= */

function applyShift(dx,dy){

    videoOffsetX+=dx;
    videoOffsetY+=dy;

    updateVideoStyle();
    updateCalibrationStyle();

    saveSettings();
}

function applyScale(ds){

    videoScaleMultiplier=
        Math.max(
            .1,
            Math.min(
                5,
                videoScaleMultiplier+ds
            )
        );

    updateVideoStyle();
    updateCalibrationStyle();

    saveSettings();
}

document.getElementById('playerSaveBtn')
.addEventListener(
    'click',
    saveSettings
);

document.getElementById('calibShiftUp')
.addEventListener(
    'click',
    ()=>applyShift(0,-4)
);

document.getElementById('calibShiftDown')
.addEventListener(
    'click',
    ()=>applyShift(0,4)
);

document.getElementById('calibShiftLeft')
.addEventListener(
    'click',
    ()=>applyShift(-4,0)
);

document.getElementById('calibShiftRight')
.addEventListener(
    'click',
    ()=>applyShift(4,0)
);

document.getElementById('calibScalePlus')
.addEventListener(
    'click',
    ()=>applyScale(.02)
);

document.getElementById('calibScaleMinus')
.addEventListener(
    'click',
    ()=>applyScale(-.02)
);

document.getElementById('calibReset')
.addEventListener('click',()=>{

    videoOffsetX=0;
    videoOffsetY=0;
    videoScaleMultiplier=1;

    updateVideoStyle();
    updateCalibrationStyle();

    saveSettings();
});

document.getElementById('shiftUpBtn')
.addEventListener(
    'click',
    ()=>applyShift(0,-4)
);

document.getElementById('shiftDownBtn')
.addEventListener(
    'click',
    ()=>applyShift(0,4)
);

document.getElementById('shiftLeftBtn')
.addEventListener(
    'click',
    ()=>applyShift(-4,0)
);

document.getElementById('shiftRightBtn')
.addEventListener(
    'click',
    ()=>applyShift(4,0)
);

document.getElementById('scalePlusBtn')
.addEventListener(
    'click',
    ()=>applyScale(.02)
);

document.getElementById('scaleMinusBtn')
.addEventListener(
    'click',
    ()=>applyScale(-.02)
);

document.getElementById('resetShiftBtn')
.addEventListener('click',()=>{

    videoOffsetX=0;
    videoOffsetY=0;
    videoScaleMultiplier=1;

    updateVideoStyle();

    updateCalibrationStyle();

    saveSettings();
});

/* =========================
   PLAY EVENT
========================= */

videoPlayer.addEventListener('play',()=>{

    startAntiSleepAudio();

    requestWakeLock();
});

/* =========================
   INITIAL
========================= */

updateVideoStyle();

</script>
