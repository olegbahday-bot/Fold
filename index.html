<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ScreenParty Sync Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #121212;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
}

.card {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    width: calc(100% - 20px);
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    text-align: center;
    z-index: 10;
    box-sizing: border-box;
}

h2 {
    margin-top: 0;
    font-size: 20px;
    color: #4CAF50;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: #bbb;
    text-align: left;
}

select,
input,
button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

input[type="text"] {
    letter-spacing: 4px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
}

button {
    background: #4CAF50;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #45a049;
}

.hidden {
    display: none !important;
}

.code-display {
    background: #fff;
    color: #000;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 6px;
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
    display: inline-block;
}

#calibrationScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 150;
}

.calib-box {
    position: absolute;
    top: 0;
    left: 0;
    border: 2px dashed #4CAF50;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(76,175,80,0.08);
    will-change: transform;
}

.calib-circle {
    width: 140px;
    height: 140px;
    border: 3px solid #FFEB3B;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #FFEB3B;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    background: rgba(255,235,59,0.15);
}

#playerScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: none;
    z-index: 100;
    overflow: hidden;
}

video.vid-el {
    position: absolute;
    top: 0;
    left: 0;
    object-fit: fill;
    will-change: transform;
}
