const setupCard=document.getElementById('setupCard');
const playerScreen=document.getElementById('playerScreen');
const calibrationScreen=document.getElementById('calibrationScreen');
const calibBox=document.getElementById('calibBox');
const videoPlayer=document.getElementById('videoPlayer');
const keepAwakeVideo=document.getElementById('keepAwakeVideo');
const playerControls=document.getElementById('playerControls');
const newVideoInput=document.getElementById('newVideoInput');
const timelineContainer=document.getElementById('timelineContainer');
const timelineRange=document.getElementById('timelineRange');
const timeDisplay=document.getElementById('timeDisplay');
const roleSelect=document.getElementById('roleSelect');
const positionSelect=document.getElementById('positionSelect');
const videoModeSelect=document.getElementById('videoModeSelect');
const fileInputContainer=document.getElementById('fileInputContainer');
const videoInput=document.getElementById('videoInput');
const hostSection=document.getElementById('hostSection');
const clientSection=document.getElementById('clientSection');
const connectionStatus=document.getElementById('connectionStatus');
const openCalibOverlayBtn=document.getElementById('openCalibOverlayBtn');
const closeCalibBtn=document.getElementById('closeCalibBtn');
const startHostBtn=document.getElementById('startHostBtn');
const codeContainer=document.getElementById('codeContainer');
const hostCodeDisplay=document.getElementById('hostCodeDisplay');
const clientCodeInput=document.getElementById('clientCodeInput');
const connectClientBtn=document.getElementById('connectClientBtn');
const playPauseBtn=document.getElementById('playPauseBtn');
const restartBtn=document.getElementById('restartBtn');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const volumeIndicator=document.getElementById('volumeIndicator');
const changeVideoBtn=document.getElementById('changeVideoBtn');

let peer=null;
let conn=null;
let activeCall=null;
let isHost=false;
let localVideoBlobUrl=null;

let audioCtx=null;
let silentOscillator=null;

let wakeLock=null;
let wakeLockRetryTimer=null;

let videoOffsetX=0;
let videoOffsetY=0;
let videoScaleMultiplier=1;

let syncInterval=null;
let partnerWidth=0;
let partnerHeight=0;

let isDraggingTimeline=false;
let isSwipingVolume=false;
let touchStartY=0;
let touchStartX=0;
let touchStartVolume=1;
let hasSwiped=false;
let volumeTimeout=null;

let remoteVideoDuration=0;
let remoteVideoTime=0;
let remoteVideoPaused=true;

let hostSyncTime=0;
let hostSyncReceivedAt=0;
let hostSyncPaused=true;
let remoteSyncGeneration=0;
let lastRemoteSeekTime=-1;
let remoteSyncCorrectionTimer=null;

let videoChangeInProgress=false;
let videoVersion=0;

/* =========================================================
   НОВИЙ РЕЖИМ: ЛОКАЛЬНИЙ КЕШ
   ========================================================= */

const CACHE_MODE='cache';

const CACHE_DB_NAME='ScreenPartyVideoCache';
const CACHE_DB_VERSION=1;
const CACHE_STORE='video';

const CACHE_CHUNK_SIZE=64*1024;

let cacheDB=null;

let cacheTransferId=0;
let cacheTransferActive=false;
let cacheTransferCancelled=false;

let cacheReceiveId='';
let cacheReceiveName='';
let cacheReceiveSize=0;
let cacheReceiveType='video/mp4';
let cacheReceiveReceived=0;
let cacheReceiveChunks=[];
let cacheReceiveChunkCount=0;
let cacheReceiveStartedAt=0;

let cacheHostSending=false;
let cacheHostSendToken=0;

let cacheRemoteReady=false;
let cacheRemoteDuration=0;
let cacheRemoteFileName='';

let cacheSyncTime=0;
let cacheSyncReceivedAt=0;
let cacheSyncPaused=true;
let cacheSyncGeneration=0;
let cacheLastHardSync=0;

let cacheLocalVideoUrl=null;

/* =========================================================
   PEER
   ========================================================= */

const peerOptions={
    debug:1,
    config:{
        iceServers:[
            {urls:'stun:stun.l.google.com:19302'},
            {urls:'stun:stun1.l.google.com:19302'}
        ]
    }
};

/* =========================
   WAKE LOCK
========================= */

async function requestWakeLock(){

    try{

        if(!('wakeLock' in navigator))
            return;

        if(document.visibilityState!=='visible')
            return;

        if(playerScreen.style.display==='none')
            return;

        if(wakeLock&&!wakeLock.released)
            return;

        wakeLock=await navigator.wakeLock.request('screen');

        wakeLock.addEventListener('release',()=>{

            wakeLock=null;

            if(wakeLockRetryTimer)
                clearTimeout(wakeLockRetryTimer);

            wakeLockRetryTimer=setTimeout(()=>{

                if(document.visibilityState==='visible'&&
                   playerScreen.style.display!=='none'&&
                   !videoPlayer.paused){

                    requestWakeLock();
                }

            },1000);
        });

    }catch(e){

        if(wakeLockRetryTimer)
            clearTimeout(wakeLockRetryTimer);

        wakeLockRetryTimer=setTimeout(()=>{

            if(document.visibilityState==='visible'&&
               playerScreen.style.display!=='none'&&
               !videoPlayer.paused){

                requestWakeLock();
            }

        },1500);
    }
}

function startAntiSleepAudio(){

    try{

        if(!audioCtx){
            audioCtx=
                new(window.AudioContext||window.webkitAudioContext)();
        }

        if(audioCtx.state==='suspended')
            audioCtx.resume().catch(()=>{});

        if(!silentOscillator){

            const gain=audioCtx.createGain();

            gain.gain.value=0.00001;

            const osc=audioCtx.createOscillator();

            osc.frequency.value=100;

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();

            silentOscillator={
                oscillator:osc,
                gain:gain
            };
        }

    }catch(e){}

    requestWakeLock();
}

function startKeepAwakeVideo(){
    requestWakeLock();
}

function stopKeepAwakeVideo(){}

document.addEventListener('visibilitychange',()=>{

    if(document.visibilityState==='visible'&&
       playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

window.addEventListener('focus',()=>{

    if(playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

window.addEventListener('pageshow',()=>{

    if(playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

document.addEventListener('fullscreenchange',()=>{

    setTimeout(()=>{

        requestWakeLock();
        updateVideoStyle();

    },300);
});

setInterval(()=>{

    if(playerScreen.style.display!=='none'&&
       document.visibilityState==='visible'&&
       !videoPlayer.paused){

        requestWakeLock();
    }

},4000);

/* =========================
   SETTINGS
========================= */

function loadSavedSettings(){

    const savedScale=localStorage.getItem('sp_scale');
    const savedX=localStorage.getItem('sp_offsetX');
    const savedY=localStorage.getItem('sp_offsetY');
    const savedPos=localStorage.getItem('sp_position');

    if(savedScale!==null)
        videoScaleMultiplier=
            Math.max(.1,Math.min(5,parseFloat(savedScale)));

    if(savedX!==null)
        videoOffsetX=parseFloat(savedX);

    if(savedY!==null)
        videoOffsetY=parseFloat(savedY);

    if(savedPos==='left'||savedPos==='right')
        positionSelect.value=savedPos;
}

loadSavedSettings();

function saveSettings(){

    localStorage.setItem('sp_scale',videoScaleMultiplier);
    localStorage.setItem('sp_offsetX',videoOffsetX);
    localStorage.setItem('sp_offsetY',videoOffsetY);
    localStorage.setItem('sp_position',positionSelect.value);
}

/* =========================
   INPUT VISIBILITY
========================= */

function updateInputsVisibility(){

    const role=roleSelect.value;
    const mode=videoModeSelect.value;

    if(role==='host'){

        hostSection.classList.remove('hidden');
        clientSection.classList.add('hidden');

        fileInputContainer.style.display='block';
        changeVideoBtn.style.display='block';

    }else{

        hostSection.classList.add('hidden');
        clientSection.classList.remove('hidden');

        /*
          Для stream файл на S10 не потрібен.
          Для local і cache S10 отримує/вибирає
          локальний файл відповідно до режиму.
        */
        fileInputContainer.style.display=
            mode==='stream'||mode==='cache'
            ?'none'
            :'block';

        changeVideoBtn.style.display='none';
    }
}

roleSelect.addEventListener('change',updateInputsVisibility);
videoModeSelect.addEventListener('change',updateInputsVisibility);

updateInputsVisibility();

/* =========================
   FULLSCREEN
========================= */

function requestFullscreenNow(){

    if(!document.fullscreenElement&&
       document.documentElement.requestFullscreen){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});
    }
}

/* =========================
   CALIBRATION
========================= */

openCalibOverlayBtn.addEventListener('click',()=>{

    calibrationScreen.style.display='block';

    updateCalibrationStyle();
});

closeCalibBtn.addEventListener('click',()=>{

    saveSettings();

    calibrationScreen.style.display='none';

    updateVideoStyle();

    openCalibOverlayBtn.style.display='none';
});

function updateCalibrationStyle(){

    const myWidth=window.innerWidth;

    const pWidth=
        partnerWidth>0
        ?partnerWidth
        :myWidth;

    const combinedWidth=myWidth+pWidth;

    const finalWidth=
        combinedWidth*videoScaleMultiplier;

    const videoAspect=
        videoPlayer.videoWidth&&videoPlayer.videoHeight
        ?videoPlayer.videoWidth/videoPlayer.videoHeight
        :16/9;

    const finalHeight=
        finalWidth/videoAspect;

    const leftPos=
        positionSelect.value==='left'
        ?videoOffsetX
        :videoOffsetX-pWidth;

    calibBox.style.width=finalWidth+'px';

    calibBox.style.height=finalHeight+'px';

    calibBox.style.transform=
        `translate3d(${leftPos}px,${videoOffsetY}px,0)`;
}

/* =========================================================
   CACHE DATABASE
   ========================================================= */

function openCacheDB(){

    if(cacheDB)
        return Promise.resolve(cacheDB);

    return new Promise((resolve,reject)=>{

        try{

            const request=
                indexedDB.open(
                    CACHE_DB_NAME,
                    CACHE_DB_VERSION
                );

            request.onupgradeneeded=e=>{

                const db=e.target.result;

                if(!db.objectStoreNames.contains(CACHE_STORE)){

                    db.createObjectStore(
                        CACHE_STORE,
                        {keyPath:'id'}
                    );
                }
            };

            request.onsuccess=e=>{

                cacheDB=e.target.result;

                resolve(cacheDB);
            };

            request.onerror=()=>{

                reject(
                    request.error||
                    new Error('IndexedDB error')
                );
            };

        }catch(e){

            reject(e);
        }
    });
}

async function clearCacheDB(){

    try{

        const db=
            await openCacheDB();

        await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readwrite'
                );

            tx.objectStore(
                CACHE_STORE
            ).clear();

            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error);
            tx.onabort=()=>reject(tx.error);

        });

    }catch(e){

        console.error(
            'Cache clear error:',
            e
        );
    }
}

async function saveCacheBlob(blob,meta){

    try{

        const db=
            await openCacheDB();

        await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readwrite'
                );

            tx.objectStore(
                CACHE_STORE
            ).put({

                id:'current',

                blob:blob,

                name:meta.name||'video',

                type:meta.type||blob.type||'video/mp4',

                size:blob.size,

                savedAt:Date.now()

            });

            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error);
            tx.onabort=()=>reject(tx.error);

        });

        return true;

    }catch(e){

        console.error(
            'Cache save error:',
            e
        );

        return false;
    }
}

async function loadCacheBlob(){

    try{

        const db=
            await openCacheDB();

        return await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readonly'
                );

            const request=
                tx.objectStore(
                    CACHE_STORE
                ).get('current');

            request.onsuccess=()=>{

                resolve(
                    request.result||null
                );
            };

            request.onerror=()=>{

                reject(
                    request.error
                );
            };
        });

    }catch(e){

        return null;
    }
}

async function deleteCacheBlob(){

    try{

        const db=
            await openCacheDB();

        await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readwrite'
                );

            tx.objectStore(
                CACHE_STORE
            ).delete('current');

            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error);

        });

    }catch(e){}
}

async function setCachedVideoBlob(blob,meta){

    if(cacheLocalVideoUrl){

        try{
            URL.revokeObjectURL(cacheLocalVideoUrl);
        }catch(e){}

        cacheLocalVideoUrl=null;
    }

    cacheLocalVideoUrl=
        URL.createObjectURL(blob);

    localVideoBlobUrl=
        cacheLocalVideoUrl;

    videoPlayer.pause();

    videoPlayer.srcObject=null;

    videoPlayer.src=
        cacheLocalVideoUrl;

    videoPlayer.load();

    videoPlayer.muted=false;
    videoPlayer.volume=1;

    await new Promise(resolve=>{

        let done=false;

        const finish=()=>{

            if(done)
                return;

            done=true;

            videoPlayer.removeEventListener(
                'loadedmetadata',
                finish
            );

            resolve();
        };

        videoPlayer.addEventListener(
            'loadedmetadata',
            finish
        );

        if(videoPlayer.readyState>=1)
            finish();

        setTimeout(
            finish,
            5000
        );
    });

    updateVideoStyle();

    timelineRange.value=0;

    if(Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        timeDisplay.textContent=
            `00:00 / ${formatTime(videoPlayer.duration)}`;

    }else{

        timeDisplay.textContent=
            '00:00 / 00:00';
    }
}

/* =========================================================
   CACHE TRANSFER - HOST
   ========================================================= */

async function startCacheTransfer(file){

    if(!isHost)
        return;

    if(videoModeSelect.value!==CACHE_MODE)
        return;

    if(!conn||!conn.open){

        connectionStatus.textContent=
            'Статус: Другий телефон ще не підключений.';

        return;
    }

    if(cacheHostSending)
        return;

    cacheHostSending=true;

    const token=
        ++cacheHostSendToken;

    const transferId=
        Date.now().toString(36)+
        '-' +
        Math.random().toString(36).slice(2,8);

    cacheTransferId=transferId;

    connectionStatus.textContent=
        'Статус: Підготовка передачі через Wi-Fi...';

    /*
      Спочатку повідомляємо S10,
      що старий кеш треба видалити.
    */
    sendMessage({

        type:'cache_transfer_start',

        id:transferId,

        name:file.name,

        size:file.size,

        mime:file.type||'video/mp4',

        chunkSize:CACHE_CHUNK_SIZE
    });

    /*
      Даємо DataConnection короткий час
      підготуватися.
    */
    await new Promise(resolve=>
        setTimeout(resolve,250)
    );

    if(token!==cacheHostSendToken||
       !cacheHostSending||
       !conn||
       !conn.open){

        cacheHostSending=false;
        return;
    }

    let offset=0;
    let chunkNumber=0;

    const started=
        performance.now();

    while(
        offset<file.size&&
        token===cacheHostSendToken&&
        cacheHostSending&&
        conn&&
        conn.open
    ){

        const end=
            Math.min(
                file.size,
                offset+CACHE_CHUNK_SIZE
            );

        const blob=
            file.slice(
                offset,
                end
            );

        const buffer=
            await blob.arrayBuffer();

        if(token!==cacheHostSendToken||
           !cacheHostSending||
           !conn||
           !conn.open){

            break;
        }

        /*
          Відправляємо об'єкт.
          PeerJS передає ArrayBuffer
          через DataChannel.
        */
        try{

            conn.send({

                type:'cache_chunk',

                id:transferId,

                n:chunkNumber,

                data:buffer

            });

        }catch(e){

            console.error(
                'Cache chunk send error:',
                e
            );

            break;
        }

        offset=end;
        chunkNumber++;

        const percent=
            file.size>0
            ?offset/file.size*100
            :100;

        const elapsed=
            (performance.now()-started)/1000;

        const speed=
            elapsed>0
            ?offset/elapsed/1024/1024
            :0;

        connectionStatus.textContent=
            `Статус: Передача відео ${percent.toFixed(1)}% • ${speed.toFixed(1)} МБ/с`;

        /*
          Невелика пауза дає DataChannel
          можливість спорожнювати буфер.
        */
        if(chunkNumber%8===0)
            await new Promise(resolve=>
                setTimeout(resolve,0)
            );
    }

    if(
        token===cacheHostSendToken&&
        cacheHostSending&&
        conn&&
        conn.open&&
        offset>=file.size
    ){

        sendMessage({

            type:'cache_transfer_end',

            id:transferId,

            name:file.name,

            size:file.size,

            mime:file.type||'video/mp4',

            chunks:chunkNumber
        });

        connectionStatus.textContent=
            'Статус: Файл передано. Очікування підтвердження S10...';

    }

    cacheHostSending=false;
}

/* =========================================================
   CACHE TRANSFER - CLIENT
   ========================================================= */

async function cacheReceiveStart(msg){

    cacheReceiveId=
        String(msg.id||'');

    cacheReceiveName=
        msg.name||'video';

    cacheReceiveSize=
        Number(msg.size)||0;

    cacheReceiveType=
        msg.mime||'video/mp4';

    cacheReceiveReceived=0;

    cacheReceiveChunks=[];

    cacheReceiveChunkCount=
        Number(msg.chunks)||0;

    cacheReceiveStartedAt=
        performance.now();

    cacheTransferActive=true;

    /*
      Видаляємо попередній кеш.
    */
    await deleteCacheBlob();

    if(cacheLocalVideoUrl){

        try{
            URL.revokeObjectURL(cacheLocalVideoUrl);
        }catch(e){}

        cacheLocalVideoUrl=null;
    }

    /*
      Старе відео прибираємо з player.
    */
    try{
        videoPlayer.pause();
    }catch(e){}

    try{
        videoPlayer.removeAttribute('src');
        videoPlayer.srcObject=null;
        videoPlayer.load();
    }catch(e){}

    remoteVideoDuration=0;
    remoteVideoTime=0;

    timelineRange.value=0;

    timeDisplay.textContent=
        '00:00 / 00:00';

    connectionStatus.textContent=
        'Статус: Отримання відео через Wi-Fi 0%...';
}

async function cacheReceiveChunk(msg){

    if(!cacheTransferActive)
        return;

    if(String(msg.id)!==cacheReceiveId)
        return;

    if(!msg.data)
        return;

    try{

        let buffer=msg.data;

        /*
          Деякі реалізації PeerJS
          можуть повернути Uint8Array.
        */
        if(buffer instanceof Uint8Array)
            buffer=buffer.buffer;

        cacheReceiveChunks[
            Number(msg.n)||0
        ]=buffer;

        const length=
            buffer.byteLength||0;

        cacheReceiveReceived+=length;

        const percent=
            cacheReceiveSize>0
            ?cacheReceiveReceived/cacheReceiveSize*100
            :0;

        const elapsed=
            (performance.now()-cacheReceiveStartedAt)/1000;

        const speed=
            elapsed>0
            ?cacheReceiveReceived/elapsed/1024/1024
            :0;

        connectionStatus.textContent=
            `Статус: Завантаження ${percent.toFixed(1)}% • ${speed.toFixed(1)} МБ/с`;

    }catch(e){

        console.error(
            'Cache receive chunk error:',
            e
        );
    }
}

async function cacheReceiveEnd(msg){

    if(!cacheTransferActive)
        return;

    if(String(msg.id)!==cacheReceiveId)
        return;

    connectionStatus.textContent=
        'Статус: Збираю відеофайл на S10...';

    try{

        const validChunks=
            cacheReceiveChunks.filter(
                item=>item
            );

        if(
            cacheReceiveSize>0&&
            cacheReceiveReceived<cacheReceiveSize
        ){

            connectionStatus.textContent=
                'Статус: Помилка передачі — файл отримано не повністю.';

            cacheTransferActive=false;

            return;
        }

        const blob=
            new Blob(
                validChunks,
                {
                    type:
                        cacheReceiveType||
                        'video/mp4'
                }
            );

        /*
          Зберігаємо тільки один
          поточний файл.
        */
        const saved=
            await saveCacheBlob(
                blob,
                {
                    name:cacheReceiveName,
                    type:cacheReceiveType
                }
            );

        if(!saved){

            connectionStatus.textContent=
                'Статус: Не вдалося записати відео в кеш S10.';

            cacheTransferActive=false;

            return;
        }

        await setCachedVideoBlob(
            blob,
            {
                name:cacheReceiveName,
                type:cacheReceiveType
            }
        );

        cacheRemoteReady=true;
        cacheRemoteFileName=
            cacheReceiveName;

        cacheTransferActive=false;

        sendMessage({

            type:'cache_ready',

            id:cacheReceiveId,

            name:cacheReceiveName,

            duration:
                Number.isFinite(videoPlayer.duration)
                ?videoPlayer.duration
                :0,

            size:blob.size
        });

        connectionStatus.textContent=
            'Статус: Відео готове на S10.';

        playPauseBtn.textContent=
            '▶ Грати';

        startAntiSleepAudio();
        requestWakeLock();

    }catch(e){

        console.error(
            'Cache assemble error:',
            e
        );

        cacheTransferActive=false;

        connectionStatus.textContent=
            'Статус: Помилка складання відеофайлу.';
    }

    cacheReceiveChunks=[];
}

/* =========================================================
   CHANGE VIDEO HOST
========================================================= */

newVideoInput.addEventListener('change',async e=>{

    const file=e.target.files[0];

    if(!file||!isHost)
        return;

    if(videoChangeInProgress)
        return;

    /*
      НОВИЙ CACHE РЕЖИМ
    */
    if(videoModeSelect.value===CACHE_MODE){

        videoChangeInProgress=true;

        videoVersion++;

        const currentVersion=
            videoVersion;

        cacheHostSendToken++;

        cacheHostSending=false;

        connectionStatus.textContent=
            'Статус: Підготовка нового відео...';

        if(conn&&conn.open){

            sendMessage({

                type:'cache_transfer_start',

                id:
                    Date.now().toString(36)+
                    '-' +
                    Math.random().toString(36).slice(2,8),

                name:file.name,

                size:file.size,

                mime:file.type||'video/mp4',

                chunkSize:CACHE_CHUNK_SIZE
            });

            /*
              Справжню передачу запускаємо
              окремою функцією, яка повторно
              сформує transfer ID.
            */

            await new Promise(resolve=>
                setTimeout(resolve,100)
            );

            /*
              Відправляємо через нормальний
              механізм transfer.
            */
            await startCacheTransfer(file);
        }

        if(currentVersion===videoVersion){

            if(localVideoBlobUrl){

                try{
                    URL.revokeObjectURL(
                        localVideoBlobUrl
                    );
                }catch(err){}
            }

            localVideoBlobUrl=
                URL.createObjectURL(file);

            videoPlayer.pause();
            videoPlayer.srcObject=null;
            videoPlayer.src=
                localVideoBlobUrl;

            videoPlayer.load();

            await new Promise(resolve=>{

                if(videoPlayer.readyState>=1){

                    resolve();

                }else{

                    videoPlayer.addEventListener(
                        'loadedmetadata',
                        resolve,
                        {once:true}
                    );

                    setTimeout(
                        resolve,
                        4000
                    );
                }
            });

            updateVideoStyle();

            videoPlayer.currentTime=0;

            playPauseBtn.textContent=
                '▶ Грати';

            sendMessage({

                type:'cache_host_ready',

                duration:
                    Number.isFinite(videoPlayer.duration)
                    ?videoPlayer.duration
                    :0
            });

            connectionStatus.textContent=
                'Статус: Нове відео готове на S25+. Очікуємо S10...';
        }

        videoChangeInProgress=false;

        return;
    }

    if(videoModeSelect.value!=='stream'){

        if(localVideoBlobUrl){

            try{
                URL.revokeObjectURL(localVideoBlobUrl);
            }catch(err){}
        }

        localVideoBlobUrl=
            URL.createObjectURL(file);

        videoPlayer.pause();

        videoPlayer.srcObject=null;

        videoPlayer.src=
            localVideoBlobUrl;

        videoPlayer.load();

        videoPlayer.currentTime=0;

        playPauseBtn.textContent=
            '▶ Грати';

        updateVideoStyle();

        sendSyncState();

        return;
    }

    videoChangeInProgress=true;

    videoVersion++;

    const currentVersion=
        videoVersion;

    connectionStatus.textContent=
        'Статус: Зміна відео...';

    sendMessage({
        type:'video_change_start',
        version:currentVersion
    });

    if(activeCall){

        const oldCall=
            activeCall;

        activeCall=null;

        try{
            oldCall.close();
        }catch(err){}
    }

    try{
        videoPlayer.pause();
    }catch(err){}

    try{
        videoPlayer.srcObject=null;
    }catch(err){}

    if(localVideoBlobUrl){

        try{
            URL.revokeObjectURL(localVideoBlobUrl);
        }catch(err){}
    }

    localVideoBlobUrl=
        URL.createObjectURL(file);

    videoPlayer.removeAttribute('src');

    videoPlayer.load();

    videoPlayer.src=
        localVideoBlobUrl;

    videoPlayer.load();

    timelineRange.value=0;

    timeDisplay.textContent=
        '00:00 / 00:00';

    await new Promise(resolve=>{

        let finished=false;

        const done=()=>{

            if(finished)
                return;

            finished=true;

            videoPlayer.removeEventListener(
                'loadedmetadata',
                done
            );

            resolve();
        };

        if(videoPlayer.readyState>=1){

            done();

        }else{

            videoPlayer.addEventListener(
                'loadedmetadata',
                done
            );
        }

        setTimeout(done,3000);
    });

    if(currentVersion!==videoVersion){

        videoChangeInProgress=false;

        return;
    }

    try{
        videoPlayer.currentTime=0;
    }catch(err){}

    videoPlayer.playbackRate=1;

    updateVideoStyle();

    sendMessage({
        type:'video_change_ready',
        version:currentVersion,
        duration:
            Number.isFinite(videoPlayer.duration)
            ?videoPlayer.duration
            :0
    });

    await new Promise(resolve=>
        setTimeout(resolve,800)
    );

    if(currentVersion!==videoVersion){

        videoChangeInProgress=false;

        return;
    }

    startStreaming();

    await new Promise(resolve=>
        setTimeout(resolve,700)
    );

    if(currentVersion!==videoVersion){

        videoChangeInProgress=false;

        return;
    }

    videoPlayer.play().catch(()=>{});

    playPauseBtn.textContent=
        '❚❚ Пауза';

    sendStreamState();

    startAntiSleepAudio();
    requestWakeLock();

    videoChangeInProgress=false;

    connectionStatus.textContent=
        'Статус: Нове відео запущено.';
});

function startHostPeer(){

    if(peer){

        try{
            peer.destroy();
        }catch(e){}
    }

    const code=
        Math.floor(
            10000+Math.random()*90000
        ).toString();

    connectionStatus.textContent=
        'Статус: Створення кімнати...';

    peer=
        new Peer(
            'sp-'+code,
            peerOptions
        );

    peer.on('open',()=>{

        hostCodeDisplay.textContent=
            code;

        codeContainer.classList.remove(
            'hidden'
        );

        connectionStatus.textContent=
            'Статус: Кімнату створено! Очікування другого телефону...';

        if(localVideoBlobUrl)
            updateVideoStyle();
    });

    peer.on('connection',connection=>{

        conn=connection;

        setupConnection();
    });

    peer.on('call',call=>{

        try{
            call.close();
        }catch(e){}
    });

    peer.on('error',err=>{

        console.error(
            'PeerJS Host error:',
            err
        );

        if(err&&err.type==='unavailable-id'){

            connectionStatus.textContent=
                'Статус: Код зайнятий, створіть кімнату ще раз.';

        }else{

            connectionStatus.textContent=
                'Статус: Помилка створення кімнати.';
        }
    });
}

/* =========================
   CLIENT
========================= */

connectClientBtn.addEventListener('click',()=>{

    startAntiSleepAudio();

    const code=
        clientCodeInput.value.trim();

    if(code.length!==5){

        alert(
            'Введіть 5-значний код!'
        );

        return;
    }

    if(peer){

        try{
            peer.destroy();
        }catch(e){}
    }

    requestFullscreenNow();

    isHost=false;

    connectionStatus.textContent=
        'Статус: Підключення...';

    peer=
        new Peer(peerOptions);

    peer.on('open',()=>{

        conn=
            peer.connect(
                'sp-'+code
            );

        setupConnection();
    });

    peer.on('call',call=>{

        if(activeCall&&
           activeCall!==call){

            try{
                activeCall.close();
            }catch(e){}
        }

        activeCall=call;

        call.answer();

        call.on('stream',remoteStream=>{

            /*
              У cache режимі P2P video stream
              НЕ використовується.
            */
            if(videoModeSelect.value===CACHE_MODE){

                try{
                    call.close();
                }catch(e){}

                if(activeCall===call)
                    activeCall=null;

                return;
            }

            try{
                videoPlayer.pause();
            }catch(e){}

            try{
                videoPlayer.srcObject=null;
            }catch(e){}

            try{
                videoPlayer.removeAttribute('src');
            }catch(e){}

            videoPlayer.srcObject=
                remoteStream;

            videoPlayer.muted=false;
            videoPlayer.volume=1;

            videoPlayer.play().catch(()=>{});

            startAntiSleepAudio();
            requestWakeLock();

            connectionStatus.textContent=
                'Статус: Відео отримано з головного телефону.';

            hostSyncTime=0;
            hostSyncReceivedAt=0;
            hostSyncPaused=true;
        });

        call.on('close',()=>{

            if(activeCall===call)
                activeCall=null;
        });

        call.on('error',()=>{

            if(activeCall===call)
                activeCall=null;
        });
    });

    peer.on('error',err=>{

        console.error(
            'PeerJS Client error:',
            err
        );

        connectionStatus.textContent=
            'Статус: Не вдалося підключитися до кімнати.';

        alert(
            'Не вдалося підключитися до кімнати. Перевірте 5-значний код.'
        );
    });
});

/* =========================
   SEND MESSAGE
========================= */

function sendMessage(message){

    if(!conn||!conn.open)
        return false;

    try{

        conn.send(
            typeof message==='string'
            ?message
            :message
        );

        return true;

    }catch(e){

        return false;
    }
}

/* =========================
   STREAMING
========================= */

function startStreaming(){

    if(!isHost)
        return;

    if(videoModeSelect.value!=='stream')
        return;

    if(!conn||!conn.open)
        return;

    if(!localVideoBlobUrl)
        return;

    if(activeCall){

        try{
            activeCall.close();
        }catch(e){}

        activeCall=null;
    }

    try{

        const stream=
            videoPlayer.captureStream
            ?videoPlayer.captureStream()
            :(videoPlayer.mozCaptureStream
              ?videoPlayer.mozCaptureStream()
              :null);

        if(!stream)
            return;

        const newCall=
            peer.call(
                conn.peer,
                stream
            );

        if(!newCall)
            return;

        activeCall=
            newCall;

        newCall.on('close',()=>{

            if(activeCall===newCall)
                activeCall=null;
        });

        newCall.on('error',()=>{

            if(activeCall===newCall)
                activeCall=null;
        });

    }catch(e){

        console.error(
            'Streaming error:',
            e
        );
    }
}

            generation:
                cacheSyncGeneration
        });

        return;
    }

    sendMessage({

        type:'seek',

        time:time,

        paused:
            videoPlayer.paused,

        generation:
            remoteSyncGeneration
    });
}
