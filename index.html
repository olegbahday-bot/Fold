<!DOCTYPE html>
<html lang="uk">
<head>

<title>ScreenParty Sync Pro</title>

<style>
body {
margin: 0;
background: #121212;
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 10px;
box-sizing: border-box;
overflow: hidden;
}

.card {
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
width: 100%;
max-width: 400px;
box-shadow: 0 8px 24px rgba(0,0,0,0.6);
text-align: center;
z-index: 10;
}

h2 {
margin-top: 0;
font-size: 20px;
color: #4CAF50;
}

label {
display: block;
margin-top: 10px;
font-size: 13px;
color: #bbb;
text-align: left;
}

select,
input,
button {
width: 100%;
padding: 10px;
margin-top: 5px;
background: #2a2a2a;
color: #fff;
border: 1px solid #444;
border-radius: 8px;
font-size: 14px;
box-sizing: border-box;
}

input[type="text"] {
letter-spacing: 4px;
text-align: center;
font-weight: bold;
font-size: 16px;
}

button {
background: #4CAF50;

font-weight: bold;
cursor: pointer;
margin-top: 10px;

button:hover {
background: #45a049;
}

.hidden {
display: none !important;
}

.code-display {
background: #fff;
color: #000;
font-size: 28px;
font-weight: bold;

padding: 10px;

margin-top: 8px;

/* Екран калібрування */
#calibrationScreen {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: rgba(0,0,0,0.85);
display: none;
z-index: 150;
}

.calib-box {
position: absolute;
top: 0;
left: 0;
border: 2px dashed #4CAF50;
box-sizing: border-box;
display: flex;
justify-content: center;
align-items: center;
background: rgba(76, 175, 80, 0.08);
will-change: transform;
}

.calib-circle {
width: 140px;
height: 140px;
border: 3px solid #FFEB3B;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
color: #FFEB3B;
font-size: 12px;
font-weight: bold;
text-align: center;
background: rgba(255, 235, 59, 0.15);
}

/* Екран відеоплеєра */

position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: #000;
display: none;
z-index: 100;
}

video.vid-el {
position: absolute;
top: 0;
left: 0;
object-fit: fill;
will-change: transform;
}

#volumeIndicator {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: rgba(0, 0, 0, 0.85);

border-radius: 10px;
font-size: 18px;

z-index: 300;
display: none;
pointer-events: none;
}

/* Панель керування */
.controls {
position: absolute;
bottom: 8px;
left: 50%;
transform: translateX(-50%);
background: rgba(0, 0, 0, 0.94);
padding: 8px;
border-radius: 12px;
display: flex;
flex-direction: column;
gap: 4px;
z-index: 200;
width: 96%;
max-width: 360px;

overflow-y: auto;

box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

.timeline-container {
display: flex;
align-items: center;
gap: 8px;
width: 100%;
margin-bottom: 4px;
padding: 0 2px;
box-sizing: border-box;
}

.timeline-slider {
flex: 1;
-webkit-appearance: none;
appearance: none;
background: #444;
height: 4px;
border-radius: 2px;
outline: none;
margin: 0;
padding: 0;
}

.timeline-slider::-webkit-slider-runnable-track {
height: 4px;
background: #444;
border-radius: 2px;
border: none;
}

.timeline-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
margin-top: -6px;
}

.time-display {
font-size: 11px;
color: #bbb;
white-space: nowrap;

}

.controls-grid {

grid-template-columns: repeat(3, 1fr);

.controls button {

padding: 7px 2px;
border-radius: 6px;
font-size: 11px;
background-color: #4CAF50;

.btn-full {

.reset-btn {

.fullscreen-btn {

}

.calib-open-btn {
background-color: #9C27B0;

.status {
font-size: 12px;
margin-top: 10px;

</style>

<script>

const setupCard =
document.getElementById('setupCard');

const playerScreen =
document.getElementById('playerScreen');

const calibrationScreen =
document.getElementById('calibrationScreen');

const calibBox =
document.getElementById('calibBox');

const videoPlayer =
document.getElementById('videoPlayer');

const playerControls =
document.getElementById('playerControls');

const newVideoInput =
document.getElementById('newVideoInput');

const timelineContainer =
document.getElementById('timelineContainer');

const roleSelect =
document.getElementById('roleSelect');

const positionSelect =
document.getElementById('positionSelect');

const videoModeSelect =
document.getElementById('videoModeSelect');

const fileInputContainer =
document.getElementById('fileInputContainer');

const videoInput =
document.getElementById('videoInput');

const hostSection =
document.getElementById('hostSection');

const clientSection =
document.getElementById('clientSection');

const connectionStatus =
document.getElementById('connectionStatus');

const openCalibOverlayBtn =
document.getElementById('openCalibOverlayBtn');

const closeCalibBtn =
document.getElementById('closeCalibBtn');

const startHostBtn =
document.getElementById('startHostBtn');

const codeContainer =
document.getElementById('codeContainer');

const hostCodeDisplay =
document.getElementById('hostCodeDisplay');

const clientCodeInput =
document.getElementById('clientCodeInput');

const connectClientBtn =
document.getElementById('connectClientBtn');

const playPauseBtn =
document.getElementById('playPauseBtn');

const restartBtn =
document.getElementById('restartBtn');

const fullscreenBtn =
document.getElementById('fullscreenBtn');

const timelineRange =
document.getElementById('timelineRange');

const timeDisplay =
document.getElementById('timeDisplay');

const volumeIndicator =
document.getElementById('volumeIndicator');

const changeVideoBtn =
document.getElementById('changeVideoBtn');


let peer = null;
let conn = null;
let activeCall = null;

let isHost = false;

let localVideoBlobUrl = null;

let audioCtx = null;
let silentOscillator = null;

let wakeLock = null;
let wakeLockRetryTimer = null;
let wakeLockMonitorTimer = null;

let syncInterval = null;

let partnerWidth = 0;
let partnerHeight = 0;

let isDraggingTimeline = false;

let isSwipingVolume = false;

let touchStartY = 0;
let touchStartX = 0;

let touchStartVolume = 1.0;

let hasSwiped = false;

let volumeTimeout = null;

let firstClientSync = false;

let lastHostTime = 0;

let lastHostSyncReceived = 0;


const peerOptions = {

debug: 1,

config: {

'iceServers': [

{
urls: 'stun:stun.l.google.com:19302'
},

{
urls: 'stun:stun1.l.google.com:19302'
}

]

}

};


/* =========================================================
   WAKE LOCK
   ========================================================= */

async function requestWakeLock() {

try {

if (!('wakeLock' in navigator))
return;

if (document.visibilityState !== 'visible')
return;

if (
wakeLock &&
!wakeLock.released
) {
return;
}

wakeLock =
await navigator.wakeLock.request('screen');

wakeLock.addEventListener(
'release',
() => {

wakeLock = null;

scheduleWakeLockRetry();

}
);

} catch (e) {

scheduleWakeLockRetry();

}

}


function scheduleWakeLockRetry() {

if (wakeLockRetryTimer)
clearTimeout(wakeLockRetryTimer);

wakeLockRetryTimer =
setTimeout(
() => {

requestWakeLock();

},
1200
);

}


function startWakeLockMonitor() {

if (wakeLockMonitorTimer)
clearInterval(wakeLockMonitorTimer);

wakeLockMonitorTimer =
setInterval(
() => {

if (
document.visibilityState === 'visible'
) {

if (
!wakeLock ||
wakeLock.released
) {

requestWakeLock();

}

}

},
3000
);

requestWakeLock();

}


document.addEventListener(
'visibilitychange',
() => {

if (
document.visibilityState === 'visible'
) {

requestWakeLock();

}

}
);


window.addEventListener(
'focus',
() => {

requestWakeLock();

}
);


window.addEventListener(
'pageshow',
() => {

requestWakeLock();

}
);


/* =========================================================
   ANTI-SLEEP AUDIO
   ========================================================= */

function startAntiSleepAudio() {

try {

if (!audioCtx) {

audioCtx =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if (
audioCtx.state === 'suspended'
) {

audioCtx.resume();

}

if (!silentOscillator) {

silentOscillator =
audioCtx.createGain();

silentOscillator.gain.value =
0.00001;

const osc =
audioCtx.createOscillator();

osc.frequency.value = 20;

osc.connect(
silentOscillator
);

silentOscillator.connect(
audioCtx.destination
);

osc.start();

}

} catch (e) {}

requestWakeLock();

}


/* =========================================================
   КАЛІБРУВАННЯ
   ========================================================= */

let videoOffsetX = 0;

let videoOffsetY = 0;

let videoScaleMultiplier = 1.0;


function loadSavedSettings() {

const savedScale =
localStorage.getItem('sp_scale');

const savedX =
localStorage.getItem('sp_offsetX');

const savedY =
localStorage.getItem('sp_offsetY');

const savedPos =
localStorage.getItem('sp_position');


if (savedScale !== null)
videoScaleMultiplier =
Math.max(
0.1,
Math.min(
5.0,
parseFloat(savedScale)
)
);


if (savedX !== null)
videoOffsetX =
Math.max(
-3000,
Math.min(
3000,
parseFloat(savedX)
)
);


if (savedY !== null)
videoOffsetY =
Math.max(
-3000,
Math.min(
3000,
parseFloat(savedY)
)
);


if (
savedPos === 'left' ||
savedPos === 'right'
) {

positionSelect.value =
savedPos;

}

}


loadSavedSettings();


function saveSettings() {

localStorage.setItem(
'sp_scale',
videoScaleMultiplier
);

localStorage.setItem(
'sp_offsetX',
videoOffsetX
);

localStorage.setItem(
'sp_offsetY',
videoOffsetY
);

localStorage.setItem(
'sp_position',
positionSelect.value
);


const saveBtn =
document.getElementById(
'playerSaveBtn'
);

if (saveBtn) {

const originalText =
saveBtn.textContent;

saveBtn.textContent =
'✔ Збережено!';

setTimeout(
() => {

saveBtn.textContent =
originalText;

},
1200
);

}

}


/* =========================================================
   НАЛАШТУВАННЯ
   ========================================================= */

function updateInputsVisibility() {

const role =
roleSelect.value;

const mode =
videoModeSelect.value;


if (role === 'host') {

hostSection.classList.remove(
'hidden'
);

clientSection.classList.add(
'hidden'
);

fileInputContainer.style.display =
'block';

changeVideoBtn.style.display =
'block';

} else {

hostSection.classList.add(
'hidden'
);

clientSection.classList.remove(
'hidden'
);

fileInputContainer.style.display =
(mode === 'stream')
? 'none'
: 'block';

changeVideoBtn.style.display =
'none';

}

}


roleSelect.addEventListener(
'change',
updateInputsVisibility
);


videoModeSelect.addEventListener(
'change',
updateInputsVisibility
);


updateInputsVisibility();


/* =========================================================
   FULLSCREEN
   ========================================================= */

function requestFullscreenNow() {

const elem =
document.documentElement;

if (!document.fullscreenElement) {

if (elem.requestFullscreen) {

elem.requestFullscreen()
.catch(
() => {}
);

}

}

}


/* =========================================================
   CALIBRATION SCREEN
   ========================================================= */

openCalibOverlayBtn.addEventListener(
'click',
() => {

calibrationScreen.style.display =
'block';

updateCalibrationStyle();

}
);


closeCalibBtn.addEventListener(
'click',
() => {

saveSettings();

calibrationScreen.style.display =
'none';

updateVideoStyle();

openCalibOverlayBtn.style.display =
'none';

}
);


function updateCalibrationStyle() {

const myWidth =
window.innerWidth;

const pWidth =
partnerWidth > 0
? partnerWidth
: myWidth;

const position =
positionSelect.value;

const combinedWidth =
myWidth + pWidth;

const finalWidth =
combinedWidth *
videoScaleMultiplier;

const videoAspect =
(videoPlayer.videoWidth &&
videoPlayer.videoHeight)
?
(
videoPlayer.videoWidth /
videoPlayer.videoHeight
)
:
(16 / 9);

const finalHeight =
finalWidth /
videoAspect;

let leftPos =
(position === 'left')
?
videoOffsetX
:
(videoOffsetX - pWidth);


calibBox.style.width =
finalWidth + 'px';

calibBox.style.height =
finalHeight + 'px';

calibBox.style.transform =
`translate3d(${leftPos}px, ${videoOffsetY}px, 0)`;

}


/* =========================================================
   ВИБІР ВІДЕО
   ========================================================= */

videoInput.addEventListener(
'change',
(e) => {

const file =
e.target.files[0];

if (file) {

if (localVideoBlobUrl)
URL.revokeObjectURL(
localVideoBlobUrl
);

localVideoBlobUrl =
URL.createObjectURL(file);

videoPlayer.src =
localVideoBlobUrl;

videoPlayer.srcObject =
null;

videoPlayer.muted =
false;

videoPlayer.volume =
1.0;

videoPlayer.pause();

connectionStatus.textContent =
'Статус: Відео завантажено. Готово.';

}

}
);


changeVideoBtn.addEventListener(
'click',
() => {

if (isHost)
newVideoInput.click();

}
);


newVideoInput.addEventListener(
'change',
(e) => {

const file =
e.target.files[0];

if (
file &&
isHost
) {

if (localVideoBlobUrl)
URL.revokeObjectURL(
localVideoBlobUrl
);

localVideoBlobUrl =
URL.createObjectURL(file);

videoPlayer.src =
localVideoBlobUrl;

videoPlayer.srcObject =
null;

videoPlayer.load();

updateVideoStyle();

videoPlayer.currentTime =
0;

videoPlayer.muted =
false;

videoPlayer.volume =
1.0;

videoPlayer.pause();


if (
videoModeSelect.value ===
'stream'
) {

setTimeout(
startStreaming,
500
);

}

}

}
);


/* =========================================================
   HOST
   ========================================================= */

startHostBtn.addEventListener(
'click',
() => {

startAntiSleepAudio();

if (!localVideoBlobUrl) {

alert(
'Виберіть відеофайл!'
);

return;

}

requestWakeLock();

requestFullscreenNow();

isHost = true;

startHostPeer();

}
);


function startHostPeer() {

if (peer) {

try {
peer.destroy();
} catch (e) {}

}


const code =
Math.floor(
10000 +
Math.random() *
90000
).toString();


connectionStatus.textContent =
'Статус: Створення кімнати...';


peer =
new Peer(
'sp-' + code,
peerOptions
);


peer.on(
'open',
() => {

hostCodeDisplay.textContent =
code;

codeContainer.classList.remove(
'hidden'
);

connectionStatus.textContent =
'Статус: Кімнату створено! Очікування другого телефону...';

}
);


peer.on(
'connection',
(connection) => {

conn =
connection;

setupConnection();

}
);


peer.on(
'call',
(call) => {

call.answer();

}
);


peer.on(
'error',
(err) => {

connectionStatus.textContent =
'Статус: Помилка підключення';

console.log(
'Peer error:',
err
);

}
);

}


/* =========================================================
   CLIENT
   ========================================================= */

connectClientBtn.addEventListener(
'click',
() => {

startAntiSleepAudio();

const mode =
videoModeSelect.value;


if (
mode === 'local' &&
!localVideoBlobUrl
) {

alert(
'Виберіть відеофайл!'
);

return;

}


const code =
clientCodeInput.value
.trim();


if (code.length !== 5) {

alert(
'Введіть 5-значний код!'
);

return;

}


if (peer) {

try {
peer.destroy();
} catch (e) {}

}


requestWakeLock();

requestFullscreenNow();

isHost = false;

firstClientSync = false;

connectionStatus.textContent =
'Статус: Підключення...';


peer =
new Peer(
peerOptions
);


peer.on(
'open',
() => {

conn =
peer.connect(
'sp-' + code,
{
reliable: true
}
);

setupConnection();

}
);


peer.on(
'call',
(call) => {

call.answer();

call.on(
'stream',
(remoteStream) => {

videoPlayer.srcObject =
remoteStream;

videoPlayer.muted =
false;

videoPlayer.volume =
1.0;

videoPlayer.play()
.catch(
() => {}
);

startWakeLockMonitor();

}
);

}
);

});


/* =========================================================
   SCREEN INFO
   ========================================================= */

function sendScreenInfo() {

if (
conn &&
conn.open
) {

conn.send(
JSON.stringify({

type: 'screen_info',

width:
window.innerWidth,

height:
window.innerHeight,

position:
positionSelect.value,

videoMode:
videoModeSelect.value

})
);

}

}


/* =========================================================
   STREAM
   ========================================================= */

function startStreaming() {

if (
!isHost ||
videoModeSelect.value !==
'stream'
) {

return;

}


try {

const stream =
videoPlayer.captureStream
?
videoPlayer.captureStream()
:
videoPlayer.mozCaptureStream();


if (
stream &&
conn &&
conn.open
) {

if (!activeCall) {

activeCall =
peer.call(
conn.peer,
stream
);

}

}

} catch (e) {}

}


/* =========================================================
   НАДСИЛАННЯ СТАНУ HOST
   ========================================================= */

function sendHostSync() {

if (
!isHost ||
!conn ||
!conn.open ||
videoModeSelect.value !==
'local'
) {

return;

}


try {

conn.send(
JSON.stringify({

type: 'sync_state',

time:
videoPlayer.currentTime,

playing:
!videoPlayer.paused &&
!videoPlayer.ended,

duration:
videoPlayer.duration,

sentAt:
Date.now()

})
);

} catch (e) {}

}


/* =========================================================
   CONNECTION
   ========================================================= */

function setupConnection() {

const handleReady = () => {

connectionStatus.textContent =
'Статус: Підключено!';


sendScreenInfo();


setTimeout(
() => {

setupCard.style.display =
'none';

playerScreen.style.display =
'block';

updateVideoStyle();


videoPlayer.muted =
false;

videoPlayer.volume =
1.0;


/*
 * Таймлайн тепер доступний
 * на обох телефонах у LOCAL.
 *
 * У STREAM він прихований,
 * бо MediaStream не має нормального seek.
 */

if (
videoModeSelect.value ===
'local'
) {

timelineContainer.style.display =
'flex';

} else {

timelineContainer.style.display =
'none';

}


if (isHost) {

videoPlayer.currentTime =
0;

videoPlayer.play()
.catch(
() => {}
);

playPauseBtn.textContent =
'❚❚ Пауза';


requestWakeLock();


if (
videoModeSelect.value ===
'stream'
) {

startStreaming();

}


/*
 * Частіша синхронізація.
 */

if (syncInterval)
clearInterval(syncInterval);

syncInterval =
setInterval(
() => {

if (
conn &&
conn.open &&
videoModeSelect.value ===
'local'
) {

sendHostSync();

}

},
250
);


/*
 * Перший стан одразу.
 */

setTimeout(
sendHostSync,
100
);


} else {

/*
 * CLIENT НЕ ЗАПУСКАЄ
 * відео самостійно.
 *
 * Він чекає першого
 * sync_state від S25+.
 */

firstClientSync =
false;

videoPlayer.pause();

videoPlayer.playbackRate =
1.0;

}


requestWakeLock();

startWakeLockMonitor();

},
300
);

};


if (conn.open) {

handleReady();

} else {

conn.on(
'open',
handleReady
);

}


/* =========================================================
   DATA
   ========================================================= */

conn.on(
'data',
(data) => {

try {

const msg =
typeof data === 'string'
?
JSON.parse(data)
:
data;


/* =========================================
   SCREEN INFO
   ========================================= */

if (
msg.type ===
'screen_info'
) {

partnerWidth =
msg.width;

partnerHeight =
msg.height;


if (
msg.videoMode &&
msg.videoMode !==
videoModeSelect.value
) {

videoModeSelect.value =
msg.videoMode;

updateInputsVisibility();

}


/*
 * Після отримання розмірів
 * від другого телефона
 * знову відправляємо свої.
 */

if (conn && conn.open) {

setTimeout(
sendScreenInfo,
50
);

}


updateVideoStyle();

return;

}


/* =========================================
   SYNC STATE — CLIENT
   ========================================= */

if (
msg.type ===
'sync_state' &&
!isHost &&
videoModeSelect.value ===
'local'
) {

if (
!Number.isFinite(
msg.time
)
) {

return;

}


const hostTime =
msg.time;

lastHostTime =
hostTime;

lastHostSyncReceived =
performance.now();


/*
 * ПЕРША СИНХРОНІЗАЦІЯ.
 *
 * S10 одразу ставимо
 * в ту саму позицію.
 */

if (!firstClientSync) {

firstClientSync =
true;

videoPlayer.currentTime =
hostTime;

videoPlayer.playbackRate =
1.0;


if (msg.playing) {

videoPlayer.play()
.catch(
() => {}
);

playPauseBtn.textContent =
'❚❚ Пауза';

} else {

videoPlayer.pause();

playPauseBtn.textContent =
'▶ Грати';

}

requestWakeLock();

return;

}


/*
 * Визначаємо різницю.
 *
 * > 0:
 * S10 випереджає S25+
 *
 * < 0:
 * S10 відстає.
 */

if (
!videoPlayer.paused &&
!isDraggingTimeline
) {

const diff =
videoPlayer.currentTime -
hostTime;


/*
 * Якщо розсинхрон
 * більше 250 мс —
 * точний стрибок.
 */

if (
Math.abs(diff) >
0.25
) {

videoPlayer.currentTime =
hostTime;

videoPlayer.playbackRate =
1.0;

}


/*
 * Малий розсинхрон
 * виправляємо плавно.
 */

else {

let rate =
1 -
(diff * 0.10);


/*
 * Не даємо швидкості
 * змінюватися занадто сильно.
 */

rate =
Math.max(
0.97,
Math.min(
1.03,
rate
)
);

videoPlayer.playbackRate =
rate;

}

}


/*
 * Стан PLAY/PAUSE
 * завжди визначає S25+.
 */

if (msg.playing) {

if (videoPlayer.paused) {

videoPlayer.play()
.catch(
() => {}
);

}

} else {

if (!videoPlayer.paused) {

videoPlayer.pause();

}

videoPlayer.playbackRate =
1.0;

}


requestWakeLock();

return;

}


/* =========================================
   SEEK — CLIENT
   ========================================= */

if (
msg.type ===
'seek'
) {

if (
!videoPlayer.srcObject &&
Number.isFinite(msg.time)
) {

videoPlayer.currentTime =
msg.time;

videoPlayer.playbackRate =
1.0;

}

return;

}


/* =========================================
   PLAY — CLIENT
   ========================================= */

if (
msg.type ===
'play'
) {

videoPlayer.playbackRate =
1.0;

videoPlayer.muted =
false;

videoPlayer.play()
.catch(
() => {}
);

playPauseBtn.textContent =
'❚❚ Пауза';

requestWakeLock();

return;

}


/* =========================================
   PAUSE — CLIENT
   ========================================= */

if (
msg.type ===
'pause'
) {

videoPlayer.playbackRate =
1.0;

videoPlayer.pause();

playPauseBtn.textContent =
'▶ Грати';

return;

}


/* =========================================
   RESTART — CLIENT
   ========================================= */

if (
msg.type ===
'restart'
) {

videoPlayer.playbackRate =
1.0;

videoPlayer.muted =
false;

videoPlayer.currentTime =
0;

videoPlayer.play()
.catch(
() => {}
);

playPauseBtn.textContent =
'❚❚ Пауза';

requestWakeLock();

return;

}


/* =========================================
   SEEK REQUEST — HOST
   ========================================= */

if (
msg.type ===
'seek_request' &&
isHost &&
videoModeSelect.value ===
'local'
) {

if (
Number.isFinite(msg.time) &&
Number.isFinite(videoPlayer.duration)
) {

videoPlayer.currentTime =
Math.max(
0,
Math.min(
msg.time,
videoPlayer.duration
)
);

videoPlayer.playbackRate =
1.0;


/*
 * Одразу повідомляємо S10
 * точний час.
 */

try {

conn.send(
JSON.stringify({

type: 'seek',

time:
videoPlayer.currentTime

})
);

} catch (e) {}


/*
 * І одразу ще раз
 * відправляємо повний стан.
 */

setTimeout(
sendHostSync,
20
);

}

return;

}


/* =========================================
   PLAY REQUEST — HOST
   ========================================= */

if (
msg.type ===
'play_request' &&
isHost
) {

videoPlayer.play()
.then(
() => {

sendHostSync();

}
)
.catch(
() => {}
);

requestWakeLock();

return;

}


/* =========================================
   PAUSE REQUEST — HOST
   ========================================= */

if (
msg.type ===
'pause_request' &&
isHost
) {

videoPlayer.pause();

sendHostSync();

return;

}


/* =========================================
   RESTART REQUEST — HOST
   ========================================= */

if (
msg.type ===
'restart_request' &&
isHost
) {

videoPlayer.currentTime =
0;

videoPlayer.play()
.then(
() => {

sendHostSync();

}
)
.catch(
() => {}
);

requestWakeLock();

return;

}


} catch (e) {

console.log(
'Data error:',
e
);

}

});


conn.on(
'close',
() => {

if (syncInterval)
clearInterval(
syncInterval
);

alert(
"З'єднання закрито"
);

location.reload();

});

}


/* =========================================================
   VISIBILITY
   ========================================================= */

document.addEventListener(
'visibilitychange',
() => {

if (
document.visibilityState ===
'visible'
) {

startAntiSleepAudio();

requestWakeLock();

if (
conn &&
conn.open &&
isHost &&
videoModeSelect.value ===
'stream'
) {

startStreaming();

}

}

}
);


/* =========================================================
   POSITION
   ========================================================= */

positionSelect.addEventListener(
'change',
() => {

sendScreenInfo();

updateVideoStyle();

saveSettings();

}
);


/* =========================================================
   VIDEO STYLE
   ========================================================= */

videoPlayer.addEventListener(
'loadedmetadata',
() => {

updateVideoStyle();

}
);


function updateVideoStyle() {

const myWidth =
window.innerWidth;

const pWidth =
partnerWidth > 0
?
partnerWidth
:
myWidth;

const position =
positionSelect.value;

const videoAspect =
(
videoPlayer.videoWidth &&
videoPlayer.videoHeight
)
?
(
videoPlayer.videoWidth /
videoPlayer.videoHeight
)
:
(16 / 9);

const combinedWidth =
myWidth + pWidth;

const finalWidth =
combinedWidth *
videoScaleMultiplier;

const finalHeight =
finalWidth /
videoAspect;

let leftPos =
(position === 'left')
?
videoOffsetX
:
(videoOffsetX - pWidth);


videoPlayer.style.width =
finalWidth + 'px';

videoPlayer.style.height =
finalHeight + 'px';

videoPlayer.style.transform =
`translate3d(${leftPos}px, ${videoOffsetY}px, 0)`;


if (
calibrationScreen.style.display ===
'block'
) {

updateCalibrationStyle();

}

}


window.addEventListener(
'resize',
updateVideoStyle
);


if (window.visualViewport) {

window.visualViewport.addEventListener(
'resize',
updateVideoStyle
);

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

playPauseBtn.addEventListener(
'click',
() => {

startAntiSleepAudio();

requestWakeLock();


if (videoPlayer.paused) {

videoPlayer.playbackRate =
1.0;

videoPlayer.muted =
false;


if (isHost) {

videoPlayer.play()
.then(
() => {

sendHostSync();

}
)
.catch(
() => {}
);

} else {

send(
'play_request'
);

}


playPauseBtn.textContent =
'❚❚ Пауза';


if (
isHost &&
videoModeSelect.value ===
'stream'
) {

startStreaming();

}


} else {

if (isHost) {

videoPlayer.pause();

sendHostSync();

} else {

send(
'pause_request'
);

}

playPauseBtn.textContent =
'▶ Грати';

}

});


/* =========================================================
   RESTART
   ========================================================= */

restartBtn.addEventListener(
'click',
() => {

startAntiSleepAudio();

requestWakeLock();


if (isHost) {

videoPlayer.playbackRate =
1.0;

videoPlayer.muted =
false;

videoPlayer.currentTime =
0;

videoPlayer.play()
.catch(
() => {}
);

sendHostSync();

} else {

send(
'restart_request'
);

}

playPauseBtn.textContent =
'❚❚ Пауза';


if (
isHost &&
videoModeSelect.value ===
'stream'
) {

startStreaming();

}

});


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
'click',
() => {

requestWakeLock();

const elem =
document.documentElement;


if (!document.fullscreenElement) {

if (elem.requestFullscreen) {

elem.requestFullscreen()
.catch(
() => {}
);

}

} else {

if (document.exitFullscreen) {

document.exitFullscreen();

}

}

});


/* =========================================================
   PLAYER CLICK
   ========================================================= */

playerScreen.addEventListener(
'click',
(e) => {

startAntiSleepAudio();

if (hasSwiped) {

hasSwiped =
false;

return;

}


if (
!playerControls.contains(
e.target
)
) {

playerControls.style.display =
playerControls.style.display ===
'none'
?
'flex'
:
'none';

}

});


/* =========================================================
   TIME
   ========================================================= */

function formatTime(seconds) {

if (isNaN(seconds))
return "00:00";

const mins =
Math.floor(
seconds / 60
);

const secs =
Math.floor(
seconds % 60
);

return (
mins < 10
? '0'
: ''
)
+
mins
+
':'
+
(
secs < 10
? '0'
: ''
)
+
secs;

}


/* =========================================================
   TIMELINE UPDATE
   ========================================================= */

videoPlayer.addEventListener(
'timeupdate',
() => {

if (
!isDraggingTimeline &&
videoPlayer.duration &&
!videoPlayer.srcObject
) {

const progress =
(
videoPlayer.currentTime /
videoPlayer.duration
) * 100;

timelineRange.value =
progress;

timeDisplay.textContent =
`${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;

}

}
);


/* =========================================================
   TIMELINE START
   ========================================================= */

timelineRange.addEventListener(
'mousedown',
() => {

isDraggingTimeline =
true;

}
);


timelineRange.addEventListener(
'touchstart',
() => {

isDraggingTimeline =
true;

},
{
passive: true
}
);


/* =========================================================
   TIMELINE INPUT
   ========================================================= */

timelineRange.addEventListener(
'input',
() => {

if (
!isNaN(
videoPlayer.duration
)
) {

const newTime =
(
timelineRange.value /
100
) *
videoPlayer.duration;

timeDisplay.textContent =
`${formatTime(newTime)} / ${formatTime(videoPlayer.duration)}`;

}

}
);


/* =========================================================
   TIMELINE CHANGE
   ========================================================= */

timelineRange.addEventListener(
'change',
() => {

isDraggingTimeline =
false;


if (
!isNaN(
videoPlayer.duration
)
) {

const newTime =
(
timelineRange.value /
100
) *
videoPlayer.duration;


/*
 * HOST:
 * встановлює час і
 * одразу повідомляє S10.
 */

if (isHost) {

videoPlayer.currentTime =
newTime;

videoPlayer.playbackRate =
1.0;

sendHostSync();


/*
 * CLIENT:
 * просить S25+ змінити час.
 */

} else {

send(
JSON.stringify({

type:
'seek_request',

time:
newTime

})
);

}

}

}
);


timelineRange.addEventListener(
'mouseup',
() => {

isDraggingTimeline =
false;

}
);


timelineRange.addEventListener(
'touchend',
() => {

isDraggingTimeline =
false;

}
);


/* =========================================================
   TOUCH / VOLUME
   ========================================================= */

playerScreen.addEventListener(
'touchstart',
(e) => {

startAntiSleepAudio();

if (
playerControls.contains(
e.target
)
)
return;


if (
e.touches.length === 1
) {

isSwipingVolume =
true;

touchStartY =
e.touches[0].clientY;

touchStartX =
e.touches[0].clientX;

touchStartVolume =
videoPlayer.volume;

hasSwiped =
false;

}

},
{
passive: true
}
);


playerScreen.addEventListener(
'touchmove',
(e) => {

if (
!isSwipingVolume ||
e.touches.length !== 1
)
return;


const diffY =
touchStartY -
e.touches[0].clientY;

const diffX =
touchStartX -
e.touches[0].clientX;


if (
Math.abs(diffY) > 10 ||
Math.abs(diffX) > 10
) {

hasSwiped =
true;

}


if (hasSwiped) {

const newVolume =
Math.max(
0,
Math.min(
1,
touchStartVolume +
(
diffY /
window.innerHeight
) *
1.5
)
);

videoPlayer.volume =
newVolume;

showVolumeIndicator(
Math.round(
newVolume * 100
)
);

}

},
{
passive: true
}
);


playerScreen.addEventListener(
'touchend',
() => {

isSwipingVolume =
false;

}
);


/* =========================================================
   VOLUME
   ========================================================= */

function showVolumeIndicator(
volPercent
) {

volumeIndicator.textContent =
`🔊 Гучність: ${volPercent}%`;

volumeIndicator.style.display =
'block';


if (volumeTimeout)
clearTimeout(
volumeTimeout
);


volumeTimeout =
setTimeout(
() => {

volumeIndicator.style.display =
'none';

},
1000
);

}


/* =========================================================
   SHIFT / SCALE
   ========================================================= */

function applyShift(dx, dy) {

videoOffsetX += dx;

videoOffsetY += dy;

updateVideoStyle();

updateCalibrationStyle();

saveSettings();

}


function applyScale(ds) {

videoScaleMultiplier =
Math.max(
0.1,
Math.min(
5.0,
videoScaleMultiplier + ds
)
);

updateVideoStyle();

updateCalibrationStyle();

saveSettings();

}


/* =========================================================
   CALIBRATION BUTTONS
   ========================================================= */

document.getElementById(
'playerSaveBtn'
).addEventListener(
'click',
saveSettings
);


document.getElementById(
'calibShiftUp'
).addEventListener(
'click',
() => applyShift(0, -4)
);


document.getElementById(
'calibShiftDown'
).addEventListener(
'click',
() => applyShift(0, 4)
);


document.getElementById(
'calibShiftLeft'
).addEventListener(
'click',
() => applyShift(-4, 0)
);


document.getElementById(
'calibShiftRight'
).addEventListener(
'click',
() => applyShift(4, 0)
);


document.getElementById(
'calibScalePlus'
).addEventListener(
'click',
() => applyScale(0.02)
);


document.getElementById(
'calibScaleMinus'
).addEventListener(
'click',
() => applyScale(-0.02)
);


document.getElementById(
'calibReset'
).addEventListener(
'click',
() => {

videoOffsetX = 0;

videoOffsetY = 0;

videoScaleMultiplier = 1.0;

updateVideoStyle();

updateCalibrationStyle();

saveSettings();

}
);


document.getElementById(
'shiftUpBtn'
).addEventListener(
'click',
() => applyShift(0, -4)
);


document.getElementById(
'shiftDownBtn'
).addEventListener(
'click',
() => applyShift(0, 4)
);


document.getElementById(
'shiftLeftBtn'
).addEventListener(
'click',
() => applyShift(-4, 0)
);


document.getElementById(
'shiftRightBtn'
).addEventListener(
'click',
() => applyShift(4, 0)
);


document.getElementById(
'scalePlusBtn'
).addEventListener(
'click',
() => applyScale(0.02)
);


document.getElementById(
'scaleMinusBtn'
).addEventListener(
'click',
() => applyScale(-0.02)
);


document.getElementById(
'resetShiftBtn'
).addEventListener(
'click',
() => {

videoOffsetX = 0;

videoOffsetY = 0;

videoScaleMultiplier = 1.0;

updateVideoStyle();

updateCalibrationStyle();

saveSettings();

}
);


/* =========================================================
   ПОЧАТКОВА АКТИВАЦІЯ
   ========================================================= */

document.addEventListener(
'click',
() => {

requestWakeLock();

},
{
passive: true
}
);


document.addEventListener(
'touchstart',
() => {

requestWakeLock();

},
{
passive: true
}
);


window.addEventListener(
'beforeunload',
() => {

if (syncInterval)
clearInterval(syncInterval);

if (wakeLock) {

try {

wakeLock.release();

} catch (e) {}

}

}
);

</script>
