<html lang="uk">
<head>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;box-sizing:border-box}

h2{margin-top:0;font-size:20px;color:#4CAF50}
label{display:block;margin-top:10px;font-size:13px;color:#bbb;text-align:left}

#calibrationScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.85);display:none;z-index:150}
.calib-box{position:absolute;top:0;left:0;border:2px dashed #4CAF50;box-sizing:border-box;display:flex;justify-content:center;align-items:center;background:rgba(76,175,80,.08);will-change:transform}

video.vid-el{position:absolute;top:0;left:0;object-fit:fill;will-change:transform}

<script>

const setupCard=document.getElementById('setupCard');
const playerScreen=document.getElementById('playerScreen');
const calibrationScreen=document.getElementById('calibrationScreen');
const calibBox=document.getElementById('calibBox');
const videoPlayer=document.getElementById('videoPlayer');
const keepAwakeVideo=document.getElementById('keepAwakeVideo');
const playerControls=document.getElementById('playerControls');
const newVideoInput=document.getElementById('newVideoInput');
const timelineContainer=document.getElementById('timelineContainer');
const timelineRange=document.getElementById('timelineRange');
const timeDisplay=document.getElementById('timeDisplay');
const roleSelect=document.getElementById('roleSelect');
const positionSelect=document.getElementById('positionSelect');
const videoModeSelect=document.getElementById('videoModeSelect');
const fileInputContainer=document.getElementById('fileInputContainer');
const videoInput=document.getElementById('videoInput');
const hostSection=document.getElementById('hostSection');
const clientSection=document.getElementById('clientSection');
const connectionStatus=document.getElementById('connectionStatus');
const openCalibOverlayBtn=document.getElementById('openCalibOverlayBtn');
const closeCalibBtn=document.getElementById('closeCalibBtn');
const startHostBtn=document.getElementById('startHostBtn');
const codeContainer=document.getElementById('codeContainer');
const hostCodeDisplay=document.getElementById('hostCodeDisplay');
const clientCodeInput=document.getElementById('clientCodeInput');
const connectClientBtn=document.getElementById('connectClientBtn');
const playPauseBtn=document.getElementById('playPauseBtn');
const restartBtn=document.getElementById('restartBtn');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const volumeIndicator=document.getElementById('volumeIndicator');
const changeVideoBtn=document.getElementById('changeVideoBtn');

let peer=null;
let conn=null;
let activeCall=null;
let isHost=false;

let localVideoBlobUrl=null;

/*
  ВАЖЛИВО:
  Це єдине джерело поточного файлу на S25+.
  Тепер при зміні відео старий file input
  більше ніколи не використовується випадково.
*/
let selectedHostFile=null;

let audioCtx=null;
let silentOscillator=null;

let wakeLock=null;
let wakeLockRetryTimer=null;

let videoOffsetX=0;
let videoOffsetY=0;
let videoScaleMultiplier=1;

let syncInterval=null;
let partnerWidth=0;
let partnerHeight=0;

let isDraggingTimeline=false;
let isSwipingVolume=false;
let touchStartY=0;
let touchStartX=0;
let touchStartVolume=1;
let hasSwiped=false;
let volumeTimeout=null;

let remoteVideoDuration=0;
let remoteVideoTime=0;
let remoteVideoPaused=true;

let hostSyncTime=0;
let hostSyncReceivedAt=0;
let hostSyncPaused=true;
let remoteSyncGeneration=0;
let lastRemoteSeekTime=-1;
let remoteSyncCorrectionTimer=null;

let videoChangeInProgress=false;
let videoVersion=0;


/* =========================================================
   ЛОКАЛЬНИЙ КЕШ
   ========================================================= */

const CACHE_MODE='cache';

const CACHE_DB_NAME='ScreenPartyVideoCache';
const CACHE_DB_VERSION=1;
const CACHE_STORE='video';

/*
  64 KB — залишаємо невеликий розмір,
  щоб стабільно працювати на S10/S25+
  через WebRTC DataChannel.
*/
const CACHE_CHUNK_SIZE=64*1024;

let cacheDB=null;

let cacheTransferId='';
let cacheTransferActive=false;

let cacheReceiveId='';
let cacheReceiveName='';
let cacheReceiveSize=0;
let cacheReceiveType='video/mp4';
let cacheReceiveReceived=0;
let cacheReceiveChunks=[];
let cacheReceiveChunkCount=0;
let cacheReceiveStartedAt=0;
let cacheReceiveReceivedMap=new Set();

let cacheHostSending=false;
let cacheHostSendToken=0;

let cacheRemoteReady=false;
let cacheRemoteDuration=0;
let cacheRemoteFileName='';

let cacheSyncTime=0;
let cacheSyncReceivedAt=0;
let cacheSyncPaused=true;
let cacheSyncGeneration=0;
let cacheLastHardSync=0;

let cacheLocalVideoUrl=null;


/* =========================================================
   PEER
   ========================================================= */

const peerOptions={
    debug:1,
    config:{
        iceServers:[
            {urls:'stun:stun.l.google.com:19302'},
            {urls:'stun:stun1.l.google.com:19302'}
        ]
    }
};


/* =========================================================
   WAKE LOCK
   ========================================================= */

async function requestWakeLock(){

    try{

        if(!('wakeLock' in navigator))
            return;

        if(document.visibilityState!=='visible')
            return;

        if(playerScreen.style.display==='none')
            return;

        if(wakeLock&&!wakeLock.released)
            return;

        wakeLock=await navigator.wakeLock.request('screen');

        wakeLock.addEventListener('release',()=>{

            wakeLock=null;

            if(wakeLockRetryTimer)
                clearTimeout(wakeLockRetryTimer);

            wakeLockRetryTimer=setTimeout(()=>{

                if(document.visibilityState==='visible'&&
                   playerScreen.style.display!=='none'&&
                   !videoPlayer.paused){

                    requestWakeLock();
                }

            },1000);
        });

    }catch(e){

        if(wakeLockRetryTimer)
            clearTimeout(wakeLockRetryTimer);

        wakeLockRetryTimer=setTimeout(()=>{

            if(document.visibilityState==='visible'&&
               playerScreen.style.display!=='none'&&
               !videoPlayer.paused){

                requestWakeLock();
            }

        },1500);
    }
}

function startAntiSleepAudio(){

    try{

        if(!audioCtx){
            audioCtx=
                new(window.AudioContext||window.webkitAudioContext)();
        }

        if(audioCtx.state==='suspended')
            audioCtx.resume().catch(()=>{});

        if(!silentOscillator){

            const gain=audioCtx.createGain();

            gain.gain.value=0.00001;

            const osc=audioCtx.createOscillator();

            osc.frequency.value=100;

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();

            silentOscillator={
                oscillator:osc,
                gain:gain
            };
        }

    }catch(e){}

    requestWakeLock();
}

function startKeepAwakeVideo(){
    requestWakeLock();
}

function stopKeepAwakeVideo(){}

document.addEventListener('visibilitychange',()=>{

    if(document.visibilityState==='visible'&&
       playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

window.addEventListener('focus',()=>{

    if(playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

window.addEventListener('pageshow',()=>{

    if(playerScreen.style.display!=='none'){

        startAntiSleepAudio();
        requestWakeLock();
    }
});

document.addEventListener('fullscreenchange',()=>{

    setTimeout(()=>{

        requestWakeLock();
        updateVideoStyle();

    },300);
});

setInterval(()=>{

    if(playerScreen.style.display!=='none'&&
       document.visibilityState==='visible'&&
       !videoPlayer.paused){

        requestWakeLock();
    }

},4000);


/* =========================================================
   SETTINGS
   ========================================================= */

function loadSavedSettings(){

    const savedScale=localStorage.getItem('sp_scale');
    const savedX=localStorage.getItem('sp_offsetX');
    const savedY=localStorage.getItem('sp_offsetY');
    const savedPos=localStorage.getItem('sp_position');

    if(savedScale!==null)
        videoScaleMultiplier=
            Math.max(.1,Math.min(5,parseFloat(savedScale)));

    if(savedX!==null)
        videoOffsetX=parseFloat(savedX);

    if(savedY!==null)
        videoOffsetY=parseFloat(savedY);

    if(savedPos==='left'||savedPos==='right')
        positionSelect.value=savedPos;
}

loadSavedSettings();

function saveSettings(){

    localStorage.setItem('sp_scale',videoScaleMultiplier);
    localStorage.setItem('sp_offsetX',videoOffsetX);
    localStorage.setItem('sp_offsetY',videoOffsetY);
    localStorage.setItem('sp_position',positionSelect.value);
}


/* =========================================================
   INPUT VISIBILITY
   ========================================================= */

function updateInputsVisibility(){

    const role=roleSelect.value;
    const mode=videoModeSelect.value;

    if(role==='host'){

        hostSection.classList.remove('hidden');
        clientSection.classList.add('hidden');

        fileInputContainer.style.display='block';
        changeVideoBtn.style.display='block';

    }else{

        hostSection.classList.add('hidden');
        clientSection.classList.remove('hidden');

        fileInputContainer.style.display=
            mode==='stream'||mode==='cache'
            ?'none'
            :'block';

        changeVideoBtn.style.display='none';
    }
}

roleSelect.addEventListener('change',updateInputsVisibility);
videoModeSelect.addEventListener('change',updateInputsVisibility);

updateInputsVisibility();


/* =========================================================
   FULLSCREEN
   ========================================================= */

function requestFullscreenNow(){

    if(!document.fullscreenElement&&
       document.documentElement.requestFullscreen){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});
    }
}


/* =========================================================
   CALIBRATION
   ========================================================= */

openCalibOverlayBtn.addEventListener('click',()=>{

    calibrationScreen.style.display='block';

    updateCalibrationStyle();
});

closeCalibBtn.addEventListener('click',()=>{

    saveSettings();

    calibrationScreen.style.display='none';

    updateVideoStyle();

    openCalibOverlayBtn.style.display='none';
});

function updateCalibrationStyle(){

    const myWidth=window.innerWidth;

    const pWidth=
        partnerWidth>0
        ?partnerWidth
        :myWidth;

    const combinedWidth=myWidth+pWidth;

    const finalWidth=
        combinedWidth*videoScaleMultiplier;

    const videoAspect=
        videoPlayer.videoWidth&&videoPlayer.videoHeight
        ?videoPlayer.videoWidth/videoPlayer.videoHeight
        :16/9;

    const finalHeight=
        finalWidth/videoAspect;

    const leftPos=
        positionSelect.value==='left'
        ?videoOffsetX
        :videoOffsetX-pWidth;

    calibBox.style.width=finalWidth+'px';

    calibBox.style.height=finalHeight+'px';

    calibBox.style.transform=
        `translate3d(${leftPos}px,${videoOffsetY}px,0)`;
}


/* =========================================================
   CACHE DATABASE
   ========================================================= */

function openCacheDB(){

    if(cacheDB)
        return Promise.resolve(cacheDB);

    return new Promise((resolve,reject)=>{

        try{

            const request=
                indexedDB.open(
                    CACHE_DB_NAME,
                    CACHE_DB_VERSION
                );

            request.onupgradeneeded=e=>{

                const db=e.target.result;

                if(!db.objectStoreNames.contains(CACHE_STORE)){

                    db.createObjectStore(
                        CACHE_STORE,
                        {keyPath:'id'}
                    );
                }
            };

            request.onsuccess=e=>{

                cacheDB=e.target.result;

                resolve(cacheDB);
            };

            request.onerror=()=>{

                reject(
                    request.error||
                    new Error('IndexedDB error')
                );
            };

        }catch(e){

            reject(e);
        }
    });
}

async function saveCacheBlob(blob,meta){

    try{

        const db=
            await openCacheDB();

        await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readwrite'
                );

            tx.objectStore(
                CACHE_STORE
            ).put({

                id:'current',

                blob:blob,

                name:meta.name||'video',

                type:meta.type||blob.type||'video/mp4',

                size:blob.size,

                savedAt:Date.now()

            });

            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error);
            tx.onabort=()=>reject(tx.error);

        });

        return true;

    }catch(e){

        console.error(
            'Cache save error:',
            e
        );

        return false;
    }
}

async function loadCacheBlob(){

    try{

        const db=
            await openCacheDB();

        return await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readonly'
                );

            const request=
                tx.objectStore(
                    CACHE_STORE
                ).get('current');

            request.onsuccess=()=>{

                resolve(
                    request.result||null
                );
            };

            request.onerror=()=>{

                reject(request.error);
            };
        });

    }catch(e){

        return null;
    }
}

async function deleteCacheBlob(){

    try{

        const db=
            await openCacheDB();

        await new Promise((resolve,reject)=>{

            const tx=
                db.transaction(
                    CACHE_STORE,
                    'readwrite'
                );

            tx.objectStore(
                CACHE_STORE
            ).delete('current');

            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error);
            tx.onabort=()=>reject(tx.error);

        });

    }catch(e){}
}


/* =========================================================
   SET LOCAL CACHE VIDEO
   ========================================================= */

async function setCachedVideoBlob(blob,meta){

    if(cacheLocalVideoUrl){

        try{
            URL.revokeObjectURL(cacheLocalVideoUrl);
        }catch(e){}

        cacheLocalVideoUrl=null;
    }

    cacheLocalVideoUrl=
        URL.createObjectURL(blob);

    localVideoBlobUrl=
        cacheLocalVideoUrl;

    videoPlayer.pause();

    videoPlayer.srcObject=null;

    videoPlayer.src=
        cacheLocalVideoUrl;

    videoPlayer.load();

    videoPlayer.muted=false;
    videoPlayer.volume=1;

    await new Promise(resolve=>{

        let done=false;

        const finish=()=>{

            if(done)
                return;

            done=true;

            videoPlayer.removeEventListener(
                'loadedmetadata',
                finish
            );

            resolve();
        };

        videoPlayer.addEventListener(
            'loadedmetadata',
            finish
        );

        if(videoPlayer.readyState>=1)
            finish();

        setTimeout(
            finish,
            5000
        );
    });

    updateVideoStyle();

    timelineRange.value=0;

    if(Number.isFinite(videoPlayer.duration)&&
       videoPlayer.duration>0){

        timeDisplay.textContent=
            `00:00 / ${formatTime(videoPlayer.duration)}`;

    }else{

        timeDisplay.textContent=
            '00:00 / 00:00';
    }
}


/* =========================================================
   CACHE TRANSFER HOST
   ========================================================= */

async function startCacheTransfer(file){

    if(!isHost)
        return;

    if(videoModeSelect.value!==CACHE_MODE)
        return;

    if(!file)
        return;

    if(!conn||!conn.open){

        connectionStatus.textContent=
            'Статус: Другий телефон ще не підключений.';

        return;
    }

    if(cacheHostSending)
        return;

    cacheHostSending=true;

    const token=
        ++cacheHostSendToken;

    const transferId=
        Date.now().toString(36)+
        '-' +
        Math.random().toString(36).slice(2,8);

    cacheTransferId=transferId;

    cacheRemoteReady=false;

    connectionStatus.textContent=
        'Статус: Починаю передачу файлу на S10...';

    /*
      ЄДИНИЙ cache_transfer_start.
      Старої подвійної відправки більше немає.
    */
    sendMessage({

        type:'cache_transfer_start',

        id:transferId,

        name:file.name,

        size:file.size,

        mime:file.type||'video/mp4',

        chunkSize:CACHE_CHUNK_SIZE,

        chunks:
            Math.ceil(
                file.size/CACHE_CHUNK_SIZE
            )
    });

    /*
      Чекаємо на підтвердження S10,
      що він готовий приймати.
    */
    await new Promise(resolve=>{

        let finished=false;

        const check=()=>{

            if(finished)
                return;

            if(token!==cacheHostSendToken||
               !cacheHostSending){

                finished=true;
                resolve();
                return;
            }

            if(cacheReceiveReadyForTransfer===transferId){

                finished=true;
                resolve();
                return;
            }

            setTimeout(check,30);
        };

        check();

        setTimeout(()=>{

            if(!finished){

                finished=true;
                resolve();
            }

        },5000);
    });

    if(token!==cacheHostSendToken||
       !cacheHostSending||
       !conn||
       !conn.open){

        cacheHostSending=false;
        return;
    }

    let offset=0;
    let chunkNumber=0;

    const totalChunks=
        Math.ceil(
            file.size/CACHE_CHUNK_SIZE
        );

    const started=
        performance.now();

    while(
        offset<file.size&&
        token===cacheHostSendToken&&
        cacheHostSending&&
        conn&&
        conn.open
    ){

        const end=
            Math.min(
                file.size,
                offset+CACHE_CHUNK_SIZE
            );

        const blob=
            file.slice(
                offset,
                end
            );

        const buffer=
            await blob.arrayBuffer();

        if(token!==cacheHostSendToken||
           !cacheHostSending||
           !conn||
           !conn.open){

            break;
        }

        /*
          Binary DataConnection.
          ArrayBuffer передається як справжній
          binary payload, а не JSON.
        */
        try{

            conn.send({

                type:'cache_chunk',

                id:transferId,

                n:chunkNumber,

                total:totalChunks,

                data:buffer

            });

        }catch(e){

            console.error(
                'Cache chunk send error:',
                e
            );

            connectionStatus.textContent=
                'Статус: Помилка передачі частини файлу.';

            break;
        }

        offset=end;
        chunkNumber++;

        const percent=
            file.size>0
            ?offset/file.size*100
            :100;

        const elapsed=
            (performance.now()-started)/1000;

        const speed=
            elapsed>0
            ?offset/elapsed/1024/1024
            :0;

        connectionStatus.textContent=
            `Статус: Передача відео ${percent.toFixed(1)}% • ${speed.toFixed(1)} МБ/с`;

        /*
          Після кожних 8 частин трохи віддаємо
          час браузеру/DataChannel.
        */
        if(chunkNumber%8===0){

            await new Promise(resolve=>
                setTimeout(resolve,5)
            );
        }
    }

    if(
        token===cacheHostSendToken&&
        cacheHostSending&&
        conn&&
        conn.open&&
        offset>=file.size
    ){

        sendMessage({

            type:'cache_transfer_end',

            id:transferId,

            name:file.name,

            size:file.size,

            mime:file.type||'video/mp4',

            chunks:totalChunks
        });

        connectionStatus.textContent=
            'Статус: Файл повністю передано. S10 збирає відео...';
    }

    cacheHostSending=false;
}


/* =========================================================
   Прапорець готовності S10 до прийому
   ========================================================= */

let cacheReceiveReadyForTransfer='';


/* =========================================================
   CACHE TRANSFER CLIENT START
   ========================================================= */

async function cacheReceiveStart(msg){

    cacheReceiveId=
        String(msg.id||'');

    cacheReceiveName=
        msg.name||'video';

    cacheReceiveSize=
        Number(msg.size)||0;

    cacheReceiveType=
        msg.mime||'video/mp4';

    cacheReceiveReceived=0;

    cacheReceiveChunks=[];

    cacheReceiveReceivedMap=
        new Set();

    cacheReceiveChunkCount=
        Number(msg.chunks)||
        Math.ceil(
            cacheReceiveSize/CACHE_CHUNK_SIZE
        );

    cacheReceiveStartedAt=
        performance.now();

    cacheTransferActive=true;

    cacheRemoteReady=false;

    connectionStatus.textContent=
        'Статус: Готую S10 до прийому нового відео...';

    /*
      Видаляємо попередній кеш.
    */
    await deleteCacheBlob();

    if(cacheLocalVideoUrl){

        try{
            URL.revokeObjectURL(cacheLocalVideoUrl);
        }catch(e){}

        cacheLocalVideoUrl=null;
    }

    /*
      Старе відео прибираємо.
    */
    try{
        videoPlayer.pause();
        videoPlayer.removeAttribute('src');
        videoPlayer.srcObject=null;
        videoPlayer.load();
    }catch(e){}

    remoteVideoDuration=0;
    remoteVideoTime=0;

    timelineRange.value=0;

    timeDisplay.textContent=
        '00:00 / 00:00';

    /*
      Підтверджуємо HOST:
      цей transferId можна приймати.
    */
    cacheReceiveReadyForTransfer=
        cacheReceiveId;

    sendMessage({

        type:'cache_receive_ready',

        id:cacheReceiveId
    });

    connectionStatus.textContent=
        'Статус: Отримання відео через Wi-Fi 0%...';
}


/* =========================================================
   CACHE TRANSFER CLIENT CHUNK
   ========================================================= */

async function cacheReceiveChunk(msg){

    if(!cacheTransferActive)
        return;

    if(String(msg.id)!==cacheReceiveId)
        return;

    if(msg.data===undefined||
       msg.data===null)
        return;

    try{

        let buffer=msg.data;

        /*
          Binary PeerJS зазвичай повертає ArrayBuffer.
        */
        if(buffer instanceof Uint8Array){

            /*
              Важливо: не використовуємо весь
              backing buffer, якщо Uint8Array
              має власний offset/length.
            */
            buffer=
                buffer.buffer.slice(
                    buffer.byteOffset,
                    buffer.byteOffset+
                    buffer.byteLength
                );
        }

        if(buffer instanceof Blob){

            buffer=
                await buffer.arrayBuffer();
        }

        if(!(buffer instanceof ArrayBuffer))
            return;

        const n=
            Number(msg.n);

        if(!Number.isInteger(n))
            return;

        /*
          Не додаємо дубль вдруге.
        */
        if(cacheReceiveReceivedMap.has(n))
            return;

        cacheReceiveReceivedMap.add(n);

        cacheReceiveChunks[n]=buffer;

        cacheReceiveReceived+=
            buffer.byteLength;

        const percent=
            cacheReceiveSize>0
            ?cacheReceiveReceived/
             cacheReceiveSize*
             100
            :0;

        const elapsed=
            (performance.now()-
             cacheReceiveStartedAt)/1000;

        const speed=
            elapsed>0
            ?cacheReceiveReceived/
             elapsed/
             1024/
             1024
            :0;

        connectionStatus.textContent=
            `Статус: Завантаження ${percent.toFixed(1)}% • ${speed.toFixed(1)} МБ/с`;

    }catch(e){

        console.error(
            'Cache receive chunk error:',
            e
        );
    }
}


/* =========================================================
   CACHE TRANSFER END CLIENT
   ========================================================= */

async function cacheReceiveEnd(msg){

    if(!cacheTransferActive)
        return;

    if(String(msg.id)!==cacheReceiveId)
        return;

    connectionStatus.textContent=
        'Статус: Перевіряю отримані частини...';

    try{

        const expectedChunks=
            Number(msg.chunks)||
            cacheReceiveChunkCount;

        /*
          Перевіряємо кількість частин.
        */
        if(
            cacheReceiveReceivedMap.size<
            expectedChunks
        ){

            connectionStatus.textContent=
                `Статус: Помилка — отримано ${cacheReceiveReceivedMap.size} з ${expectedChunks} частин.`;

            /*
              Повідомляємо S25+, щоб він не
              вважав передачу завершеною.
            */
            sendMessage({

                type:'cache_receive_error',

                id:cacheReceiveId,

                received:
                    cacheReceiveReceivedMap.size,

                expected:
                    expectedChunks
            });

            cacheTransferActive=false;

            return;
        }

        /*
          Перевіряємо розмір.
        */
        if(
            cacheReceiveSize>0&&
            cacheReceiveReceived<
            cacheReceiveSize
        ){

            connectionStatus.textContent=
                `Статус: Помилка — отримано ${cacheReceiveReceived} з ${cacheReceiveSize} байт.`;

            sendMessage({

                type:'cache_receive_error',

                id:cacheReceiveId,

                receivedBytes:
                    cacheReceiveReceived,

                expectedBytes:
                    cacheReceiveSize
            });

            cacheTransferActive=false;

            return;
        }

        connectionStatus.textContent=
            'Статус: Збираю відеофайл на S10...';

        /*
          НЕ використовуємо filter().
          Частини мають залишатися строго
          в оригінальному порядку:
          0,1,2,3...
        */
        const orderedChunks=[];

        for(let i=0;i<expectedChunks;i++){

            const chunk=
                cacheReceiveChunks[i];

            if(!chunk){

                connectionStatus.textContent=
                    `Статус: Відсутня частина №${i+1}.`;

                cacheTransferActive=false;

                return;
            }

            orderedChunks.push(chunk);
        }

        const blob=
            new Blob(
                orderedChunks,
                {
                    type:
                        cacheReceiveType||
                        'video/mp4'
                }
            );

        /*
          Остаточна перевірка розміру Blob.
        */
        if(
            cacheReceiveSize>0&&
            blob.size!==cacheReceiveSize
        ){

            connectionStatus.textContent=
                `Статус: Помилка складання. Розмір ${blob.size} замість ${cacheReceiveSize} байт.`;

            cacheTransferActive=false;

            return;
        }

        connectionStatus.textContent=
            'Статус: Зберігаю повний файл у кеш S10...';

        const saved=
            await saveCacheBlob(
                blob,
                {
                    name:cacheReceiveName,
                    type:cacheReceiveType
                }
            );

        if(!saved){

            connectionStatus.textContent=
                'Статус: Не вдалося записати відео в кеш S10.';

            cacheTransferActive=false;

            return;
        }

        connectionStatus.textContent=
            'Статус: Відео збережено. Завантажую у плеєр...';

        await setCachedVideoBlob(
            blob,
            {
                name:cacheReceiveName,
                type:cacheReceiveType
            }
        );

        cacheRemoteReady=true;

        cacheRemoteFileName=
            cacheReceiveName;

        cacheTransferActive=false;

        sendMessage({

            type:'cache_ready',

            id:cacheReceiveId,

            name:cacheReceiveName,

            duration:
                Number.isFinite(videoPlayer.duration)
                ?videoPlayer.duration
                :0,

            size:blob.size
        });

        connectionStatus.textContent=
            'Статус: ✅ Відео повністю готове на S10.';

        playPauseBtn.textContent=
            '▶ Грати';

        startAntiSleepAudio();
        requestWakeLock();

    }catch(e){

        console.error(
            'Cache assemble error:',
            e
        );

        cacheTransferActive=false;

        connectionStatus.textContent=
            'Статус: ❌ Помилка складання відеофайлу.';
    }

    cacheReceiveChunks=[];
    cacheReceiveReceivedMap.clear();
}


/* =========================================================
   LOAD EXISTING CACHE
   ========================================================= */

async function tryLoadExistingCache(){

    if(isHost)
        return;

    if(videoModeSelect.value!==CACHE_MODE)
        return;

    const saved=
        await loadCacheBlob();

    if(!saved||!saved.blob)
        return;

    try{

        await setCachedVideoBlob(
            saved.blob,
            saved
        );

        cacheRemoteReady=true;

        cacheRemoteFileName=
            saved.name||'';

        connectionStatus.textContent=
            'Статус: Знайдено попередній кеш. Очікування нового відео...';

    }catch(e){}
}
