<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenParty Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        select, input, button {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"] {
            letter-spacing: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        button {
            background: #4CAF50;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        .hidden {
            display: none !important;
        }
        #playerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            overflow: hidden;
            z-index: 9999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .control-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .ctrl-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .ctrl-btn:active {
            background: #4CAF50;
        }
        .fs-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10000;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
            color: #ff9800;
            word-break: break-all;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="setupContainer">
        <h1>ScreenParty Sync</h1>
        
        <label for="roleSelect">Роль пристрою:</label>
        <select id="roleSelect">
            <option value="host">Головний (Host - S25+)</option>
            <option value="client">Другий (Client - S10)</option>
        </select>

        <div id="hostSection">
            <label for="videoFile">Виберіть відеофайл:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>

        <div id="clientSection" class="hidden">
            <label for="roomCodeInput">Код кімнати:</label>
            <input type="text" id="roomCodeInput" placeholder="Введіть код" maxlength="5">
            
            <label for="clientVideoFile">Виберіть той самий відеофайл:</label>
            <input type="file" id="clientVideoFile" accept="video/*">
        </div>

        <button id="startBtn">Створити кімнату</button>
        <div id="statusText" class="status"></div>
    </div>

    <div id="playerContainer">
        <button class="fs-btn" id="fsBtn">⛶ На весь екран</button>
        
        <video id="videoPlayer" playsinline controls></video>

        <div class="controls-overlay" id="controlsOverlay">
            <div class="control-row">
                <button class="ctrl-btn" id="upBtn">⬆️</button>
            </div>
            <div class="control-row">
                <button class="ctrl-btn" id="leftBtn">⬅️</button>
                <button class="ctrl-btn" id="zoomOutBtn">➖</button>
                <button class="ctrl-btn" id="zoomInBtn">➕</button>
                <button class="ctrl-btn" id="rightBtn">➡️</button>
            </div>
            <div class="control-row">
                <button class="ctrl-btn" id="downBtn">⬇️</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        const roleSelect = document.getElementById('roleSelect');
        const hostSection = document.getElementById('hostSection');
        const clientSection = document.getElementById('clientSection');
        const videoFile = document.getElementById('videoFile');
        const clientVideoFile = document.getElementById('clientVideoFile');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const startBtn = document.getElementById('startBtn');
        const setupContainer = document.getElementById('setupContainer');
        const playerContainer = document.getElementById('playerContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const fsBtn = document.getElementById('fsBtn');
        const statusText = document.getElementById('statusText');

        // Трансформації для керування положенням та масштабом
        let scale = 2.0;
        let translateX = 0;
        let translateY = 0;

        function updateTransform() {
            videoPlayer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        roleSelect.addEventListener('change', () => {
            if (roleSelect.value === 'host') {
                hostSection.classList.remove('hidden');
                clientSection.classList.add('hidden');
                startBtn.innerText = 'Створити кімнату';
            } else {
                hostSection.classList.add('hidden');
                clientSection.classList.remove('hidden');
                startBtn.innerText = 'Підключитися до кімнати';
            }
        });

        function generateRoomCode() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        // Керування панеллю зсуву та зуму
        document.getElementById('leftBtn').addEventListener('click', () => { translateX += 30; updateTransform(); });
        document.getElementById('rightBtn').addEventListener('click', () => { translateX -= 30; updateTransform(); });
        document.getElementById('upBtn').addEventListener('click', () => { translateY += 30; updateTransform(); });
        document.getElementById('downBtn').addEventListener('click', () => { translateY -= 30; updateTransform(); });
        document.getElementById('zoomInBtn').addEventListener('click', () => { scale += 0.2; updateTransform(); });
        document.getElementById('zoomOutBtn').addEventListener('click', () => { scale = Math.max(1, scale - 0.2); updateTransform(); });

        fsBtn.addEventListener('click', () => {
            const elem = playerContainer;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        startBtn.addEventListener('click', () => {
            statusText.style.color = '#ff9800';
            const role = roleSelect.value;

            if (role === 'host') {
                const file = videoFile.files[0];
                if (!file) {
                    statusText.style.color = '#f44336';
                    statusText.innerText = 'Виберіть відеофайл!';
                    return;
                }
                videoPlayer.src = URL.createObjectURL(file);
                // Початкове зміщення для лівої половини на хості
                translateX = 150; 
                translateY = 0;
                scale = 2.0;
                updateTransform();

                const roomCode = generateRoomCode();
                statusText.innerText = 'Ініціалізація кімнати...';

                try {
                    peer = new Peer('sp-' + roomCode, {
                        host: '0.peerjs.com',
                        port: 443,
                        secure: true
                    });
                    
                    peer.on('open', () => {
                        statusText.style.color = '#4CAF50';
                        statusText.innerText = `Кімната створена! Код: ${roomCode}. Введіть його на S10.`;
                    });

                    peer.on('error', (err) => {
                        statusText.style.color = '#f44336';
                        statusText.innerText = 'Помилка PeerJS: ' + (err.type || err);
                    });

                    peer.on('connection', (connection) => {
                        conn = connection;
                        statusText.innerText = 'Клієнт підключився! Запуск...';
                        setTimeout(() => {
                            setupContainer.classList.add('hidden');
                            playerContainer.style.display = 'block';
                            setupHostSync();
                        }, 800);
                    });
                } catch (e) {
                    statusText.style.color = '#f44336';
                    statusText.innerText = 'Помилка: ' + e.message;
                }

            } else {
                const code = roomCodeInput.value.trim();
                const file = clientVideoFile.files[0];
                if (code.length !== 5) {
                    statusText.style.color = '#f44336';
                    statusText.innerText = 'Введіть 5-значний код кімнати!';
                    return;
                }
                if (!file) {
                    statusText.style.color = '#f44336';
                    statusText.innerText = 'Виберіть той самий відеофайл!';
                    return;
                }
                videoPlayer.src = URL.createObjectURL(file);
                // Початкове зміщення для правої половини на клієнті
                translateX = -150;
                translateY = 0;
                scale = 2.0;
                updateTransform();

                statusText.innerText = 'Підключення до кімнати...';
                
                try {
                    peer = new Peer({
                        host: '0.peerjs.com',
                        port: 443,
                        secure: true
                    });

                    peer.on('open', () => {
                        conn = peer.connect('sp-' + code);
                        
                        conn.on('open', () => {
                            statusText.style.color = '#4CAF50';
                            statusText.innerText = 'Підключено! Запуск...';
                            setTimeout(() => {
                                setupContainer.classList.add('hidden');
                                playerContainer.style.display = 'block';
                                setupClientSync();
                            }, 800);
                        });

                        conn.on('error', (err) => {
                            statusText.style.color = '#f44336';
                            statusText.innerText = 'Помилка з’єднання: ' + err;
                        });
                    });

                    peer.on('error', (err) => {
                        statusText.style.color = '#f44336';
                        statusText.innerText = 'Помилка PeerJS: ' + (err.type || err);
                    });
                } catch (e) {
                    statusText.style.color = '#f44336';
                    statusText.innerText = 'Помилка: ' + e.message;
                }
            }
        });

        function setupHostSync() {
            videoPlayer.addEventListener('play', () => {
                if (conn && conn.open) conn.send({type: 'play', time: videoPlayer.currentTime});
            });
            videoPlayer.addEventListener('pause', () => {
                if (conn && conn.open) conn.send({type: 'pause', time: videoPlayer.currentTime});
            });
            videoPlayer.addEventListener('seeked', () => {
                if (conn && conn.open) conn.send({type: 'seek', time: videoPlayer.currentTime});
            });

            setInterval(() => {
                if (conn && conn.open && !videoPlayer.paused) {
                    conn.send({type: 'sync', time: videoPlayer.currentTime});
                }
            }, 2000);
        }

        function setupClientSync() {
            conn.on('data', (data) => {
                if (data.type === 'play') {
                    if (Math.abs(videoPlayer.currentTime - data.time) > 0.3) {
                        videoPlayer.currentTime = data.time;
                    }
                    videoPlayer.play().catch(e => console.log(e));
                } else if (data.type === 'pause') {
                    videoPlayer.pause();
                    videoPlayer.currentTime = data.time;
                } else if (data.type === 'seek' || data.type === 'sync') {
                    if (Math.abs(videoPlayer.currentTime - data.time) > 0.4) {
                        videoPlayer.currentTime = data.time;
                    }
                }
            });
        }
    </script>
</body>
</html>
