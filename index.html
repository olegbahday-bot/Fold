<style>
html, body {
    margin: 0;
    padding: 0;

    height: 100%;
    background: #121212;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

}

body {
    display: flex;

    align-items: center;
    box-sizing: border-box;
}

.card {
    background: #1e1e1e;

    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);

    z-index: 10;

}

h2 {
    margin-top: 0;
    font-size: 20px;

}

label {
    display: block;
    margin-top: 10px;
    font-size: 13px;

    text-align: left;
}

select,
input,
button {

    padding: 10px;
    margin-top: 5px;
    background: #2a2a2a;

input[type="text"] {

button {

    z-index: 150;
}

#playerScreen {

    top: 0;
    left: 0;

    z-index: 100;
    overflow: hidden;
}

video.vid-el {
    position: absolute;
    top: 0;
    left: 0;
    object-fit: fill;
    will-change: transform;
}

#volumeIndicator {
    position: fixed;
    top: 50%;
    left: 50%;

}

#keepAwakeVideo {
    position: fixed;

    height: 2px;

    opacity: 0.001;
    pointer-events: none;

}

.controls {

    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.94);

    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 200;

    box-sizing: border-box;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

.timeline-container {

    align-items: center;

    margin-bottom: 4px;
    padding: 2px;

}

.timeline-slider {
    flex: 1;

    -webkit-appearance: none;

    margin: 0;

}

.timeline-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;

    height: 18px;

}

.timeline-slider::-moz-range-track {

    background: #444;
    border-radius: 3px;
}

.timeline-slider::-moz-range-thumb {

    height: 18px;
    border-radius: 50%;
    background: #4CAF50;

}

.time-display {

.controls-grid {

.controls button {

<script>

const setupCard =
document.getElementById('setupCard');

const playerScreen =
document.getElementById('playerScreen');

const calibrationScreen =
document.getElementById('calibrationScreen');

const calibBox =
document.getElementById('calibBox');

const videoPlayer =
document.getElementById('videoPlayer');

const keepAwakeVideo =
document.getElementById('keepAwakeVideo');

const playerControls =
document.getElementById('playerControls');

const newVideoInput =
document.getElementById('newVideoInput');

const timelineContainer =
document.getElementById('timelineContainer');

const timelineRange =
document.getElementById('timelineRange');

const timeDisplay =
document.getElementById('timeDisplay');

const roleSelect =
document.getElementById('roleSelect');

const positionSelect =
document.getElementById('positionSelect');

const videoModeSelect =
document.getElementById('videoModeSelect');

const fileInputContainer =
document.getElementById('fileInputContainer');

const videoInput =
document.getElementById('videoInput');

const hostSection =
document.getElementById('hostSection');

const clientSection =
document.getElementById('clientSection');

const connectionStatus =
document.getElementById('connectionStatus');

const openCalibOverlayBtn =
document.getElementById('openCalibOverlayBtn');

const closeCalibBtn =
document.getElementById('closeCalibBtn');

const startHostBtn =
document.getElementById('startHostBtn');

const codeContainer =
document.getElementById('codeContainer');

const hostCodeDisplay =
document.getElementById('hostCodeDisplay');

const clientCodeInput =
document.getElementById('clientCodeInput');

const connectClientBtn =
document.getElementById('connectClientBtn');

const playPauseBtn =
document.getElementById('playPauseBtn');

const restartBtn =
document.getElementById('restartBtn');

const fullscreenBtn =
document.getElementById('fullscreenBtn');

const volumeIndicator =
document.getElementById('volumeIndicator');

const changeVideoBtn =
document.getElementById('changeVideoBtn');


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let peer = null;
let conn = null;
let activeCall = null;

let isHost = false;

let localVideoBlobUrl = null;

let audioCtx = null;
let silentOscillator = null;

let wakeLock = null;
let wakeLockRetryTimer = null;

let videoOffsetX = 0;
let videoOffsetY = 0;
let videoScaleMultiplier = 1.0;

let syncInterval = null;

let partnerWidth = 0;
let partnerHeight = 0;

let isDraggingTimeline = false;
let isSwipingVolume = false;

let touchStartY = 0;
let touchStartX = 0;
let touchStartVolume = 1.0;

let hasSwiped = false;

let volumeTimeout = null;

let remoteVideoDuration = 0;
let remoteVideoTime = 0;
let remoteVideoPaused = true;

let videoChangeInProgress = false;

let videoVersion = 0;


/* =========================================================
   FULL HD LIMIT
========================================================= */

const MAX_VIDEO_WIDTH = 1920;
const MAX_VIDEO_HEIGHT = 1080;

const VIDEO_ASPECT = 16 / 9;

let streamingCanvas = null;
let streamingCanvasContext = null;
let streamingAnimationFrame = null;
let streamingCanvasStream = null;


/* =========================================================
   PEERJS
========================================================= */

const peerOptions = {

    debug: 1,

    config: {

        iceServers: [

            {
                urls:
                    'stun:stun.l.google.com:19302'
            },

            {
                urls:
                    'stun:stun1.l.google.com:19302'
            }

        ]

    }

};


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    try {

        if (!('wakeLock' in navigator)) {
            return;
        }

        if (document.visibilityState !== 'visible') {
            return;
        }

        if (playerScreen.style.display === 'none') {
            return;
        }

        if (
            wakeLock &&
            !wakeLock.released
        ) {
            return;
        }

        wakeLock =
            await navigator.wakeLock.request(
                'screen'
            );

        wakeLock.addEventListener(
            'release',
            () => {

                wakeLock = null;

                if (wakeLockRetryTimer) {

                    clearTimeout(
                        wakeLockRetryTimer
                    );

                }

                wakeLockRetryTimer =
                    setTimeout(
                        () => {

                            if (
                                document.visibilityState === 'visible' &&
                                playerScreen.style.display !== 'none'
                            ) {

                                requestWakeLock();

                            }

                        },
                        1000
                    );

            }
        );

    } catch (e) {

        if (wakeLockRetryTimer) {

            clearTimeout(
                wakeLockRetryTimer
            );

        }

        wakeLockRetryTimer =
            setTimeout(
                () => {

                    if (
                        document.visibilityState === 'visible' &&
                        playerScreen.style.display !== 'none'
                    ) {

                        requestWakeLock();

                    }

                },
                1500
            );

    }

}


/* =========================================================
   AUDIO KEEP ALIVE
========================================================= */

function startAntiSleepAudio() {

    try {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioCtx.state === 'suspended'
        ) {

            audioCtx.resume()
                .catch(() => {});

        }

        if (!silentOscillator) {

            const gain =
                audioCtx.createGain();

            gain.gain.value =
                0.00001;

            const osc =
                audioCtx.createOscillator();

            osc.frequency.value =
                100;

            osc.connect(gain);

            gain.connect(
                audioCtx.destination
            );

            osc.start();

            silentOscillator = {

                oscillator:
                    osc,

                gain:
                    gain

            };

        }

    } catch (e) {}

    requestWakeLock();

}


function startKeepAwakeVideo() {

    requestWakeLock();

}


function stopKeepAwakeVideo() {}


/* =========================================================
   WAKE LOCK EVENTS
========================================================= */

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            document.visibilityState === 'visible'
        ) {

            if (
                playerScreen.style.display !== 'none'
            ) {

                startAntiSleepAudio();

                requestWakeLock();

            }

        }

    }
);


window.addEventListener(
    'focus',
    () => {

        if (
            playerScreen.style.display !== 'none'
        ) {

            startAntiSleepAudio();

            requestWakeLock();

        }

    }
);


window.addEventListener(
    'pageshow',
    () => {

        if (
            playerScreen.style.display !== 'none'
        ) {

            startAntiSleepAudio();

            requestWakeLock();

        }

    }
);


document.addEventListener(
    'fullscreenchange',
    () => {

        setTimeout(
            () => {

                requestWakeLock();

                updateVideoStyle();

            },
            300
        );

    }
);


setInterval(
    () => {

        if (
            playerScreen.style.display !== 'none' &&
            document.visibilityState === 'visible'
        ) {

            requestWakeLock();

        }

    },
    4000
);


/* =========================================================
   SETTINGS
========================================================= */

function loadSavedSettings() {

    const savedScale =
        localStorage.getItem(
            'sp_scale'
        );

    const savedX =
        localStorage.getItem(
            'sp_offsetX'
        );

    const savedY =
        localStorage.getItem(
            'sp_offsetY'
        );

    const savedPos =
        localStorage.getItem(
            'sp_position'
        );


    if (
        savedScale !== null
    ) {

        videoScaleMultiplier =
            Math.max(
                0.1,
                Math.min(
                    5.0,
                    parseFloat(
                        savedScale
                    )
                )
            );

    }


    if (
        savedX !== null
    ) {

        videoOffsetX =
            parseFloat(
                savedX
            );

    }


    if (
        savedY !== null
    ) {

        videoOffsetY =
            parseFloat(
                savedY
            );

    }


    if (
        savedPos === 'left' ||
        savedPos === 'right'
    ) {

        positionSelect.value =
            savedPos;

    }

}


loadSavedSettings();


function saveSettings() {

    localStorage.setItem(
        'sp_scale',
        videoScaleMultiplier
    );

    localStorage.setItem(
        'sp_offsetX',
        videoOffsetX
    );

    localStorage.setItem(
        'sp_offsetY',
        videoOffsetY
    );

    localStorage.setItem(
        'sp_position',
        positionSelect.value
    );

}


/* =========================================================
   INPUT VISIBILITY
========================================================= */

function updateInputsVisibility() {

    const role =
        roleSelect.value;

    const mode =
        videoModeSelect.value;


    if (
        role === 'host'
    ) {

        hostSection.classList.remove(
            'hidden'
        );

        clientSection.classList.add(
            'hidden'
        );

        fileInputContainer.style.display =
            'block';

        changeVideoBtn.style.display =
            'block';

    } else {

        hostSection.classList.add(
            'hidden'
        );

        clientSection.classList.remove(
            'hidden'
        );

        fileInputContainer.style.display =
            mode === 'stream'
            ? 'none'
            : 'block';

        changeVideoBtn.style.display =
            'none';

    }

}


roleSelect.addEventListener(
    'change',
    updateInputsVisibility
);


videoModeSelect.addEventListener(
    'change',
    updateInputsVisibility
);


updateInputsVisibility();


/* =========================================================
   FULLSCREEN
========================================================= */

function requestFullscreenNow() {

    if (
        !document.fullscreenElement
    ) {

        if (
            document.documentElement.requestFullscreen
        ) {

            document.documentElement
                .requestFullscreen()
                .catch(() => {});

        }

    }

}


/* =========================================================
   CALIBRATION
========================================================= */

openCalibOverlayBtn.addEventListener(
    'click',
    () => {

        calibrationScreen.style.display =
            'block';

        updateCalibrationStyle();

    }
);


closeCalibBtn.addEventListener(
    'click',
    () => {

        saveSettings();

        calibrationScreen.style.display =
            'none';

        updateVideoStyle();

        openCalibOverlayBtn.style.display =
            'none';

    }
);


function getFixedVideoGeometry() {

    const myWidth =
        window.innerWidth;

    const pWidth =
        partnerWidth > 0
        ? partnerWidth
        : myWidth;

    const combinedWidth =
        myWidth + pWidth;

    /*
       Відео не може бути ширшим за Full HD.

       Якщо два екрани разом ширші за 1920 px,
       відео залишається 1920 px.
    */

    const baseWidth =
        Math.min(
            combinedWidth,
            MAX_VIDEO_WIDTH
        );

    const finalWidth =
        baseWidth *
        videoScaleMultiplier;

    const finalHeight =
        finalWidth /
        VIDEO_ASPECT;

    return {
        myWidth,
        pWidth,
        combinedWidth,
        finalWidth,
        finalHeight
    };

}


function updateCalibrationStyle() {

    const geometry =
        getFixedVideoGeometry();

    const pWidth =
        geometry.pWidth;

    const finalWidth =
        geometry.finalWidth;

    const finalHeight =
        geometry.finalHeight;


    let leftPos =
        positionSelect.value === 'left'
        ? videoOffsetX
        : videoOffsetX - pWidth;


    calibBox.style.width =
        finalWidth + 'px';

    calibBox.style.height =
        finalHeight + 'px';

    calibBox.style.transform =
        `translate3d(${leftPos}px,${videoOffsetY}px,0)`;

}


/* =========================================================
   VIDEO INPUT — FIRST VIDEO
========================================================= */

videoInput.addEventListener(
    'change',
    (e) => {

        const file =
            e.target.files[0];

        if (!file) {
            return;
        }


        if (localVideoBlobUrl) {

            try {

                URL.revokeObjectURL(
                    localVideoBlobUrl
                );

            } catch (err) {}

        }


        localVideoBlobUrl =
            URL.createObjectURL(
                file
            );


        videoPlayer.srcObject =
            null;

        videoPlayer.src =
            localVideoBlobUrl;

        videoPlayer.muted =
            false;

        videoPlayer.volume =
            1;

        videoPlayer.pause();

        videoPlayer.load();


        connectionStatus.textContent =
            'Статус: Відео завантажено.';

    }
);

/* =========================================================
   CLEAR OLD REMOTE VIDEO
========================================================= */

function clearRemoteVideo() {

    try {
        videoPlayer.pause();
    } catch (e) {}


    try {
        videoPlayer.srcObject =
            null;
    } catch (e) {}


    try {

        );

    } catch (e) {}

        '▶ Грати';

}


/* =========================================================
   STOP STREAMING CANVAS
========================================================= */

function stopStreamingCanvas() {

    if (streamingAnimationFrame) {

        cancelAnimationFrame(
            streamingAnimationFrame
        );

        streamingAnimationFrame =
            null;

    }


    if (streamingCanvasStream) {

        try {

            streamingCanvasStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        } catch (e) {}

    }


    streamingCanvasStream =
        null;

    streamingCanvas =
        null;

    streamingCanvasContext =
        null;

}


/* =========================================================
   CREATE FULL HD STREAM
========================================================= */

function createFullHDStream() {

    stopStreamingCanvas();


    /*
       Створюємо максимум 1920x1080.

       Навіть якщо вихідне відео 4K,
       у WebRTC передається не більше Full HD.
    */

    streamingCanvas =
        document.createElement(
            'canvas'
        );

    streamingCanvas.width =
        MAX_VIDEO_WIDTH;

    streamingCanvas.height =
        MAX_VIDEO_HEIGHT;


    streamingCanvasContext =
        streamingCanvas.getContext(
            '2d',
            {
                alpha: false,
                desynchronized: true
            }
        );


    if (!streamingCanvasContext) {
        return null;
    }


    function drawFrame() {

        if (
            !streamingCanvas ||
            !streamingCanvasContext
        ) {
            return;
        }


        /*
           Заповнюємо кадр точно 1920x1080.
           Це навмисно робимо 16:9,
           щоб геометрія на двох телефонах
           не змінювалася при виборі іншого файлу.
        */

        try {

            streamingCanvasContext.drawImage(
                videoPlayer,
                0,
                0,
                MAX_VIDEO_WIDTH,
                MAX_VIDEO_HEIGHT
            );

        } catch (e) {}


        streamingAnimationFrame =
            requestAnimationFrame(
                drawFrame
            );

    }


    drawFrame();


    try {

        streamingCanvasStream =
            streamingCanvas.captureStream(
                30
            );

    } catch (e) {

        streamingCanvasStream =
            null;

    }


    return streamingCanvasStream;

}


/* =========================================================
   CHANGE VIDEO — HOST
========================================================= */

newVideoInput.addEventListener(
    'change',
    async (e) => {

        const file =
            e.target.files[0];

        if (
            !file ||
            !isHost
        ) {
            return;
        }


        if (
            videoChangeInProgress
        ) {
            return;
        }


        if (
            videoModeSelect.value !== 'stream'
        ) {

            if (localVideoBlobUrl) {

                try {

                    URL.revokeObjectURL(
                        localVideoBlobUrl
                    );

                } catch (err) {}

            }


            localVideoBlobUrl =
                URL.createObjectURL(
                    file
                );


            videoPlayer.srcObject =
                null;

            videoPlayer.src =
                localVideoBlobUrl;

            videoPlayer.load();

            videoPlayer.currentTime =
                0;

            videoPlayer.pause();

            updateVideoStyle();

            sendSyncState();

            return;

        }


        videoChangeInProgress =
            true;


        videoVersion++;


        const currentVersion =
            videoVersion;


        connectionStatus.textContent =
            'Статус: Зміна відео...';


        sendMessage({

            type:
                'video_change_start',

            version:
                currentVersion

        });


        if (activeCall) {

            const oldCall =
                activeCall;

            activeCall =
                null;

            try {
                oldCall.close();
            } catch (err) {}

        }


        stopStreamingCanvas();


        try {
            videoPlayer.pause();
        } catch (err) {}


        try {
            videoPlayer.srcObject =
                null;
        } catch (err) {}


        if (localVideoBlobUrl) {

            try {

                URL.revokeObjectURL(
                    localVideoBlobUrl
                );

            } catch (err) {}

        }


        localVideoBlobUrl =
            URL.createObjectURL(
                file
            );


        videoPlayer.removeAttribute(
            'src'
        );

        videoPlayer.load();


        videoPlayer.src =
            localVideoBlobUrl;

        videoPlayer.load();


        timelineRange.value =
            0;

        timeDisplay.textContent =
            '00:00 / 00:00';


        await new Promise(
            (resolve) => {

                let finished =
                    false;


                const done =
                    () => {

                        if (finished) {
                            return;
                        }

                        finished =
                            true;

                        videoPlayer.removeEventListener(
                            'loadedmetadata',
                            done
                        );

                        resolve();

                    };


                if (
                    videoPlayer.readyState >= 1
                ) {

                    done();

                } else {

                    videoPlayer.addEventListener(
                        'loadedmetadata',
                        done
                    );

                }


                setTimeout(
                    done,
                    3000
                );

            }
        );


        if (
            currentVersion !== videoVersion
        ) {

            videoChangeInProgress =
                false;

            return;

        }


        try {

            videoPlayer.currentTime =
                0;

        } catch (err) {}


        videoPlayer.playbackRate =
            1;


        updateVideoStyle();


        sendMessage({

            type:
                'video_change_ready',

            version:
                currentVersion,

            duration:
                Number.isFinite(
                    videoPlayer.duration
                )
                ?
                videoPlayer.duration
                :
                0

        });


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    800
                )
        );


        if (
            currentVersion !== videoVersion
        ) {

            videoChangeInProgress =
                false;

            return;

        }


        startStreaming();


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    700
                )
        );


        if (
            currentVersion !== videoVersion
        ) {

            videoChangeInProgress =
                false;

            return;

        }


        videoPlayer.play()
            .catch(() => {});


        playPauseBtn.textContent =
            '❚❚ Пауза';


        sendStreamState();

        startAntiSleepAudio();

        requestWakeLock();


        videoChangeInProgress =
            false;


        connectionStatus.textContent =
            'Статус: Нове відео запущено.';

    }
);


/* =========================================================
   HOST
========================================================= */

startHostBtn.addEventListener(
    'click',
    () => {

        startAntiSleepAudio();


        if (!localVideoBlobUrl) {

            alert(
                'Виберіть відеофайл!'
            );

            return;

        }


        requestFullscreenNow();

function startHostPeer() {

    if (peer) {

        try {
            peer.destroy();
        } catch (e) {}

    }


    const code =
        Math.floor(
            10000 +
            Math.random() * 90000
        ).toString();


    connectionStatus.textContent =
        'Статус: Створення кімнати...';


    peer =
        new Peer(
            'sp-' + code,
            peerOptions
        );


    peer.on(
        'open',
        () => {

            hostCodeDisplay.textContent =
                code;

            codeContainer.classList.remove(
                'hidden'
            );

            connectionStatus.textContent =
                'Статус: Кімнату створено! Очікування другого телефону...';

        }
    );


    peer.on(
        'connection',
        (connection) => {

            conn =
                connection;

            setupConnection();

        }
    );


    peer.on(
        'call',
        (call) => {

            try {
                call.close();
            } catch (e) {}

        }
    );

}


/* =========================================================
   CLIENT
========================================================= */

connectClientBtn.addEventListener(
    'click',
    () => {

        startAntiSleepAudio();


        if (
            videoModeSelect.value === 'local' &&
            !localVideoBlobUrl
        ) {

            alert(
                'Виберіть відеофайл!'
            );

            return;

        }


        const code =
            clientCodeInput.value.trim();


        if (
            code.length !== 5
        ) {

            alert(
                'Введіть 5-значний код!'
            );

            return;

        }


        if (peer) {

            try {
                peer.destroy();
            } catch (e) {}

        }


        requestFullscreenNow();

        isHost =
            false;


        connectionStatus.textContent =
            'Статус: Підключення...';


        peer =
            new Peer(
                peerOptions
            );


        peer.on(
            'open',
            () => {

                conn =
                    peer.connect(
                        'sp-' + code
                    );

                setupConnection();

            }
        );


        peer.on(
            'call',
            (call) => {

                if (
                    activeCall &&
                    activeCall !== call
                ) {

                    try {
                        activeCall.close();
                    } catch (e) {}

                }


                activeCall =
                    call;


                call.answer();


                call.on(
                    'stream',
                    (remoteStream) => {

                        /*
                           НЕ робимо тут повне
                           video.load().

                           Старе очищення могло давати
                           чорний кадр/затримку при
                           перемиканні потоку.
                        */

                        try {
                            videoPlayer.pause();
                        } catch (e) {}


                        try {

                            videoPlayer.srcObject =
                                remoteStream;

                        } catch (e) {

                            return;

                        }


                        videoPlayer.removeAttribute(
                            'src'
                        );


                        videoPlayer.muted =
                            false;

                        videoPlayer.volume =
                            1;


                        videoPlayer.play()
                            .catch(() => {});


                        startAntiSleepAudio();

                        requestWakeLock();


                        connectionStatus.textContent =
                            'Статус: Нове відео отримано.';

                    }
                );


                call.on(
                    'close',
                    () => {

                        if (
                            activeCall === call
                        ) {

                            activeCall =
                                null;

                        }

                    }
                );


                call.on(
                    'error',
                    () => {

                        if (
                            activeCall === call
                        ) {

                            activeCall =
                                null;

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage(message) {

    if (
        !conn ||
        !conn.open
    ) {
        return false;
    }


    try {

        conn.send(
            JSON.stringify(
                message
            )
        );

        return true;

    } catch (e) {

        return false;

    }

}


/* =========================================================
   SCREEN INFO
========================================================= */

function sendScreenInfo() {

    sendMessage({

        type:
            'screen_info',

        width:
            window.innerWidth,

        height:
            window.innerHeight,

        position:
            positionSelect.value,

        videoMode:
            videoModeSelect.value

    });

}


/* =========================================================
   STREAMING
========================================================= */

function startStreaming() {

    if (
        !isHost ||
        videoModeSelect.value !== 'stream'
    ) {

        return;

    }


    if (
        !conn ||
        !conn.open
    ) {

        return;

    }


    if (activeCall) {

        try {
            activeCall.close();
        } catch (e) {}

        activeCall =
            null;

    }


    try {

        /*
           Замість прямого 4K/60fps captureStream
           створюємо стабільний максимум Full HD
           1920x1080 / 30fps.

           Це має зменшити WebRTC-артефакти
           ("сніг") на S10.
        */

        const stream =
            createFullHDStream();


        if (!stream) {

            /*
               Запасний варіант:
               якщо canvas captureStream
               недоступний.
            */

            const fallbackStream =
                videoPlayer.captureStream
                ?
                videoPlayer.captureStream()
                :
                (
                    videoPlayer.mozCaptureStream
                    ?
                    videoPlayer.mozCaptureStream()
                    :
                    null
                );


            if (!fallbackStream) {
                return;
            }


            const newCall =
                peer.call(
                    conn.peer,
                    fallbackStream
                );


            if (!newCall) {
                return;
            }


            activeCall =
                newCall;


            newCall.on(
                'close',
                () => {

                    if (
                        activeCall === newCall
                    ) {

                        activeCall =
                            null;

                    }

                }
            );


            newCall.on(
                'error',
                () => {

                    if (
                        activeCall === newCall
                    ) {

                        activeCall =
                            null;

                    }

                }
            );


            return;

        }


        const newCall =
            peer.call(
                conn.peer,
                stream
            );


        if (!newCall) {
            return;
        }


        activeCall =
            newCall;


        newCall.on(
            'close',
            () => {

                if (
                    activeCall === newCall
                ) {

                    activeCall =
                        null;

                }

            }
        );


        newCall.on(
            'error',
            () => {

                if (
                    activeCall === newCall
                ) {

                    activeCall =
                        null;

                }

            }
        );


    } catch (e) {}

}


/* =========================================================
   STATE
========================================================= */

function sendStreamState() {

    if (
        !isHost ||
        !conn ||
        !conn.open ||
        videoModeSelect.value !== 'stream'
    ) {

        return;

    }


    const duration =
        Number(
            videoPlayer.duration
        );


    const time =
        Number(
            videoPlayer.currentTime
        );


    sendMessage({

        type:
            'stream_state',

        time:
            Number.isFinite(time)
            ?
            time
            :
            0,

        duration:
            Number.isFinite(duration)
            ?
            duration
            :
            0,

        paused:
            videoPlayer.paused

    });

}


function sendSyncState() {

    if (
        !isHost ||
        !conn ||
        !conn.open ||
        videoModeSelect.value !== 'local'
    ) {

        return;

    }


    sendMessage({

        type:
            'sync_state',

        time:
            videoPlayer.currentTime,

        paused:
            videoPlayer.paused

    });

}


function broadcastSeek(time) {

    if (
        !isHost ||
        !conn ||
        !conn.open
    ) {

        return;

    }


    sendMessage({

        type:
            'seek',

        time:
            time,

        paused:
            videoPlayer.paused

    });

}

   HOST PLAY / PAUSE / RESTART

function hostPlay() {

    videoPlayer.playbackRate =

    videoPlayer.play()
        .catch(() => {});


    playPauseBtn.textContent =

function hostPause() {

function hostRestart() {

    } catch (e) {}


    videoPlayer.playbackRate =
        1;


    videoPlayer.play()
        .catch(() => {});


    playPauseBtn.textContent =
        '❚❚ Пауза';


    startAntiSleepAudio();


    sendSyncState();

    sendStreamState();

}


/* =========================================================
   CONNECTION
========================================================= */

function setupConnection() {

    const handleReady =
        () => {

            connectionStatus.textContent =
                'Статус: Підключено!';


            sendScreenInfo();


            setTimeout(
                () => {

                    setupCard.style.display =
                        'none';

                    playerScreen.style.display =
                        'block';


                    timelineContainer.style.display =
                        'flex';


                    updateVideoStyle();

                    startAntiSleepAudio();


                    if (isHost) {

                        videoPlayer.muted =
                            false;

                        videoPlayer.volume =
                            1;


                        videoPlayer.play()
                            .catch(() => {});


                        playPauseBtn.textContent =
                            '❚❚ Пауза';


                        setTimeout(
                            () => {

                                if (
                                    videoModeSelect.value === 'stream'
                                ) {

                                    startStreaming();

                                }


                                sendStreamState();

                                sendSyncState();

                            },
                            700
                        );


                        if (syncInterval) {

                            clearInterval(
                                syncInterval
                            );

                        }


                        syncInterval =
                            setInterval(
                                () => {

                                    if (
                                        conn &&
                                        conn.open
                                    ) {

                                        if (
                                            videoModeSelect.value === 'stream'
                                        ) {

                                            sendStreamState();

                                        } else {

                                            sendSyncState();

                                        }

                                    }

                                },
                                300
                            );

                    } else {

                        playPauseBtn.textContent =
                            '▶ Грати';

                    }

                },
                300
            );

        };


    if (
        conn.open
    ) {

        handleReady();

    } else {

        conn.on(
            'open',
            handleReady
        );

    }


    conn.on(
        'data',
        (data) => {

            try {

                const msg =
                    typeof data === 'string'
                    ?
                    JSON.parse(data)
                    :
                    data;


                /* =========================================
                   SCREEN INFO
                ========================================= */

                if (
                    msg.type === 'screen_info'
                ) {

                    partnerWidth =
                        Number(
                            msg.width
                        ) || 0;

                    partnerHeight =
                        Number(
                            msg.height
                        ) || 0;


                    updateVideoStyle();


                    if (
                        isHost
                    ) {

                        sendScreenInfo();

                    }

                }


                /* =========================================
                   VIDEO CHANGE START
                ========================================= */

                else if (
                    msg.type === 'video_change_start' &&
                    !isHost
                ) {

                    clearRemoteVideo();


                    connectionStatus.textContent =
                        'Статус: Головний телефон змінює відео...';

                }


                /* =========================================
                   VIDEO CHANGE READY
                ========================================= */

                else if (
                    msg.type === 'video_change_ready' &&
                    !isHost
                ) {

                    remoteVideoDuration =
                        Number(
                            msg.duration
                        ) || 0;

                    remoteVideoTime =
                        0;

                    remoteVideoPaused =
                        false;


                    timelineRange.value =
                        0;


                    timeDisplay.textContent =
                        `00:00 / ${formatTime(remoteVideoDuration)}`;


                    connectionStatus.textContent =
                        'Статус: Очікування нового відеопотоку...';

                }


                /* =========================================
                   STREAM STATE
                ========================================= */

                else if (
                    msg.type === 'stream_state' &&
                    !isHost
                ) {

                    remoteVideoTime =
                        Number(
                            msg.time
                        ) || 0;

                    remoteVideoDuration =
                        Number(
                            msg.duration
                        ) || 0;

                    remoteVideoPaused =
                        !!msg.paused;


                    if (
                        remoteVideoDuration > 0 &&
                        !isDraggingTimeline
                    ) {

                        const percent =
                            (
                                remoteVideoTime /
                                remoteVideoDuration
                            ) * 100;


                        timelineRange.value =
                            Math.max(
                                0,
                                Math.min(
                                    100,
                                    percent
                                )
                            );


                        timeDisplay.textContent =
                            `${formatTime(remoteVideoTime)} / ${formatTime(remoteVideoDuration)}`;

                    }


                    if (
                        remoteVideoPaused
                    ) {

                        videoPlayer.pause();

                        playPauseBtn.textContent =
                            '▶ Грати';

                    } else {

                        if (
                            videoPlayer.paused
                        ) {

                            videoPlayer.play()
                                .catch(() => {});

                        }


                        playPauseBtn.textContent =
                            '❚❚ Пауза';


                        startAntiSleepAudio();

                        requestWakeLock();

                    }

                }


                /* =========================================
                   LOCAL SYNC
                ========================================= */

                else if (
                    msg.type === 'sync_state' &&
                    !isHost &&
                    videoModeSelect.value === 'local'
                ) {

                    if (
                        videoPlayer.srcObject
                    ) {

                        return;

                    }


                    if (
                        isDraggingTimeline
                    ) {

                        return;

                    }


                    const hostTime =
                        Number(
                            msg.time
                        );


                    if (
                        !Number.isFinite(
                            hostTime
                        )
                    ) {

                        return;

                    }


                    const current =
                        videoPlayer.currentTime;


                    const diff =
                        current -
                        hostTime;


                    if (
                        Math.abs(diff) > 0.25
                    ) {

                        try {

                            videoPlayer.currentTime =
                                Math.max(
                                    0,
                                    hostTime
                                );

                        } catch (e) {}


                        videoPlayer.playbackRate =
                            1;

                    } else if (
                        Math.abs(diff) > 0.035
                    ) {

                        let rate =
                            1 -
                            diff * 0.08;


                        rate =
                            Math.max(
                                0.97,
                                Math.min(
                                    1.03,
                                    rate
                                )
                            );


                        videoPlayer.playbackRate =
                            rate;

                    } else {

                        videoPlayer.playbackRate =
                            1;

                    }


                    if (
                        msg.paused
                    ) {

                        videoPlayer.pause();

                        playPauseBtn.textContent =
                            '▶ Грати';

                    } else {

                        videoPlayer.play()
                            .catch(() => {});


                        playPauseBtn.textContent =
                            '❚❚ Пауза';


                        startAntiSleepAudio();

                        requestWakeLock();

                    }

                }


                /* =========================================
                   SEEK
                ========================================= */

                else if (
                    msg.type === 'seek'
                ) {

                    if (
                        !isDraggingTimeline
                    ) {

                        if (
                            videoModeSelect.value === 'stream'
                        ) {

                            remoteVideoTime =
                                Number(
                                    msg.time
                                ) || 0;


                            if (
                                remoteVideoDuration > 0
                            ) {

                                timelineRange.value =
                                    (
                                        remoteVideoTime /
                                        remoteVideoDuration
                                    ) * 100;


                                timeDisplay.textContent =
                                    `${formatTime(remoteVideoTime)} / ${formatTime(remoteVideoDuration)}`;

                            }

                        } else if (
                            !videoPlayer.srcObject
                        ) {

                            try {

                                videoPlayer.currentTime =
                                    Math
